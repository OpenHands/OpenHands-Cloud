name: E2E Static Checks

on:
  pull_request:
    paths:
      - ".github/workflows/budget-e2e.yml"
      - ".github/workflows/e2e-static.yml"
      - "e2e_tests/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e_tests/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint and type-check
        run: npm run lint
      - name: Discover Chromium tests
        env:
          BASE_URL: https://release-under-test.invalid
          RETURNING_GITHUB_USERNAME: discovery-placeholder
        run: npx playwright test --project=chromium:returning --list
      - name: Validate ReportPortal configuration contract
        env:
          BASE_URL: https://release-under-test.invalid
          RETURNING_GITHUB_USERNAME: discovery-placeholder
        run: |
          if REPORTPORTAL_ENABLED=true \
            npx playwright test --project=chromium:returning --list --reporter=list \
            > /tmp/reportportal-error.log 2>&1; then
            echo "ReportPortal unexpectedly accepted missing configuration" >&2
            exit 1
          fi
          grep -F "REPORTPORTAL_ENDPOINT is required" /tmp/reportportal-error.log

          python3 -m http.server 41999 > /tmp/reportportal-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1

          REPORTPORTAL_ENABLED=true \
          REPORTPORTAL_ENDPOINT=http://127.0.0.1:41999/api/v2 \
          REPORTPORTAL_PROJECT=openhands \
          REPORTPORTAL_API_KEY=not-a-real-key \
          REPORTPORTAL_ENVIRONMENT=development \
          REPORTPORTAL_REVISION=0123456789abcdef \
          REPORTPORTAL_WORKFLOW=openhands-e2e-example \
            npx playwright test --project=chromium:returning --list \
            > /tmp/reportportal-agent.log 2>&1
          grep -F '"POST /api/v2/openhands/launch HTTP/1.1" 501 -' \
            /tmp/reportportal-server.log
