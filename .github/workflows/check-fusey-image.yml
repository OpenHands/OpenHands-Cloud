name: Check fusey image

# Blocking check on release-please PRs: the fusey image the charts name must be
# published for both architectures. The chart derives its tag from the
# agent-server tag and the fusey version (see scripts/fusey_image.py), so a
# release cannot ship pointing at an image that was never built.
#
# The image is built by the "Build Fusey Image" workflow in OpenHands/runtime-api.
# On failure the log names the inputs to run it with. Nothing reruns this check
# when that build ends, so the check waits for it.

on:
  # Deliberately unfiltered by path, for the reason check-agent-server-sync.yml
  # gives: an always-triggered workflow can be a required check without leaving
  # skipped PRs pending forever.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-fusey-image:
    name: Check fusey image
    # On any other PR the job skips, which reports as success.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.head_ref, 'release-please--')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Check the image is published
        shell: bash
        run: |
          status=0
          uv run scripts/fusey_image.py --wait 1200 --interval 30 > report.txt 2>&1 || status=$?
          cat report.txt
          {
            echo '### Fusey image'
            echo
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
