name: Scan Docker Images

env:
  REGISTRY: ghcr.io
on:
  workflow_call:
    inputs:
      enforce:
        description: "Fail the job when the scan reports a finding (CRITICAL and HIGH by default; only fixed, non-ignored ones). Otherwise it only reports. When called from another repo, the caller must contain charts/openhands/values.yaml, charts/openhands/charts/runtime-api/values.yaml, scripts/wait_for_image_manifest.py and .trivyignore.yaml, because checkout fetches the caller's repo. The runner needs yq and jq."
        type: boolean
        default: false
      severity:
        description: Comma-separated severities to report (and fail on, when enforce is true). Defaults to CRITICAL,HIGH.
        type: string
  pull_request:
    paths:
      - 'charts/**'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
jobs:
  discover_images:
    name: Discover Images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.extract.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract image references from charts
        id: extract
        run: |
          # Extract image tags from chart values using yq
          RUNTIME_API_TAG=$(yq '.image.tag' charts/openhands/charts/runtime-api/values.yaml)
          ENTERPRISE_TAG=$(yq '.image.tag' charts/openhands/values.yaml)
          AGENT_SERVER_TAG=$(yq '.global.agentServerImage.tag' charts/openhands/values.yaml)

          # Build the image list as JSON array
          IMAGES=$(jq -n -c \
            --arg runtime_api "openhands/runtime-api:${RUNTIME_API_TAG}" \
            --arg enterprise "openhands/enterprise-server:${ENTERPRISE_TAG}" \
            --arg agent_server "openhands/agent-server:${AGENT_SERVER_TAG}" \
            '[$runtime_api, $enterprise, $agent_server]')

          echo "images=${IMAGES}" >> "$GITHUB_OUTPUT"
          echo "Discovered images: ${IMAGES}"

  scan_docker_images:
    name: Scan
    runs-on: ubuntu-latest
    needs: discover_images
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        IMAGE: ${{ fromJson(needs.discover_images.outputs.images) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for image manifest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ matrix.IMAGE }}
        run: |
          python3 scripts/wait_for_image_manifest.py "$IMAGE_REF"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.IMAGE }}
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: ${{ inputs.enforce && '1' || '0' }}
          severity: ${{ inputs.severity || 'CRITICAL,HIGH' }}
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          timeout: '10m'
          scanners: 'vuln'  # Only scan vulnerabilities, not secrets/config

      - name: Publish scan results
        if: ${{ !cancelled() && hashFiles('trivy-results.txt') != '' }}
        env:
          IMAGE: ${{ matrix.IMAGE }}
        run: |
          # GitHub drops a job summary larger than 1 MiB
          limit=900000
          {
            echo "### ${IMAGE}"
            echo '```'
            head -c "$limit" trivy-results.txt
            echo
            echo '```'
            if [ "$(wc -c < trivy-results.txt)" -gt "$limit" ]; then
              echo "Table cut at ${limit} bytes. The job log has the full table."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat trivy-results.txt
