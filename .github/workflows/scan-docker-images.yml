name: Scan Docker Images

env:
  REGISTRY: ghcr.io
on:
  workflow_call:
    inputs:
      enforced_images:
        description: Comma-separated image names (for example runtime-api,agent-server) whose scan fails the job on a finding. Other images only report.
        type: string
      severity:
        description: Comma-separated severities to report, and to fail on for enforced images. Defaults to CRITICAL.
        type: string
  pull_request:
    paths:
      - 'charts/**'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
jobs:
  discover_images:
    name: Discover Images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.extract.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract image references from charts
        id: extract
        run: |
          # Extract image tags from chart values using yq
          RUNTIME_API_TAG=$(yq '.image.tag' charts/openhands/charts/runtime-api/values.yaml)
          ENTERPRISE_TAG=$(yq '.image.tag' charts/openhands/values.yaml)
          AGENT_SERVER_TAG=$(yq '.global.agentServerImage.tag' charts/openhands/values.yaml)

          # Build the image list as JSON array
          IMAGES=$(jq -n -c \
            --arg runtime_api "openhands/runtime-api:${RUNTIME_API_TAG}" \
            --arg enterprise "openhands/enterprise-server:${ENTERPRISE_TAG}" \
            --arg agent_server "openhands/agent-server:${AGENT_SERVER_TAG}" \
            '[$runtime_api, $enterprise, $agent_server]')

          echo "images=${IMAGES}" >> "$GITHUB_OUTPUT"
          echo "Discovered images: ${IMAGES}"

  scan_docker_images:
    name: Scan
    runs-on: ubuntu-latest
    needs: discover_images
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
    strategy:
      matrix:
        IMAGE: ${{ fromJson(needs.discover_images.outputs.images) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for image manifest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ matrix.IMAGE }}
        run: |
          python3 scripts/wait_for_image_manifest.py "$IMAGE_REF"

      - name: Decide whether this image is enforced
        id: policy
        env:
          IMAGE: ${{ matrix.IMAGE }}
          ENFORCED_IMAGES: ${{ inputs.enforced_images }}
        run: |
          name="${IMAGE%%:*}"
          name="${name##*/}"
          case ",${ENFORCED_IMAGES// /}," in
            *",${name},"*) echo "exit_code=1" >> "$GITHUB_OUTPUT" ;;
            *) echo "exit_code=0" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.IMAGE }}
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: ${{ steps.policy.outputs.exit_code }}
          severity: ${{ inputs.severity || 'CRITICAL' }}
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          timeout: '10m'
          scanners: 'vuln'  # Only scan vulnerabilities, not secrets/config

      - name: Publish scan results
        if: ${{ !cancelled() && hashFiles('trivy-results.txt') != '' }}
        env:
          IMAGE: ${{ matrix.IMAGE }}
        run: |
          {
            echo "### ${IMAGE}"
            echo '```'
            cat trivy-results.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
