name: Release gate (unstable E2E)

# Blocks the openhands release-please PR unless an unstable E2E that ran on the
# newest unstable deploy passed. A green run from before that deploy tested an
# older build than the one this release would ship.
# Enforce by adding the `release-gate` context to the main ruleset.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_run:
    workflows: ["Release Replicated to Unstable"]
    types: [completed]
  # Scheduled Argo runs fire no GitHub event, so nothing else would re-evaluate
  # a blocked release PR when the signal recovers.
  schedule:
    - cron: "*/15 * * * *"

permissions: {}

defaults:
  run:
    # Some reasonable default args to any bash invocation usage
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  RELEASE_PR_BRANCH: "release-please--branches--main--components--openhands"
  OVERRIDE_LABEL: "override-e2e-gate"
  ARGO_NAMESPACE: "openhands-e2e"
  ARGO_BASE: "https://workflows.dev.all-hands.dev"
  E2E_INSTANCE: "unstable"
  DEPLOY_WORKFLOW: "release-replicated-unstable.yml"
  # Must stay under Argo's 24h ttlStrategy, or aged-out runs read as "no run".
  E2E_MAX_AGE_HOURS: "20"

jobs:
  release-gate:
    name: release-gate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'release-please--branches--main--components--openhands' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    # No `environment:` - e2e-replicated rejects refs/pull/N/merge, so the gate
    # token is repo-level. Safe: it is read-only, no submit, no Secrets.
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Evaluate release gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARGO_GATE_TOKEN: ${{ secrets.ARGO_WORKFLOWS_GATE_TOKEN }}
        run: |
          {
            echo "### Release gate (unstable E2E)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # The newest unstable deploy is the build this release would ship. A
          # green E2E that finished before it landed says nothing about it: on
          # 2026-11-05 a release merged on such a result six minutes after an
          # image bump, before the E2E for that bump had started.
          deploy=$(gh api "repos/${REPO}/actions/workflows/${DEPLOY_WORKFLOW}/runs?branch=main&per_page=1" \
            --jq '.workflow_runs[0] // empty
              | [.id, .run_attempt, .status, (.conclusion // "none"), .head_sha, .updated_at, .html_url]
              | @tsv')
          if [ -z "$deploy" ]; then
            echo "::error::no ${DEPLOY_WORKFLOW} run found on main"
            echo "| Unstable deploy | **no run** — blocked |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          IFS=$'\t' read -r deploy_id deploy_attempt deploy_status deploy_conclusion deploy_sha deploy_updated deploy_url <<<"$deploy"
          deploy_short=${deploy_sha:0:8}

          deployed_at=""
          if [ "$deploy_status" = "completed" ] && [ "$deploy_conclusion" = "success" ]; then
            deployed_at=$(gh api "repos/${REPO}/actions/runs/${deploy_id}/attempts/${deploy_attempt}/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name | startswith("deploy /")) | .completed_at // empty] | first // empty')
          fi

          listing=$(curl --fail-with-body --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${ARGO_GATE_TOKEN}" \
            "${ARGO_BASE}/api/v1/workflows/${ARGO_NAMESPACE}") || {
              echo "::error::could not reach Argo to read the ${E2E_INSTANCE} E2E result"
              echo "| E2E result | **Argo unreachable** — blocked |" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }

          # Runs that tested the deployed build: the one this deploy triggered
          # (matched by name, so clock skew cannot drop it), plus any scheduled
          # or manual run created after the deploy finished. Running runs stay
          # in the list so the gate can say "pending" instead of reading an
          # older result.
          runs=$(jq -c \
            --arg prefix "openhands-e2e-${E2E_INSTANCE}-" \
            --arg own "openhands-e2e-${E2E_INSTANCE}-gh-${deploy_id}-" \
            --arg since "$deployed_at" '
            [ (.items // [])[]
              | select($since != "")
              | select(.metadata.name | startswith($prefix))
              | select((.metadata.name | startswith($own)) or (.metadata.creationTimestamp >= $since))
              | {name: .metadata.name, phase: (.status.phase // "Pending"), finished: (.status.finishedAt // "")}
            ]' <<<"$listing")
          in_flight=$(jq '[.[] | select(.finished == "")] | length' <<<"$runs")
          signal=$(jq -r '
            [.[] | select(.finished != "")] | sort_by(.finished) | last
            | if . == null then empty else [.name, .phase, .finished] | @tsv end
          ' <<<"$runs")

          wf_name=""
          E2E_CONCLUSION=""
          signal_time=""
          run_url="$deploy_url"
          latest_cell="—"
          if [ -n "$signal" ]; then
            IFS=$'\t' read -r wf_name E2E_CONCLUSION signal_time <<<"$signal"
            run_url="${ARGO_BASE}/workflows/${ARGO_NAMESPACE}/${wf_name}"
            latest_cell="[\`${wf_name}\`](${run_url}) \`${E2E_CONCLUSION}\` at ${signal_time}"
          fi

          {
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Unstable deploy | [\`${deploy_short}\`](${deploy_url}) \`${deploy_status}/${deploy_conclusion}\` |"
            echo "| Deployed at | ${deployed_at:-—} |"
            echo "| E2E runs since deploy | $(jq length <<<"$runs") (${in_flight} running) |"
            echo "| Latest finished E2E | ${latest_cell} |"
          } >> "$GITHUB_STEP_SUMMARY"

          gate_reason=""
          if [ "$deploy_status" != "completed" ]; then
            gate_reason="unstable deploy of ${deploy_short} is still ${deploy_status}"
            signal_time="$deploy_updated"
          elif [ "$deploy_conclusion" != "success" ]; then
            gate_reason="unstable deploy of ${deploy_short} finished ${deploy_conclusion}"
            signal_time="$deploy_updated"
          elif [ -z "$deployed_at" ]; then
            gate_reason="unstable run for ${deploy_short} did not deploy"
            signal_time="$deploy_updated"
          elif [ -z "$signal" ] && [ "$in_flight" -gt 0 ]; then
            gate_reason="${E2E_INSTANCE} E2E for deploy ${deploy_short} is still running"
            signal_time="$deployed_at"
          elif [ -z "$signal" ]; then
            gate_reason="no ${E2E_INSTANCE} E2E has run since deploy ${deploy_short} finished at ${deployed_at}"
            signal_time="$deployed_at"
          elif [ "$E2E_CONCLUSION" != "Succeeded" ]; then
            gate_reason="latest ${E2E_INSTANCE} E2E for deploy ${deploy_short} finished ${E2E_CONCLUSION}"
          fi

          signal_epoch=$(date -u -d "$signal_time" +%s)
          if [ -z "$gate_reason" ]; then
            age_h=$(( ($(date -u +%s) - signal_epoch) / 3600 ))
            if [ "$age_h" -gt "$E2E_MAX_AGE_HOURS" ]; then
              gate_reason="latest ${E2E_INSTANCE} E2E is stale (${age_h}h old, max ${E2E_MAX_AGE_HOURS}h)"
            else
              echo "${E2E_INSTANCE} E2E ${wf_name} passed on deploy ${deploy_short} (${age_h}h old)."
              exit 0
            fi
          fi

          labels=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" --jq '.[].name')
          if ! grep -Fxq "$OVERRIDE_LABEL" <<<"$labels"; then
            echo "::error::${gate_reason} — blocking the release PR. ${run_url}"
            exit 1
          fi

          events=$(gh api --paginate --slurp \
            "repos/${REPO}/issues/${PR_NUMBER}/events?per_page=100")
          applier_when=$(jq -r --arg label "$OVERRIDE_LABEL" '
            [.[][] | select(.event == "labeled" and .label.name == $label)]
            | last
            | if . == null then empty else [.actor.login, .created_at] | @tsv end
          ' <<<"$events")
          IFS=$'\t' read -r applier override_when <<<"$applier_when"

          if [ -z "${applier:-}" ] || [ -z "${override_when:-}" ]; then
            echo "::error::${OVERRIDE_LABEL} is present but no event records who applied it"
            exit 1
          fi

          override_epoch=$(date -u -d "$override_when" +%s)
          if [ "$override_epoch" -le "$signal_epoch" ]; then
            echo "::error::override by ${applier} at ${override_when} predates the signal at ${signal_time}; remove and reapply ${OVERRIDE_LABEL} to authorize this result"
            exit 1
          fi

          perm=$(gh api "repos/${REPO}/collaborators/${applier}/permission" \
            --jq '.permission' 2>/dev/null || echo "none")
          case "$perm" in
            admin|write|maintain) ;;
            *)
              echo "::error::${OVERRIDE_LABEL} was applied by ${applier}, who lacks write permission (${perm})"
              exit 1
              ;;
          esac

          {
            echo ""
            echo "> [!WARNING]"
            echo "> **E2E release gate overridden.**"
            echo ">"
            echo "> ${gate_reason}; override applied by \`${applier}\` (\`${perm}\`) at ${override_when}."
          } >> "$GITHUB_STEP_SUMMARY"

          marker="<!-- release-gate-override:${override_when} -->"
          comments=$(gh api --paginate --slurp \
            "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100")
          already_recorded=$(jq -r --arg marker "$marker" \
            'any(.[][]; .body | contains($marker))' <<<"$comments")
          if [ "$already_recorded" != "true" ]; then
            body=$(printf '%s\n\n%s\n\n%s' \
              "🟡 **E2E release gate overridden** by \`${applier}\` (\`${perm}\`) at ${override_when}. ${gate_reason}; unstable → beta is allowed for this signal only." \
              "$marker" \
              "_Posted automatically by an AI-assisted workflow on behalf of the OpenHands-Cloud maintainers._")
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$body"
          fi

          echo "Override honored for the signal at ${signal_time}."

  refresh-release-gate:
    name: Refresh release gate
    if: github.event_name == 'workflow_run' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Rerun the open release PR gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pr=$(gh api "repos/${REPO}/pulls?state=open&per_page=100" | jq -c \
            --arg repo "$REPO" --arg branch "$RELEASE_PR_BRANCH" '
              first(.[] | select(
                .base.ref == "main" and
                .head.ref == $branch and
                .head.repo.full_name == $repo
              )) // empty
            ')
          if [ -z "$pr" ]; then
            echo "No open openhands release PR; nothing to refresh."
            exit 0
          fi

          sha=$(jq -r '.head.sha' <<<"$pr")
          gate_run=$(gh api \
            "repos/${REPO}/actions/workflows/release-gate.yml/runs?event=pull_request&per_page=100" \
            | jq -c --arg sha "$sha" \
              'first(.workflow_runs[] | select(.head_sha == $sha)) // empty')
          if [ -z "$gate_run" ]; then
            echo "::warning::No release-gate run found for release PR head ${sha}."
            exit 0
          fi

          run_id=$(jq -r '.id' <<<"$gate_run")
          status=$(jq -r '.status' <<<"$gate_run")
          if [ "$status" != "completed" ]; then
            echo "Release gate ${run_id} is ${status}; leaving it alone."
            exit 0
          fi
          # A rerun request races the run finishing, so a 403 here is expected
          # and must not redden a job that fires every 15 minutes.
          if gh api --method POST "repos/${REPO}/actions/runs/${run_id}/rerun"; then
            echo "Rerunning release gate ${run_id} for release PR head ${sha}."
          else
            echo "::notice::Release gate ${run_id} could not be rerun right now."
          fi
