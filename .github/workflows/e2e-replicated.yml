name: E2E Replicated

on:
  workflow_call:
    inputs:
      instance:
        type: string
        required: true

permissions: {}

jobs:
  trigger-e2e:
    environment: e2e-replicated
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Trigger Replicated E2E
        id: trigger-e2e
        shell: bash
        env:
          ARGO_TOKEN: ${{ secrets.ARGO_WORKFLOWS_E2E_TOKEN }}
          INSTANCE: ${{ inputs.instance }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Argo answers an event that matches no binding with 200 {}, the same
          # as a dispatched one, so a caller typo would otherwise pass silently.
          case "$INSTANCE" in
            unstable|beta|stable) ;;
            *) echo "::error::unknown instance \"$INSTANCE\"" ; exit 1 ;;
          esac

          workflow_name="openhands-e2e-${INSTANCE}-gh-${RUN_ID}-${RUN_ATTEMPT}"
          echo "workflow-name=${workflow_name}" >> "$GITHUB_OUTPUT"
          payload=$(jq -n \
            --arg instance "$INSTANCE" \
            --argjson run_id "$RUN_ID" \
            --argjson run_attempt "$RUN_ATTEMPT" \
            '{
              instance: $instance,
              run_id: $run_id,
              run_attempt: $run_attempt
            }')
          # Deliberately not retried: a second attempt whose first already landed
          # starts a duplicate suite.
          curl --fail-with-body --silent --show-error --max-time 20 \
            --request POST \
            --header "Authorization: Bearer ${ARGO_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            https://workflows.dev.all-hands.dev/api/v1/events/openhands-e2e/replicated-deploy

      - name: Wait for Replicated E2E
        id: wait-for-e2e
        shell: bash
        env:
          ARGO_TOKEN: ${{ secrets.ARGO_WORKFLOWS_E2E_TOKEN }}
          INSTANCE: ${{ inputs.instance }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          WORKFLOW_NAME="openhands-e2e-${INSTANCE}-gh-${RUN_ID}-${RUN_ATTEMPT}"
          WORKFLOW_API="https://workflows.dev.all-hands.dev/api/v1/workflows/openhands-e2e/${WORKFLOW_NAME}"
          deadline=$(( $(date +%s) + 3060 ))
          phase=""

          while (( $(date +%s) < deadline )); do
            response=$(mktemp)
            http_code=$(curl --silent --show-error --max-time 20 \
              --output "$response" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${ARGO_TOKEN}" \
              "$WORKFLOW_API") || http_code=000

            if [[ "$http_code" == 404 || "$http_code" == 000 ]]; then
              rm -f "$response"
              sleep 15
              continue
            fi
            if [[ "$http_code" != 200 ]]; then
              echo "::error::Argo returned HTTP ${http_code} for ${WORKFLOW_NAME}"
              rm -f "$response"
              phase="Error"
              break
            fi

            phase=$(jq -r '.status.phase // empty' "$response")
            rm -f "$response"
            if [[ "$phase" == "Succeeded" || "$phase" == "Failed" || "$phase" == "Error" ]]; then
              break
            fi
            sleep 15
          done

          if [[ "$phase" != "Succeeded" && "$phase" != "Failed" && "$phase" != "Error" ]]; then
            echo "::error::Timed out waiting for ${WORKFLOW_NAME}"
            phase="Error"
          fi
          echo "phase=${phase}" >> "$GITHUB_OUTPUT"
          echo "Argo workflow ${WORKFLOW_NAME} completed with phase ${phase}." >> "$GITHUB_STEP_SUMMARY"

      - name: Report to incident.io
        if: ${{ always() && inputs.instance == 'unstable' }}
        shell: bash
        env:
          INCIDENT_IO_SOURCE_ID: ${{ vars.INCIDENT_IO_UNSTABLE_E2E_SOURCE_ID }}
          INCIDENT_IO_TOKEN: ${{ secrets.INCIDENT_IO_UNSTABLE_E2E_TOKEN }}
          E2E_PHASE: ${{ steps.wait-for-e2e.outputs.phase }}
          WORKFLOW_NAME: ${{ steps.trigger-e2e.outputs.workflow-name }}
        run: |
          if [[ -z "$INCIDENT_IO_SOURCE_ID" || -z "$INCIDENT_IO_TOKEN" ]]; then
            echo "::error::incident.io unstable E2E source is not configured"
            exit 1
          fi

          if [[ "$E2E_PHASE" == "Succeeded" ]]; then
            status="resolved"
            title="OpenHands unstable E2E is healthy"
          else
            status="firing"
            title="OpenHands unstable E2E is not green"
          fi
          source_url="https://workflows.dev.all-hands.dev/workflows/openhands-e2e/${WORKFLOW_NAME}"
          payload=$(jq -n \
            --arg status "$status" \
            --arg title "$title" \
            --arg phase "${E2E_PHASE:-Error}" \
            --arg source_url "$source_url" \
            '{
              deduplication_key: "openhands-cloud:replicated-e2e:unstable",
              status: $status,
              title: $title,
              description: ("Generated by OpenHands AI on behalf of the repository maintainers.\n\nArgo phase: **" + $phase + "**"),
              source_url: $source_url,
              metadata: {
                service: "openhands-cloud",
                team: "saas",
                environment: "unstable",
                check: "replicated-e2e"
              }
            }')
          curl --fail-with-body --silent --show-error --max-time 20 \
            --retry 3 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${INCIDENT_IO_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "https://api.incident.io/v2/alert_events/http/${INCIDENT_IO_SOURCE_ID}"

      - name: Enforce Replicated E2E result
        if: ${{ always() }}
        shell: bash
        env:
          E2E_PHASE: ${{ steps.wait-for-e2e.outputs.phase }}
        run: |
          if [[ "$E2E_PHASE" = "Succeeded" ]]; then
            exit 0
          fi
          echo "::error::Replicated E2E finished with phase ${E2E_PHASE:-unknown}"
          exit 1
