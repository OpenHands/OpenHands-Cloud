name: Release Replicated to Stable

# When an openhands release candidate is promoted, build the Replicated app from
# the stable tag and publish it to the stable channel, and to Beta when that
# doesn't take Beta backwards.
#
# The stable tag openhands/X.Y.Z sits on the same commit as the rc it promotes
# (see docs/releases.md), so this builds exactly what Beta tested. The only
# difference is the version: Chart.yaml at that commit still says the rc
# version, so it is stamped with X.Y.Z before the build.
#
# The patterns match openhands/0.94.0 but not openhands/0.94.0-rc.3 (excluded by
# the "!" pattern), nor openhands-secrets/0.1.25.
on:
  push:
    tags:
      - 'openhands/*'
      - '!openhands/*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: "openhands/<version> stable tag to (re)publish"
        required: true

env:
  # Change to Stable once this workflow has published one release correctly.
  STABLE_CHANNEL: StableTest

concurrency:
  group: release-replicated-stable-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  stable:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^openhands/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::${TAG} is not a stable openhands/X.Y.Z tag"
            exit 1
          fi
          {
            echo "tag=${TAG}"
            echo "version=${BASH_REMATCH[1]}"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing Replicated stable release for ${TAG}"

      - name: Checkout (at the release tag)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # v3
        with:
          version: 'v3.18.4'

      - name: Install Replicated CLI
        shell: bash
        run: |
          curl -s https://api.github.com/repos/replicatedhq/replicated/releases/latest \
            | grep "browser_download_url.*linux_amd64.tar.gz" \
            | cut -d : -f 2,3 \
            | tr -d \" \
            | wget -qi -
          mkdir -p /tmp/replicated-cli
          tar -xzf replicated_*_linux_amd64.tar.gz -C /tmp/replicated-cli replicated
          sudo mv /tmp/replicated-cli/replicated /usr/local/bin/

      - name: Stamp the stable version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # The Makefile reads the release version and every manifest's
          # chartVersion from Chart.yaml.
          yq -i ".version = \"${VERSION}\"" charts/openhands/Chart.yaml
          echo "charts/openhands/Chart.yaml version: $(yq .version charts/openhands/Chart.yaml)"

      - name: Build and publish to the stable channel
        id: release
        shell: bash
        env:
          REPLICATED_APP: ${{ secrets.REPLICATED_APP }}
          REPLICATED_API_TOKEN: ${{ secrets.REPLICATED_API_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # shell: bash adds -o pipefail, so a failing `make` fails the step even
          # though its output is piped to tee. A tag checkout has no branch, so
          # the channel is set explicitly.
          make release CHANNEL="$STABLE_CHANNEL" 2>&1 | tee release.log
          SEQUENCE=$(grep -oE 'SEQUENCE:[[:space:]]*[0-9]+' release.log | grep -oE '[0-9]+' | tail -1)
          if [ -z "$SEQUENCE" ]; then
            echo "::error::Could not parse a release SEQUENCE from the Replicated CLI output"
            exit 1
          fi
          URL="https://vendor.replicated.com/apps/openhands/releases/${SEQUENCE}/overview"
          echo "sequence=${SEQUENCE}" >> "$GITHUB_OUTPUT"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Replicated ${STABLE_CHANNEL} release ${SEQUENCE}::${URL}"

      - name: Promote to Beta
        id: beta
        shell: bash
        env:
          REPLICATED_APP: ${{ secrets.REPLICATED_APP }}
          REPLICATED_API_TOKEN: ${{ secrets.REPLICATED_API_TOKEN }}
          SEQUENCE: ${{ steps.release.outputs.sequence }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # Beta receives every rc. Promoting this release there is only safe when
          # its rc is the newest one; otherwise Beta already runs newer code (a
          # later rc, or a backport promoted after main moved on), and this
          # release would take it backwards.
          NEWEST_RC=$(git tag --list 'openhands/*-rc.*' --sort=-v:refname | sed -n 1p)
          NEWEST_RC_SHA=$(git rev-parse "${NEWEST_RC}^{commit}")
          if [ "$NEWEST_RC_SHA" != "$(git rev-parse HEAD)" ]; then
            echo "Beta already has ${NEWEST_RC}, which is newer than this release; leaving Beta alone."
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          replicated release promote "$SEQUENCE" Beta --version "$VERSION" --app "$REPLICATED_APP"
          echo "promoted=true" >> "$GITHUB_OUTPUT"

      - name: Tag the commit with the release sequence
        env:
          SEQUENCE: ${{ steps.release.outputs.sequence }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          TAG="Replicated/${STABLE_CHANNEL}/${SEQUENCE}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin — leaving it in place."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" \
            -m "Replicated ${STABLE_CHANNEL} release ${SEQUENCE} for ${RELEASE_TAG}" \
            -m "${RELEASE_URL}"
          git push origin "${TAG}"

      - name: Summary
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          SEQUENCE: ${{ steps.release.outputs.sequence }}
          URL: ${{ steps.release.outputs.url }}
          BETA: ${{ steps.beta.outputs.promoted }}
        run: |
          {
            echo "### Replicated stable release published"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Channel | ${STABLE_CHANNEL} |"
            echo "| Also promoted to Beta | ${BETA} |"
            echo "| Release tag | \`${RELEASE_TAG}\` |"
            echo "| Sequence | ${SEQUENCE} |"
            echo "| Vendor portal | [Release ${SEQUENCE} overview](${URL}) |"
          } >> "$GITHUB_STEP_SUMMARY"
