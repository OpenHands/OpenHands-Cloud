apiVersion: v1
kind: Namespace
metadata:
  name: openhands-runtimes
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sysbox-storage-smoke
  namespace: openhands-runtimes
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: sysbox-storage-smoke
  namespace: openhands-runtimes
spec:
  runtimeClassName: sysbox-runc
  hostUsers: false
  restartPolicy: Never
  containers:
    - name: smoke
      image: ubuntu:24.04
      command: [bash, -lc]
      args:
        - 'set -eu; id; uname -r; echo aks-sysbox-storage-ok > /workspace/probe.txt; cat /workspace/probe.txt; test -w /workspace; echo SYSBOX_AZURE_DISK_PASS'
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 512Mi
      volumeMounts:
        - name: workspace
          mountPath: /workspace
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: sysbox-storage-smoke
