# Generated by scripts/support_bundle_config.py from replicated/config.yaml.
# Do not edit by hand: run the script, and keep the two in sync (the check
# runs in CI from scripts/test_support_bundle_config.py).
#
# Saves the non-secret Admin Console settings to kots/admin-console/config.yaml in each
# support bundle. KOTS renders the values when the release is deployed (and
# merges this spec with the chart's), re-rendering on every config change.
# Password and file items are left out, as are the items the generator names
# in EXCLUDED. A value is recorded whether or not its item is currently shown
# (its `when` condition is not evaluated here).
apiVersion: troubleshoot.sh/v1beta2
kind: SupportBundle
metadata:
  name: openhands-admin-console-config
spec:
  collectors:
    - data:
        name: kots/admin-console/config.yaml
        data: |
          # Domain Configuration
          domain_configuration:
            hostname_mode: repl{{ ConfigOption "hostname_mode" | mustToJson }}
            base_domain: repl{{ ConfigOption "base_domain" | mustToJson }}
            app_hostname: repl{{ ConfigOption "app_hostname" | mustToJson }}
            analytics_hostname: repl{{ ConfigOption "analytics_hostname" | mustToJson }}
            auth_hostname: repl{{ ConfigOption "auth_hostname" | mustToJson }}
            llm_proxy_hostname: repl{{ ConfigOption "llm_proxy_hostname" | mustToJson }}
            runtime_api_hostname: repl{{ ConfigOption "runtime_api_hostname" | mustToJson }}
            runtime_base_hostname: repl{{ ConfigOption "runtime_base_hostname" | mustToJson }}
            computed_app_hostname: repl{{ ConfigOption "computed_app_hostname" | mustToJson }}
            computed_auth_hostname: repl{{ ConfigOption "computed_auth_hostname" | mustToJson }}
            computed_analytics_hostname: repl{{ ConfigOption "computed_analytics_hostname" | mustToJson }}
            computed_llm_proxy_hostname: repl{{ ConfigOption "computed_llm_proxy_hostname" | mustToJson }}
            computed_runtime_api_hostname: repl{{ ConfigOption "computed_runtime_api_hostname" | mustToJson }}
            computed_runtime_base_hostname: repl{{ ConfigOption "computed_runtime_base_hostname" | mustToJson }}
            computed_runtime_hostname_separator: repl{{ ConfigOption "computed_runtime_hostname_separator" | mustToJson }}
            computed_sandbox_wildcard: repl{{ ConfigOption "computed_sandbox_wildcard" | mustToJson }}
            derived_app_hostname: repl{{ ConfigOption "derived_app_hostname" | mustToJson }}
            derived_analytics_hostname: repl{{ ConfigOption "derived_analytics_hostname" | mustToJson }}
            derived_auth_hostname: repl{{ ConfigOption "derived_auth_hostname" | mustToJson }}
            derived_llm_proxy_hostname: repl{{ ConfigOption "derived_llm_proxy_hostname" | mustToJson }}
            derived_runtime_api_hostname: repl{{ ConfigOption "derived_runtime_api_hostname" | mustToJson }}
            derived_runtime_base_hostname: repl{{ ConfigOption "derived_runtime_base_hostname" | mustToJson }}
            additional_cors_origins: repl{{ ConfigOption "additional_cors_origins" | mustToJson }}
          # Certificate Configuration
          tls_configuration:
            tls_certificate_source: repl{{ ConfigOption "tls_certificate_source" | mustToJson }}
            tls_existing_certificate_name: repl{{ ConfigOption "tls_existing_certificate_name" | mustToJson }}
            computed_tls_certificate_name: repl{{ ConfigOption "computed_tls_certificate_name" | mustToJson }}
          # LLM Configuration
          llm_configuration:
            llm_provider: repl{{ ConfigOption "llm_provider" | mustToJson }}
            anthropic_models: repl{{ ConfigOption "anthropic_models" | mustToJson }}
            openai_models: repl{{ ConfigOption "openai_models" | mustToJson }}
            google_api_type: repl{{ ConfigOption "google_api_type" | mustToJson }}
            gemini_models: repl{{ ConfigOption "gemini_models" | mustToJson }}
            google_vertex_project_id: repl{{ ConfigOption "google_vertex_project_id" | mustToJson }}
            google_vertex_location: repl{{ ConfigOption "google_vertex_location" | mustToJson }}
            vertex_models: repl{{ ConfigOption "vertex_models" | mustToJson }}
            deepseek_models: repl{{ ConfigOption "deepseek_models" | mustToJson }}
            mistral_models: repl{{ ConfigOption "mistral_models" | mustToJson }}
            azure_provider_mode: repl{{ ConfigOption "azure_provider_mode" | mustToJson }}
            azure_auth_method: repl{{ ConfigOption "azure_auth_method" | mustToJson }}
            azure_tenant_id: repl{{ ConfigOption "azure_tenant_id" | mustToJson }}
            azure_client_id: repl{{ ConfigOption "azure_client_id" | mustToJson }}
            azure_endpoint: repl{{ ConfigOption "azure_endpoint" | mustToJson }}
            azure_api_version: repl{{ ConfigOption "azure_api_version" | mustToJson }}
            azure_deployment_name: repl{{ ConfigOption "azure_deployment_name" | mustToJson }}
            azure_deployments: repl{{ ConfigOption "azure_deployments" | mustToJson }}
            azure_drop_params: repl{{ ConfigOption "azure_drop_params" | mustToJson }}
            azure_ai_endpoint: repl{{ ConfigOption "azure_ai_endpoint" | mustToJson }}
            azure_ai_deployments: repl{{ ConfigOption "azure_ai_deployments" | mustToJson }}
            azure_ai_drop_params: repl{{ ConfigOption "azure_ai_drop_params" | mustToJson }}
            groq_models: repl{{ ConfigOption "groq_models" | mustToJson }}
            openrouter_models: repl{{ ConfigOption "openrouter_models" | mustToJson }}
            aws_auth_method: repl{{ ConfigOption "aws_auth_method" | mustToJson }}
            aws_region_name: repl{{ ConfigOption "aws_region_name" | mustToJson }}
            bedrock_model_id: repl{{ ConfigOption "bedrock_model_id" | mustToJson }}
            bedrock_model_ids: repl{{ ConfigOption "bedrock_model_ids" | mustToJson }}
            custom_base_url: repl{{ ConfigOption "custom_base_url" | mustToJson }}
            custom_model: repl{{ ConfigOption "custom_model" | mustToJson }}
            custom_models: repl{{ ConfigOption "custom_models" | mustToJson }}
            allow_user_llm_configuration: repl{{ ConfigOption "allow_user_llm_configuration" | mustToJson }}
            enable_byor_export: repl{{ ConfigOption "enable_byor_export" | mustToJson }}
          # Security & Authentication
          security_secrets:
            postgres_username: repl{{ ConfigOption "postgres_username" | mustToJson }}
            postgres_database: repl{{ ConfigOption "postgres_database" | mustToJson }}
            keycloak_realm_name: repl{{ ConfigOption "keycloak_realm_name" | mustToJson }}
            keycloak_client_id: repl{{ ConfigOption "keycloak_client_id" | mustToJson }}
          # Default OpenHands Organization
          default_openhands_organization:
            default_openhands_org_enabled: repl{{ ConfigOption "default_openhands_org_enabled" | mustToJson }}
            default_openhands_org_auto_add_users: repl{{ ConfigOption "default_openhands_org_auto_add_users" | mustToJson }}
            default_openhands_org_hide_personal_workspaces: repl{{ ConfigOption "default_openhands_org_hide_personal_workspaces" | mustToJson }}
          # Authentication Security
          authentication_security:
            duplicate_email_check: repl{{ ConfigOption "duplicate_email_check" | mustToJson }}
          # Bitbucket Data Center Authentication
          bitbucket_data_center_authentication:
            bitbucket_data_center_auth_enabled: repl{{ ConfigOption "bitbucket_data_center_auth_enabled" | mustToJson }}
            bitbucket_data_center_domain: repl{{ ConfigOption "bitbucket_data_center_domain" | mustToJson }}
            bitbucket_data_center_client_id: repl{{ ConfigOption "bitbucket_data_center_client_id" | mustToJson }}
            bitbucket_data_center_bot_username: repl{{ ConfigOption "bitbucket_data_center_bot_username" | mustToJson }}
          # Azure DevOps Authentication
          azure_devops_authentication:
            azure_devops_auth_enabled: repl{{ ConfigOption "azure_devops_auth_enabled" | mustToJson }}
            azure_devops_tenant_id: repl{{ ConfigOption "azure_devops_tenant_id" | mustToJson }}
            azure_devops_client_id: repl{{ ConfigOption "azure_devops_client_id" | mustToJson }}
          # Jira Data Center Integration
          jira_data_center_integration:
            jira_data_center_enabled: repl{{ ConfigOption "jira_data_center_enabled" | mustToJson }}
            jira_data_center_link_method: repl{{ ConfigOption "jira_data_center_link_method" | mustToJson }}
            jira_data_center_base_url: repl{{ ConfigOption "jira_data_center_base_url" | mustToJson }}
            jira_data_center_client_id: repl{{ ConfigOption "jira_data_center_client_id" | mustToJson }}
          # Jira Cloud Integration
          jira_cloud_integration:
            jira_cloud_enabled: repl{{ ConfigOption "jira_cloud_enabled" | mustToJson }}
          # GitHub Authentication
          github_authentication:
            github_auth_enabled: repl{{ ConfigOption "github_auth_enabled" | mustToJson }}
            github_oauth_client_id: repl{{ ConfigOption "github_oauth_client_id" | mustToJson }}
            github_app_id: repl{{ ConfigOption "github_app_id" | mustToJson }}
            github_app_slug: repl{{ ConfigOption "github_app_slug" | mustToJson }}
          # GitLab Authentication
          gitlab_authentication:
            gitlab_auth_enabled: repl{{ ConfigOption "gitlab_auth_enabled" | mustToJson }}
            gitlab_host: repl{{ ConfigOption "gitlab_host" | mustToJson }}
            gitlab_oauth_client_id: repl{{ ConfigOption "gitlab_oauth_client_id" | mustToJson }}
          # Enterprise SSO (SAML) Authentication
          enterprise_sso_authentication:
            enterprise_sso_enabled: repl{{ ConfigOption "enterprise_sso_enabled" | mustToJson }}
            enterprise_sso_display_name: repl{{ ConfigOption "enterprise_sso_display_name" | mustToJson }}
            enterprise_sso_idp_metadata_url: repl{{ ConfigOption "enterprise_sso_idp_metadata_url" | mustToJson }}
          # Enable Slack
          slack_configuration:
            slack_enabled: repl{{ ConfigOption "slack_enabled" | mustToJson }}
            slack_client_id: repl{{ ConfigOption "slack_client_id" | mustToJson }}
          # SMTP Email Delivery
          smtp_configuration:
            smtp_enabled: repl{{ ConfigOption "smtp_enabled" | mustToJson }}
            smtp_host: repl{{ ConfigOption "smtp_host" | mustToJson }}
            smtp_port: repl{{ ConfigOption "smtp_port" | mustToJson }}
            smtp_from_email: repl{{ ConfigOption "smtp_from_email" | mustToJson }}
            smtp_use_ssl: repl{{ ConfigOption "smtp_use_ssl" | mustToJson }}
            smtp_use_tls: repl{{ ConfigOption "smtp_use_tls" | mustToJson }}
          # Object Storage
          object_storage:
            minio_storage_size: repl{{ ConfigOption "minio_storage_size" | mustToJson }}
            minio_existing_storage_size: repl{{ ConfigOption "minio_existing_storage_size" | mustToJson }}
          # Database Configuration
          database_configuration:
            postgres_type: repl{{ ConfigOption "postgres_type" | mustToJson }}
            external_postgres_host: repl{{ ConfigOption "external_postgres_host" | mustToJson }}
            external_postgres_port: repl{{ ConfigOption "external_postgres_port" | mustToJson }}
            external_postgres_ssl_mode: repl{{ ConfigOption "external_postgres_ssl_mode" | mustToJson }}
            external_postgres_username: repl{{ ConfigOption "external_postgres_username" | mustToJson }}
            external_postgres_create_databases: repl{{ ConfigOption "external_postgres_create_databases" | mustToJson }}
          # Database Names
          database_names:
            external_postgres_database: repl{{ ConfigOption "external_postgres_database" | mustToJson }}
            external_postgres_keycloak_database: repl{{ ConfigOption "external_postgres_keycloak_database" | mustToJson }}
            external_postgres_litellm_database: repl{{ ConfigOption "external_postgres_litellm_database" | mustToJson }}
            external_postgres_runtime_api_database: repl{{ ConfigOption "external_postgres_runtime_api_database" | mustToJson }}
            external_postgres_automations_database: repl{{ ConfigOption "external_postgres_automations_database" | mustToJson }}
          # Sandbox Configuration
          sandbox_configuration:
            sandbox_isolation: repl{{ ConfigOption "sandbox_isolation" | mustToJson }}
            runtime_routing_mode: repl{{ ConfigOption "runtime_routing_mode" | mustToJson }}
            sandbox_idle_seconds: repl{{ ConfigOption "sandbox_idle_seconds" | mustToJson }}
            sandbox_dead_seconds: repl{{ ConfigOption "sandbox_dead_seconds" | mustToJson }}
            sandbox_storage_size: repl{{ ConfigOption "sandbox_storage_size" | mustToJson }}
            sandbox_ephemeral_storage_size: repl{{ ConfigOption "sandbox_ephemeral_storage_size" | mustToJson }}
            sandbox_memory_request: repl{{ ConfigOption "sandbox_memory_request" | mustToJson }}
            sandbox_memory_limit: repl{{ ConfigOption "sandbox_memory_limit" | mustToJson }}
            sandbox_cpu_request: repl{{ ConfigOption "sandbox_cpu_request" | mustToJson }}
            sandbox_cpu_limit: repl{{ ConfigOption "sandbox_cpu_limit" | mustToJson }}
            sandbox_warm_runtime_count: repl{{ ConfigOption "sandbox_warm_runtime_count" | mustToJson }}
            sandbox_max_num_sandboxes: repl{{ ConfigOption "sandbox_max_num_sandboxes" | mustToJson }}
            custom_sandbox_image_enabled: repl{{ ConfigOption "custom_sandbox_image_enabled" | mustToJson }}
            custom_sandbox_image_repository: repl{{ ConfigOption "custom_sandbox_image_repository" | mustToJson }}
            custom_sandbox_image_tag: repl{{ ConfigOption "custom_sandbox_image_tag" | mustToJson }}
            custom_sandbox_image_registry_server: repl{{ ConfigOption "custom_sandbox_image_registry_server" | mustToJson }}
            custom_sandbox_image_registry_username: repl{{ ConfigOption "custom_sandbox_image_registry_username" | mustToJson }}
            sandbox_additional_host_paths: repl{{ ConfigOption "sandbox_additional_host_paths" | mustToJson }}
            sandbox_kvm_enabled: repl{{ ConfigOption "sandbox_kvm_enabled" | mustToJson }}
            sandbox_dedicated_nodes: repl{{ ConfigOption "sandbox_dedicated_nodes" | mustToJson }}
          # Proxy Configuration
          proxy_configuration:
            proxy_enabled: repl{{ ConfigOption "proxy_enabled" | mustToJson }}
            http_proxy: repl{{ ConfigOption "http_proxy" | mustToJson }}
            https_proxy: repl{{ ConfigOption "https_proxy" | mustToJson }}
            no_proxy: repl{{ ConfigOption "no_proxy" | mustToJson }}
            ssl_verify: repl{{ ConfigOption "ssl_verify" | mustToJson }}
          # Troubleshooting
          troubleshooting:
            log_level: repl{{ ConfigOption "log_level" | mustToJson }}
          # Upgrade Checks
          upgrade_checks:
            keycloak_pre_upgrade_backup: repl{{ ConfigOption "keycloak_pre_upgrade_backup" | mustToJson }}
            budget_preflight_mode: repl{{ ConfigOption "budget_preflight_mode" | mustToJson }}
            budget_reconcile_gate_mode: repl{{ ConfigOption "budget_reconcile_gate_mode" | mustToJson }}
          # Experimental
          experimental:
            plugin_directory_enabled: repl{{ ConfigOption "plugin_directory_enabled" | mustToJson }}
            plugin_directory_marketplace_source: repl{{ ConfigOption "plugin_directory_marketplace_source" | mustToJson }}
            super_admin_dashboard_enabled: repl{{ ConfigOption "super_admin_dashboard_enabled" | mustToJson }}
            super_admin_emails: repl{{ ConfigOption "super_admin_emails" | mustToJson }}
            auth_v2_enabled: repl{{ ConfigOption "auth_v2_enabled" | mustToJson }}
          # Analytics Configuration
          analytics_configuration:
            analytics_enabled: repl{{ ConfigOption "analytics_enabled" | mustToJson }}
            clickhouse_diagnostic_log_retention_days: repl{{ ConfigOption "clickhouse_diagnostic_log_retention_days" | mustToJson }}
            clickhouse_diagnostic_log_cleanup_enabled: repl{{ ConfigOption "clickhouse_diagnostic_log_cleanup_enabled" | mustToJson }}
          # Automations
          automations_configuration:
            automations_enabled: repl{{ ConfigOption "automations_enabled" | mustToJson }}
            automations_db_username: repl{{ ConfigOption "automations_db_username" | mustToJson }}
            automations_sandbox_cleanup_delay_seconds: repl{{ ConfigOption "automations_sandbox_cleanup_delay_seconds" | mustToJson }}
            automations_failure_disable_threshold: repl{{ ConfigOption "automations_failure_disable_threshold" | mustToJson }}
            automations_consecutive_failure_disable_threshold: repl{{ ConfigOption "automations_consecutive_failure_disable_threshold" | mustToJson }}
            automations_consecutive_failure_disable_window_hours: repl{{ ConfigOption "automations_consecutive_failure_disable_window_hours" | mustToJson }}
          # Agent Canvas
          agent_canvas_configuration:
            agent_canvas_enabled: repl{{ ConfigOption "agent_canvas_enabled" | mustToJson }}
          # Agent Features
          agent_features:
            agent_profiles_enabled: repl{{ ConfigOption "agent_profiles_enabled" | mustToJson }}
            model_routing_enabled: repl{{ ConfigOption "model_routing_enabled" | mustToJson }}
          # Advanced Options
          advanced_options:
            openhands_resolver_label: repl{{ ConfigOption "openhands_resolver_label" | mustToJson }}
            litellm_forward_client_headers: repl{{ ConfigOption "litellm_forward_client_headers" | mustToJson }}
            custom_llm_extra_headers_enabled: repl{{ ConfigOption "custom_llm_extra_headers_enabled" | mustToJson }}
            keycloak_sso_session_idle_timeout: repl{{ ConfigOption "keycloak_sso_session_idle_timeout" | mustToJson }}
            keycloak_sso_session_max_lifespan: repl{{ ConfigOption "keycloak_sso_session_max_lifespan" | mustToJson }}
            oem_user_creation_flow_enabled: repl{{ ConfigOption "oem_user_creation_flow_enabled" | mustToJson }}
