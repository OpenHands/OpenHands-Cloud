cert-manager:
  enabled: true
  # cert-manager installs its own CRDs when this is true. Required for the
  # openhands chart pre-install CRD check to succeed.
  crds:
    enabled: true
    keep: true
  # cert-manager is cluster-scoped; leaderElection must live in a namespace
  # accessible to all cert-manager pods. The chart default (kube-system) is
  # fine for most installs but is set here explicitly for clarity.
  global:
    leaderElection:
      namespace: kube-system
  # Pod resources are intentionally conservative — cert-manager is idle most
  # of the time for our use case (no ACME solver activity).
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  webhook:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
  cainjector:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  startupapicheck:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

trust-manager:
  enabled: true
  # Trust-manager needs to know which namespace its default CA trust bundle
  # will live in. cert-manager is the standard location.
  app:
    trust:
      namespace: cert-manager
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# Pre-install/pre-upgrade hook that waits for required CRDs to be Established
# before the chart applies resources that depend on them. Use this when a
# release in this chart references CRDs installed by a separate release — for
# example, the trust-manager release waiting on cert-manager CRDs that the
# cert-manager release just created. `helm install --wait` waits for pods,
# not CRD `Established` conditions, so without this hook a fast follow-on
# release can race the apiserver registration.
#
# Disabled by default. Enable on the consuming release (e.g. trust-manager)
# and supply the CRD list to wait on.
crdCheck:
  enabled: false
  image:
    repository: docker.io/rancher/kubectl
    tag: v1.33.0
    pullPolicy: IfNotPresent
  timeout: 120s
  backoffLimit: 6
  crds: []
  imagePullSecrets: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# Lets a Kubernetes (k0s) upgrade drain nodes without dropping the per-sandbox
# PodDisruptionBudgets that protect sandboxes the rest of the time. A small
# controller watches the embedded-cluster `Installation` state and, while a k0s
# upgrade is rolling nodes, relaxes the sandbox PDBs (maxUnavailable=100%) so
# autopilot's node drains can evict the pods; it sets them back to
# maxUnavailable=0 when the upgrade finishes. The Deployments are left at
# replicas=1, so pods return on their own once the node uncordons. See
# templates/sandbox-upgrade-coordinator.yaml for the full design.
#
# Enable ONLY on embedded-cluster installs (where the Installation CRD exists).
# Disabled by default; on other clusters the controller would just idle.
sandboxUpgradeCoordinator:
  enabled: false
  image:
    repository: docker.io/alpine/k8s
    tag: "1.30.0"
    pullPolicy: IfNotPresent
  # Namespace where runtime-api creates sandbox pods and their PDBs (its
  # K8S_NAMESPACE). In the openhands chart this is the openhands release namespace.
  runtimeNamespace: openhands
  # Label selector identifying sandbox PDBs (runtime-api labels each sandbox and
  # its PDB with runtime_id).
  sandboxSelector: runtime_id
  # Installation states that mean a k0s node roll is underway. While any
  # Installation reports one of these, the sandbox PDBs are relaxed so the node
  # can drain. "Enqueued" and "Installing" are the states embedded-cluster sets
  # around the autopilot plan; widen for more lead time or narrow to reduce false
  # starts.
  drainStates:
    - Enqueued
    - Installing
  # Seconds between Installation-state polls.
  pollIntervalSeconds: 10
  imagePullSecrets: []
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 64Mi

# Sysbox installer. When enabled, a privileged DaemonSet installs the Sysbox
# container runtime on every node and registers the sysbox RuntimeClass,
# giving pods with runtimeClassName: sysbox-runc VM-like (user-namespace)
# isolation. Disabled by default; the Replicated "Sandbox Isolation" config
# option turns it on.
#
# The Sysbox binaries and systemd units are baked into the image below (the
# official nestybox/sysbox-deploy-k8s image), so the install needs no internet
# access (fixes air-gap) and is not tied to Debian/Ubuntu: the binaries are
# portable Go builds and k0s ships its own containerd, so any systemd host with
# kernel >= 6.3 works. Kernel >= 6.3 is enforced by the openhands chart's Sysbox
# preflight.
sysbox:
  enabled: false
  # Sysbox CE version, used for the on-host idempotency/version check and for
  # logging. Must match the Sysbox version encoded in image.tag below.
  version: "0.7.0"
  # Name of the RuntimeClass + handler. Must stay in sync with the containerd
  # runtime name in files/install-sysbox.sh and the runtime-api RUNTIME_CLASS
  # value (replicated/openhands.yaml).
  runtimeClassName: sysbox-runc
  image:
    # Official nestybox image that ships the Sysbox binaries under
    # /opt/sysbox/bin/generic and the systemd units under /opt/sysbox/systemd.
    # Used ONLY by the init container to stage those artifacts onto the host: it
    # is centos:7-based (util-linux 2.23.2), whose nsenter cannot enter PID 1's
    # namespaces on recent kernels, so it must NOT run the installer itself. The
    # tag encodes the Sysbox version as v<version>-0; keep it in sync with
    # .version above.
    repository: ghcr.io/nestybox/sysbox-deploy-k8s
    tag: v0.7.0-0
    pullPolicy: IfNotPresent
  # Runner image for the installer container. Its only job is to provide a modern
  # nsenter (util-linux >= 2.38) that can enter the host namespaces to run
  # files/install-sysbox.sh; it is never installed on the host, so this stays
  # distro-agnostic for the node. Split out from image above because the nestybox
  # image's ancient nsenter fails on kernel 6.x (exits 1 before the script runs).
  runnerImage:
    repository: docker.io/library/debian
    tag: bookworm-slim
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  # Run on every Linux node, tolerating all taints (incl. control-plane).
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - operator: Exists
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      memory: 512Mi

# Kubelet ECR credential provider installer. When enabled, a privileged
# DaemonSet installs the kubelet credential provider plugin for Amazon ECR on
# every node and points the kubelet at it, so pulls from ECR authenticate with
# the node's own IAM identity. Nothing on the cluster holds an ECR authorization
# token, so nothing has to be re-entered when one expires after 12 hours.
#
# EC2 only. The plugin resolves credentials through the AWS SDK chain running as
# the kubelet's user, which on an Embedded Cluster node means the instance
# profile via IMDS. A node outside EC2 has no credential source and every ECR
# pull on it will fail.
#
# Enabling this reconfigures the kubelet. Embedded Cluster bakes kubelet's
# arguments into the k0s systemd unit and offers no supported override, so the
# installer edits that unit and restarts k0s once per node. See
# files/install-ecr-credential-provider.sh for what that costs and why nothing
# lighter works.
ecrCredentialProvider:
  enabled: false
  # Plugin release to install. These are the upstream cloud-provider-aws
  # binaries rebuilt and published by dntosas/ecr-credential-provider:
  # kubernetes/cloud-provider-aws itself publishes no release binary and its
  # registry.k8s.io repository carries no tags, so there is nothing first-party
  # to pull. The download is checksum-pinned, so the release host only has to be
  # reachable, not trusted. Point releaseBaseUrl at an internal mirror that
  # serves the same layout to install without reaching GitHub.
  version: v1.2.0
  releaseBaseUrl: https://github.com/dntosas/ecr-credential-provider/releases/download
  # sha256 of ecr-credential-provider-linux-<arch> for .version. Update both
  # whenever .version moves; the installer refuses a binary that does not match.
  checksums:
    amd64: 6b9c0b8ba9c4b2ab1b3eb093044c9b4500eb2916b6b9f792a8923d91789cd1a4
    arm64: 9652fd710dccab8f62f0ab29b374d3845c746e7490e6004a01edf84a42d36726
  # Host directory holding the plugin binary and the kubelet's
  # CredentialProviderConfig. kubelet execs every file in the bin directory, so
  # this stays a directory of ours rather than a shared one like /usr/local/bin.
  installDir: /opt/openhands/image-credential-provider
  # Registries the plugin is consulted for. Each glob matches a single subdomain
  # segment, so the two wildcards below stand for the account ID and the region.
  # Covers the commercial, FIPS, China and US government partitions plus ECR
  # Public; images outside this list are pulled the normal way.
  matchImages:
    - "*.dkr.ecr.*.amazonaws.com"
    - "*.dkr.ecr-fips.*.amazonaws.com"
    - "*.dkr.ecr.*.amazonaws.com.cn"
    - "*.dkr.ecr.*.on.aws"
    - "*.dkr.ecr.*.c2s.ic.gov"
    - "*.dkr.ecr.*.sc2s.sgov.gov"
    - "public.ecr.aws"
  # Environment for the plugin process, written into the CredentialProviderConfig
  # as NAME: VALUE. kubelet appends these after its own environment and exec
  # keeps the last duplicate, so they win over whatever kubelet inherited. This
  # is how proxy settings reach the plugin; see the Replicated manifest, which
  # fills it in and keeps IMDS off the proxy.
  providerEnv: {}
  # Image reference the installer uses to prove, on each node, that the plugin
  # can really mint an ECR token there. Same binary, same credential chain, same
  # user kubelet will use, so a pass means the next pull authenticates. Empty
  # skips the check; the Replicated manifest points it at the sandbox image.
  selfTestImage: ""
  # Shortest interval, in seconds, between two k0s restarts driven by the
  # installer. Stops a node that never comes back configured from turning a pod
  # restart loop into a k0s restart loop.
  restartCooldownSeconds: 900
  image:
    # Only needed for a modern nsenter (util-linux >= 2.38) to enter the host
    # namespaces and run files/install-ecr-credential-provider.sh. Nothing from
    # this image is installed on the node, and the download happens on the host,
    # so the node's own curl and trust store are what talk to the release host.
    repository: docker.io/library/debian
    tag: bookworm-slim
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  # Run on every Linux node, tolerating all taints (incl. control-plane).
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - operator: Exists
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
