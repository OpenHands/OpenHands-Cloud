suite: sysbox RuntimeClass scheduling
templates:
  - templates/sysbox-installer.yaml
tests:
  - it: the RuntimeClass carries the configured nodeSelector
    template: templates/sysbox-installer.yaml
    documentIndex: 0
    set:
      sysbox.enabled: true
      sysbox.runtimeClassNodeSelector:
        openhands.dev/sandbox: "true"
    asserts:
      - isKind:
          of: RuntimeClass
      - equal:
          path: scheduling.nodeSelector["openhands.dev/sandbox"]
          value: "true"

  - it: the RuntimeClass omits scheduling when no nodeSelector is configured
    template: templates/sysbox-installer.yaml
    documentIndex: 0
    set:
      sysbox.enabled: true
    asserts:
      - isKind:
          of: RuntimeClass
      - notExists:
          path: scheduling

  - it: the sysbox DaemonSet stays off the affinity path so it covers every node
    template: templates/sysbox-installer.yaml
    documentIndex: 1
    set:
      sysbox.enabled: true
      sysbox.runtimeClassNodeSelector:
        openhands.dev/sandbox: "true"
    asserts:
      - isKind:
          of: DaemonSet
      - notExists:
          path: spec.template.spec.affinity
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            kubernetes.io/os: linux
