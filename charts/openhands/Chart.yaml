apiVersion: v2
description: OpenHands is an AI-driven autonomous software engineer
name: openhands
appVersion: 1.49.0
version: 0.35.0
dependencies:
  - name: keycloak
    version: 24.7.5
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: keycloak.enabled
  - name: laminar
    repository: https://lmnr-ai.github.io/lmnr-helm
    version: 0.2.2
    condition: laminar.enabled
  - name: litellm-helm
    repository: oci://ghcr.io/berriai
    version: 0.1.831
    condition: litellm-helm.enabled
  - name: minio
    version: 5.0.10
    # Two paths on purpose: Helm uses the first that EXISTS, and minio.enabled is
    # deliberately absent from values.yaml, so existing installs keep deploying
    # MinIO from filestore.ephemeral alone. Setting minio.enabled: false is how a
    # migrated install stops rendering it.
    condition: minio.enabled,filestore.ephemeral
    repository: https://charts.min.io/
  - name: postgresql
    version: 15.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 20.3.0
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
  - name: replicated
    repository: oci://registry.replicated.com/library
    version: 1.19.7
    condition: replicated.enabled
  - name: rustfs
    version: 0.10.0
    repository: https://charts.rustfs.com/
    condition: rustfs.enabled
  - name: crd-check
    repository: oci://ghcr.io/openhands/helm-charts
    version: 0.1.0
  - name: runtime-api
    version: '*'
    condition: runtime-api.enabled
  - name: automation
    version: '*'
    condition: automation.enabled
  - name: plugin-directory
    version: '*'
    condition: plugin-directory.enabled
  - name: integrations-hub
    version: '*'
    condition: integrations-hub.enabled
  - name: agent-canvas
    version: '*'
    condition: agent-canvas.enabled
