{{- if and .Values.enabled .Values.proactiveConvoClean.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-proactive-convo-clean
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
    app.kubernetes.io/component: proactive-convo-clean
    app: {{ .Release.Name }}-proactive-convo-clean
spec:
  schedule: {{ .Values.proactiveConvoClean.schedule | quote }}
  {{- /* pinned to UTC so the schedule is interpreted the same regardless of the cluster controller's local time zone; do not expose as a value */}}
  timeZone: Etc/UTC
  concurrencyPolicy: {{ .Values.proactiveConvoClean.concurrencyPolicy }}
  failedJobsHistoryLimit: {{ .Values.proactiveConvoClean.failedJobsHistoryLimit }}
  successfulJobsHistoryLimit: {{ .Values.proactiveConvoClean.successfulJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.proactiveConvoClean.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "openhands.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: proactive-convo-clean
            app: {{ .Release.Name }}-proactive-convo-clean
        spec:
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ .Values.serviceAccount.name }}
          restartPolicy: OnFailure
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (include "openhands.affinity" .) }}
          affinity:
            {{- . | nindent 12 }}
          {{- end }}
          containers:
            - name: {{ .Release.Name }}-proactive-convo-clean
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
              command: ["python", "-m", "sync.clean_proactive_convo_table"]
              resources:
                {{- toYaml .Values.proactiveConvoClean.resources | nindent 16 }}
              env:
                {{- include "openhands.env" . | nindent 16 }}
{{- end }}
