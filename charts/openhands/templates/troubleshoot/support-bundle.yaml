{{- define "troubleshoot.supportBundle" -}}
apiVersion: troubleshoot.sh/v1beta2
kind: SupportBundle
metadata:
  name: {{ .Release.Name }}-support-bundle
spec:
  collectors: {{- include "troubleshoot.collectors.shared" .  | nindent 4 }}
    {{- /* Presence of admin-configured/optional secrets: a key renders only when its KOTS
    value is set, so includeValue:false keyExists ⇔ value-set -- presence only, never the value.
    Always-generated internal secrets are omitted; they'd read "set" unconditionally. */}}
    {{- $secretKeys := dict
      "azure-devops-app"          (list "client-id" "client-secret")
      "bitbucket-data-center-app" (list "host" "client-id" "client-secret" "bot-token")
      "github-app"                (list "app-id" "app-slug" "client-id" "client-secret" "private-key" "webhook-secret")
      "gitlab-app"                (list "client-id" "client-secret")
      "jira-dc-app"               (list "base-url" "client-id" "client-secret" "service-account-email" "service-account-pat")
      "keycloak-realm"            (list "client-id" "client-secret" "smtp-password")
      "litellm-env-secrets"       (list "ANTHROPIC_API_KEY" "OPENAI_API_KEY" "GOOGLE_API_KEY" "GOOGLE_APPLICATION_CREDENTIALS_JSON" "VERTEXAI_PROJECT" "VERTEXAI_LOCATION" "DEEPSEEK_API_KEY" "MISTRAL_API_KEY" "AZURE_API_KEY" "AZURE_TENANT_ID" "AZURE_CLIENT_ID" "AZURE_CLIENT_SECRET" "AZURE_API_BASE" "AZURE_API_VERSION" "GROQ_API_KEY" "OPENROUTER_API_KEY" "AWS_ACCESS_KEY_ID" "AWS_SECRET_ACCESS_KEY" "AWS_REGION_NAME" "CUSTOM_API_KEY" "CUSTOM_API_BASE")
      "openhands-env-secrets"     (list "LLM_API_KEY" "LLM_MODEL" "LLM_BASE_URL" "LLM_API_VERSION" "AWS_ACCESS_KEY_ID" "AWS_SECRET_ACCESS_KEY" "AWS_REGION_NAME")
      "openhands-tls"             (list "tls.crt" "ca.crt")
      "postgres-password"         (list "postgres-password")
      "redis"                     (list "redis-password")
      "s3-credentials"            (list "access-key" "secret-key")
      "sandbox-api-key"           (list "sandbox-api-key")
      "slack-auth"                (list "client-id" "client-secret" "signing-secret")
    }}
    {{- range $name, $keys := $secretKeys }}
    {{- range $key := $keys }}
    - secret:
        name: {{ $name }}
        namespace: {{ $.Release.Namespace }}
        key: {{ $key }}
        includeValue: false
    {{- end }}
    {{- end }}
    # Log volume is bounded by kubelet rotation (~tens of MB/pod), not maxAge,
    # so 336h is free on chatty pods and only adds history on quiet ones.
    # OpenHands main application logs
    - logs:
        name: app/openhands/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app=openhands
        limits:
          maxAge: 336h
    # OpenHands integrations deployment logs
    - logs:
        name: app/openhands-integrations/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app=openhands-integrations
        limits:
          maxAge: 336h
    # OpenHands MCP deployment logs
    - logs:
        name: app/openhands-mcp/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app=openhands-mcp
        limits:
          maxAge: 336h
    {{- if .Values.postgresql.enabled }}
    # PostgreSQL logs (Bitnami chart)
    - logs:
        name: app/{{ .Release.Name }}-postgresql/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app.kubernetes.io/name=postgresql
          - app.kubernetes.io/instance={{ .Release.Name }}
        limits:
          maxAge: 336h
    {{- end }}
    {{- if include "openhands.cache.backend" . }}
    {{- if eq (include "openhands.cache.backend" .) "valkey" }}
    # Valkey logs (official valkey chart)
    {{- else }}
    # Redis logs (Bitnami chart)
    {{- end }}
    - logs:
        name: app/{{ .Release.Name }}-{{ include "openhands.cache.backend" . }}/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app.kubernetes.io/name={{ include "openhands.cache.backend" . }}
          - app.kubernetes.io/instance={{ .Release.Name }}
        limits:
          maxAge: 336h
    {{- end }}
    {{- if .Values.keycloak.enabled }}
    # Keycloak logs (Bitnami chart)
    - logs:
        name: app/{{ .Release.Name }}-keycloak/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app.kubernetes.io/name=keycloak
          - app.kubernetes.io/instance={{ .Release.Name }}
        limits:
          maxAge: 336h
    {{- end }}
    {{- if .Values.minio.enabled }}
    # MinIO logs (MinIO chart)
    - logs:
        name: app/{{ .Release.Name }}-minio/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app=minio
          - release={{ .Release.Name }}
        limits:
          maxAge: 336h
    {{- end }}
    {{- if .Values.laminar.enabled }}
    # Laminar ClickHouse pod logs plus read-only system-table diagnostics. The
    # ClickHouse system tables themselves are TTL-bounded, so this collector
    # captures table sizes, TTL metadata and the most recent trace rows.
    - logs:
        name: app/laminar-clickhouse/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app=laminar-clickhouse
        limits:
          maxAge: 336h
    - exec:
        name: app/laminar-clickhouse-diagnostics
        collectorName: laminar-clickhouse-diagnostics
        namespace: {{ .Release.Namespace }}
        selector:
          - app=laminar-clickhouse
        containerName: clickhouse
        command: ["/bin/bash", "-ec"]
        args:
          - |
            client=(clickhouse-client --host localhost --port 9000 --user "${CLICKHOUSE_USER:-default}" --password="${CLICKHOUSE_PASSWORD:-}")
            run() {
              echo "== $1 =="
              if ! "${client[@]}" --query "$2"; then
                echo "ERROR: query failed"
              fi
              echo
            }
            run "system diagnostic table sizes and ttl" "SELECT database, name, total_rows, formatReadableSize(total_bytes) AS size, metadata_modification_time, if(position(engine_full, 'TTL ') = 0, 'none', substring(engine_full, position(engine_full, 'TTL '), 160)) AS ttl FROM system.tables WHERE database = 'system' AND name IN ('asynchronous_metric_log','metric_log','query_log','query_thread_log','query_views_log','part_log','session_log','text_log','trace_log','crash_log','opentelemetry_span_log','zookeeper_log','blob_storage_log','processors_profile_log') ORDER BY total_bytes DESC FORMAT JSONEachRow"
            run "recent trace_log rows" "SELECT event_time, trace_type, thread_name, query_id FROM system.trace_log ORDER BY event_time DESC LIMIT 50 FORMAT JSONEachRow"
            run "recent text_log rows" "SELECT event_time, level, logger_name, message FROM system.text_log ORDER BY event_time DESC LIMIT 50 FORMAT JSONEachRow"
        timeout: 30s
    {{- end }}
    {{- if index .Values "runtime-api" "enabled" }}
    # Runtime API logs
    - logs:
        name: app/{{ .Release.Name }}-runtime-api/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app.kubernetes.io/name=runtime-api
          - app.kubernetes.io/instance={{ .Release.Name }}
        limits:
          maxAge: 336h
    # Runtime sandbox pod logs. Pod names are dynamic (runtime-*) and the
    # logs collector has no glob-name support, so select by the runtime_id
    # label — a bare key matches "label exists with any value". Pod/event
    # metadata is already captured by the top-level clusterResources collector.
    - logs:
        name: runtime-sandboxes/logs
        selector:
          - runtime_id
        limits:
          maxAge: 336h
        timestamps: true
    # Read-only runtimes dump via the runtime-api pod's own DB creds (pg8000,
    # runtime_api_db). Surfaces custom sandbox images + status; never selects
    # the environment JSON or session_api_key. Also prints pull-secret NAMES.
    - exec:
        name: app/{{ .Release.Name }}-runtime-api-db
        collectorName: runtime-api-db-diagnostics
        namespace: {{ .Release.Namespace }}
        selector:
          - app.kubernetes.io/name=runtime-api
        containerName: runtime-api
        command: ["python3", "-c"]
        args:
          - |
            import json, os, pg8000.dbapi
            kw = dict(
                host=os.environ["DB_HOST"],
                port=int(os.environ.get("DB_PORT", "5432")),
                user=os.environ["DB_USER"],
                password=os.environ.get("DB_PASS", ""),
                database=os.environ["DB_NAME"],
                timeout=10,
            )
            # mirror runtime-api db.py: ssl_context True/False for require/disable, omit otherwise
            mode = (os.environ.get("DB_SSL_MODE") or "").strip().lower()
            if mode == "require":
                kw["ssl_context"] = True
            elif mode == "disable":
                kw["ssl_context"] = False
            print("RUNTIME_IMAGE_PULL_SECRETS=" + os.environ.get("RUNTIME_IMAGE_PULL_SECRETS", ""))
            conn = pg8000.dbapi.connect(**kw)
            conn.autocommit = True
            cur = conn.cursor()
            cur.execute("SET default_transaction_read_only = on")
            def run(label, sql):
                print("== " + label + " ==")
                try:
                    cur.execute(sql)
                    cols = [d[0] for d in cur.description]
                    print(json.dumps(cols))
                    for r in cur.fetchall():
                        print(json.dumps(dict(zip(cols, r)), default=str))
                except Exception as e:
                    print("ERROR: " + repr(e))
                print()
            queries = [
                ("runtimes image/status summary",
                 "SELECT image, status, COUNT(*) AS n FROM runtimes "
                 "GROUP BY image, status ORDER BY n DESC"),
                ("runtimes recent",
                 "SELECT runtime_id, session_id, api_key_name, status, image, working_dir, "
                 "created_at, stopped_at, last_state_change, cpu_millicores, memory_mb, "
                 "storage_gb, running_time, paused_time, run_as_user, run_as_group, fs_group "
                 "FROM runtimes ORDER BY created_at DESC LIMIT 50"),
            ]
            for label, sql in queries:
                run(label, sql)
            conn.close()
        timeout: 30s
    # Compare direct Service health with the external ingress path for stale starts.
    - exec:
        name: app/{{ .Release.Name }}-runtime-api-ingress
        collectorName: runtime-api-ingress-diagnostics
        namespace: {{ .Release.Namespace }}
        selector:
          - app.kubernetes.io/name=runtime-api
        containerName: runtime-api
        command: ["python3", "-c"]
        args:
          - |
            import concurrent.futures, datetime, json, os, re, socket, ssl
            from urllib.parse import urlsplit
            import pg8000.dbapi, requests
            from kubernetes import client, config
            from utils.id import subdomain_to_url

            def error_text(exc):
                text = re.sub(r"(https?://)[^/@\s]+@", r"\1<redacted>@", str(exc))
                return {"type": type(exc).__name__, "message": text}

            def db_connection():
                kw = dict(
                    host=os.environ["DB_HOST"], port=int(os.environ.get("DB_PORT", "5432")),
                    user=os.environ["DB_USER"], password=os.environ.get("DB_PASS", ""),
                    database=os.environ["DB_NAME"], timeout=5,
                )
                mode = (os.environ.get("DB_SSL_MODE") or "").strip().lower()
                if mode == "require":
                    kw["ssl_context"] = True
                elif mode == "disable":
                    kw["ssl_context"] = False
                return pg8000.dbapi.connect(**kw)

            def response_status(response, expected_key, expected_value):
                try:
                    payload = response.json()
                    value = payload.get(expected_key) if isinstance(payload, dict) else None
                except Exception:
                    value = None
                final_url = urlsplit(response.url)
                return {
                    "ok": response.status_code == 200 and value == expected_value,
                    "http_status": response.status_code,
                    "json_value": {expected_key: value},
                    "final_url": (
                        f"{final_url.scheme}://{final_url.netloc}{final_url.path}"
                    ),
                }

            def route_backend(runtime_id, namespace, networking_api, custom_api):
                name = f"runtime-{runtime_id}"
                if os.environ.get("USE_GATEWAY_API", "false").lower() == "true":
                    route = custom_api.get_namespaced_custom_object(
                        group="gateway.networking.k8s.io", version="v1",
                        namespace=namespace, plural="httproutes", name=name,
                    )
                    for rule in route.get("spec", {}).get("rules", []):
                        refs = rule.get("backendRefs", [])
                        if refs:
                            return {
                                "kind": "HTTPRoute", "name": name,
                                "service_name": refs[0]["name"],
                                "service_port": refs[0].get("port"),
                            }
                    raise RuntimeError("runtime HTTPRoute has no backendRefs")

                ingress = networking_api.read_namespaced_ingress(name, namespace)
                for rule in ingress.spec.rules or []:
                    for path in (rule.http.paths if rule.http else []) or []:
                        backend = path.backend.service
                        if backend:
                            return {
                                "kind": "Ingress", "name": name,
                                "service_name": backend.name,
                                "service_port": backend.port.number or backend.port.name,
                            }
                raise RuntimeError("runtime Ingress has no Service backend")

            def inspect_runtime(
                row, core_api, networking_api, custom_api, namespace
            ):
                runtime_id, last_state_change, use_fuse_mount = row
                result = {
                    "runtime_id": runtime_id,
                    "last_state_change": str(last_state_change),
                    "use_fuse_mount": use_fuse_mount,
                }
                routing = route_backend(
                    runtime_id, namespace, networking_api, custom_api
                )
                result["routing_resource"] = routing
                service_name = routing["service_name"]
                service_port = routing["service_port"]
                if not isinstance(service_port, int):
                    service = core_api.read_namespaced_service(service_name, namespace)
                    service_port = next(
                        port.port for port in service.spec.ports
                        if service_port is None or port.name == service_port
                    )
                endpoint = "api/init" if use_fuse_mount else "alive"
                expected_key, expected_value = (
                    ("state", "ready") if use_fuse_mount else ("status", "ok")
                )
                service_url = (
                    f"http://{service_name}.{namespace}.svc.cluster.local:"
                    f"{service_port}/{endpoint}"
                )
                direct = requests.Session()
                direct.trust_env = False
                try:
                    result["service"] = response_status(
                        direct.get(service_url, timeout=3), expected_key, expected_value
                    )
                except Exception as exc:
                    result["service"] = {"ok": False, "error": error_text(exc)}

                external_url = f"{subdomain_to_url(runtime_id).rstrip('/')}/{endpoint}"
                result["external_url"] = external_url
                parsed = urlsplit(external_url)
                port = parsed.port or (443 if parsed.scheme == "https" else 80)

                try:
                    addresses = sorted({
                        entry[4][0] for entry in socket.getaddrinfo(parsed.hostname, port)
                    })
                    result["dns"] = {"ok": True, "addresses": addresses}
                except Exception as exc:
                    result["dns"] = {"ok": False, "error": error_text(exc)}

                if parsed.scheme == "https":
                    ca_file = os.environ.get("REQUESTS_CA_BUNDLE") or os.environ.get("SSL_CERT_FILE")
                    try:
                        context = ssl.create_default_context(
                            cafile=ca_file if ca_file and os.path.isfile(ca_file) else None
                        )
                        with socket.create_connection((parsed.hostname, port), timeout=3) as raw:
                            with context.wrap_socket(raw, server_hostname=parsed.hostname) as tls:
                                cert = tls.getpeercert()
                        result["tls"] = {
                            "ok": True,
                            "expires": cert.get("notAfter"),
                            "dns_names": [
                                value for kind, value in cert.get("subjectAltName", [])
                                if kind == "DNS"
                            ],
                        }
                    except Exception as exc:
                        result["tls"] = {"ok": False, "error": error_text(exc)}

                try:
                    result["external"] = response_status(
                        requests.get(external_url, timeout=5), expected_key, expected_value
                    )
                except Exception as exc:
                    result["external"] = {"ok": False, "error": error_text(exc)}
                result["external_alive"] = result["external"]["ok"]
                return result

            def inspect_runtime_safe(
                row, core_api, networking_api, custom_api, namespace
            ):
                try:
                    return inspect_runtime(
                        row, core_api, networking_api, custom_api, namespace
                    )
                except Exception as exc:
                    return {
                        "runtime_id": row[0],
                        "last_state_change": str(row[1]),
                        "external_alive": False,
                        "diagnostic_error": error_text(exc),
                    }

            output = {"generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat()}
            try:
                conn = db_connection()
                conn.autocommit = True
                cur = conn.cursor()
                cur.execute("SET default_transaction_read_only = on")
                cur.execute(
                    "SELECT runtime_id, last_state_change, use_fuse_mount FROM runtimes "
                    "WHERE status = 'starting' "
                    "AND COALESCE(last_state_change, created_at) < NOW() - INTERVAL '60 seconds' "
                    "ORDER BY created_at DESC LIMIT 5"
                )
                rows = cur.fetchall()
                conn.close()
                if not rows:
                    output.update(overall="not-applicable", runtimes=[])
                else:
                    namespace = os.environ.get("K8S_NAMESPACE", "{{ .Release.Namespace }}")
                    config.load_incluster_config()
                    networking_api = client.NetworkingV1Api()
                    core_api = client.CoreV1Api()
                    custom_api = client.CustomObjectsApi()
                    with concurrent.futures.ThreadPoolExecutor(max_workers=len(rows)) as pool:
                        futures = [
                            pool.submit(
                                inspect_runtime_safe, row,
                                core_api, networking_api, custom_api, namespace,
                            )
                            for row in rows
                        ]
                        results = [future.result() for future in futures]
                    output.update(
                        overall=(
                            "pass" if all(item["external_alive"] for item in results)
                            else "fail"
                        ),
                        runtimes=results,
                    )
            except Exception as exc:
                output.update(overall="collector-error", error=error_text(exc))
            print(json.dumps(output, indent=2, default=str))
        timeout: 20s
    {{- end }}
    {{- if and (index .Values "litellm-helm") (index .Values "litellm-helm" "enabled") }}
    # LiteLLM logs
    - logs:
        name: app/{{ .Release.Name }}-litellm/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app.kubernetes.io/name=litellm
          - app.kubernetes.io/instance={{ .Release.Name }}
        limits:
          maxAge: 336h
    # Live LiteLLM proxy model list (/model/info): config-rendered models
    # plus any models added at runtime via the LiteLLM dashboard
    # (store_model_in_db). Authenticates with the proxy's own
    # PROXY_MASTER_KEY env var (wired from the lite-llm-api-key secret by
    # the litellm-helm chart). LiteLLM redacts api_key values server-side;
    # api_base values may appear, which is acceptable. The image has no
    # curl, so use the bundled python3.
    - exec:
        name: app/{{ .Release.Name }}-litellm
        collectorName: litellm-model-info
        namespace: {{ .Release.Namespace }}
        selector:
          - app.kubernetes.io/name=litellm
          - app.kubernetes.io/instance={{ .Release.Name }}
        containerName: litellm
        command: ["python3", "-c"]
        args:
          - |
            import os, urllib.request
            req = urllib.request.Request(
                "http://localhost:4000/model/info",
                headers={"Authorization": "Bearer " + os.environ["PROXY_MASTER_KEY"]},
            )
            print(urllib.request.urlopen(req, timeout=15).read().decode())
        timeout: 30s
    {{- end }}
    # Read-only integration STATE via the openhands pod's own DB creds. Dumps
    # webhook/connection ids, repos and timestamps to spot duplicate
    # registrations; SELECTs only non-secret columns (never tokens/secrets).
    - exec:
        name: app/openhands-db-diagnostics
        collectorName: openhands-db-diagnostics
        namespace: {{ .Release.Namespace }}
        selector:
          - app=openhands
        containerName: openhands
        command: ["python3", "-c"]
        args:
          - |
            import json, os, psycopg2
            conn = psycopg2.connect(
                host=os.environ["DB_HOST"],
                port=os.environ.get("DB_PORT", "5432"),
                dbname=os.environ["DB_NAME"],
                user=os.environ["DB_USER"],
                password=os.environ.get("DB_PASS", ""),
                sslmode=os.environ.get("DB_SSL_MODE", "prefer"),
                connect_timeout=10,
            )
            conn.set_session(readonly=True, autocommit=True)
            cur = conn.cursor()
            def run(label, sql):
                print("== " + label + " ==")
                try:
                    cur.execute(sql)
                    print(json.dumps([d[0] for d in cur.description]))
                    for r in cur.fetchall():
                        print(json.dumps(r, default=str))
                except Exception as e:
                    print("ERROR: " + repr(e))
                print()
            queries = [
                ("bitbucket_dc_webhook rows",
                 "SELECT id, project_key, repo_slug, user_id, webhook_id, last_synced "
                 "FROM bitbucket_dc_webhook ORDER BY project_key, repo_slug, id"),
                ("bitbucket_dc_webhook duplicate repos",
                 "SELECT project_key, repo_slug, COUNT(*) AS registrations "
                 "FROM bitbucket_dc_webhook GROUP BY project_key, repo_slug HAVING COUNT(*) > 1"),
                ("bitbucket_webhook rows",
                 "SELECT id, workspace, repo_slug, user_id, webhook_uuid, last_synced "
                 "FROM bitbucket_webhook ORDER BY workspace, repo_slug, id"),
                ("bitbucket_webhook duplicate repos",
                 "SELECT workspace, repo_slug, COUNT(*) AS registrations "
                 "FROM bitbucket_webhook GROUP BY workspace, repo_slug HAVING COUNT(*) > 1"),
                ("gitlab_webhook rows",
                 "SELECT id, group_id, project_id, user_id, webhook_exists, webhook_uuid, last_synced "
                 "FROM gitlab_webhook ORDER BY group_id, project_id, id"),
                ("gitlab_webhook duplicate projects",
                 "SELECT group_id, project_id, COUNT(*) AS registrations "
                 "FROM gitlab_webhook GROUP BY group_id, project_id HAVING COUNT(*) > 1"),
                ("github_app_installations rows",
                 "SELECT id, installation_id, created_at, updated_at "
                 "FROM github_app_installations ORDER BY installation_id, id"),
                ("github_app_installations duplicate installation_id",
                 "SELECT installation_id, COUNT(*) AS n "
                 "FROM github_app_installations GROUP BY installation_id HAVING COUNT(*) > 1"),
                ("jira_dc_workspaces rows",
                 "SELECT id, name, org_id, admin_user_id, status, svc_acc_email, created_at, updated_at "
                 "FROM jira_dc_workspaces ORDER BY name, id"),
                ("offline_tokens freshness summary",
                 "SELECT COUNT(*) AS token_count, MIN(updated_at) AS oldest_refresh, "
                 "MAX(updated_at) AS newest_refresh FROM offline_tokens"),
                ("offline_tokens per-user metadata",
                 "SELECT user_id, created_at, updated_at FROM offline_tokens "
                 "ORDER BY updated_at DESC LIMIT 500"),
                # Per-org LLM/sandbox config. Secret-backed columns appear only as
                # IS NOT NULL presence flags — never the encrypted values.
                ("org llm config",
                 "SELECT id, name, org_version, is_default, v1_enabled, byor_export_enabled, "
                 "max_budget_per_task, sandbox_base_container_image, "
                 "sandbox_runtime_container_image, agent_settings->>'agent' AS agent, "
                 "agent_settings->'llm'->>'model' AS llm_model, "
                 "agent_settings->'llm'->>'base_url' AS llm_base_url, "
                 "conversation_settings->>'max_iterations' AS max_iterations, "
                 "(_llm_api_key IS NOT NULL) AS org_llm_api_key_set, "
                 "(llm_profiles IS NOT NULL) AS has_llm_profiles FROM org ORDER BY name"),
            ]
            for label, sql in queries:
                run(label, sql)
        timeout: 30s
    # Non-secret config/feature snapshot from the running pod: values for flags,
    # presence-only ("set"/"empty_or_unset") for secret-backed vars (never values).
    - exec:
        name: app/openhands-config-snapshot
        collectorName: openhands-config-snapshot
        namespace: {{ .Release.Namespace }}
        selector:
          - app=openhands
        containerName: openhands
        command: ["python3", "-c"]
        args:
          - |
            import json, os
            NONSECRET = [
                "OH_APP_MODE", "OH_DEPLOYMENT_MODE", "OH_WEB_CLIENT_PROVIDERS_CONFIGURED",
                "RUNTIME", "CONVERSATION_MANAGER_CLASS", "RUN_AS_OPENHANDS", "NO_SETUP",
                "REQUIRE_PAYMENT", "ADD_DEBUGGING_ROUTES",
                "AUTOMATION_EVENT_FORWARDING_ENABLED", "AUTOMATION_SERVICE_URL",
                "ENABLE_JIRA", "ENABLE_JIRA_DC", "ENABLE_LINEAR",
                "JIRA_DC_WEBHOOKS_ENABLED", "JIRA_DC_ENABLE_OAUTH", "JIRA_DC_BASE_URL",
                "SLACK_WEBHOOKS_ENABLED", "BITBUCKET_DATA_CENTER_HOST", "GITLAB_HOST",
                "AZURE_DEVOPS_ORGANIZATION", "AZURE_DEVOPS_TENANT_ID",
                "GITHUB_APP_ID", "GITHUB_APP_SLUG",
                "SANDBOX_CLOSE_DELAY", "SANDBOX_KEEP_RUNTIME_ALIVE",
                "FILE_STORE", "SHARED_EVENT_STORAGE_PROVIDER",
                "LITE_LLM_API_URL", "LITE_LLM_TEAM_ID",
                "DB_HOST", "DB_PORT", "DB_NAME", "DB_USER", "DB_SSL_MODE",
                "REDIS_HOST", "REDIS_PORT",
                "KEYCLOAK_SERVER_URL", "KEYCLOAK_REALM_NAME", "KEYCLOAK_CLIENT_ID",
                "WEB_HOST", "AUTH_WEB_HOST", "MCP_HOST",
                "AGENT_SERVER_IMAGE_REPOSITORY", "AGENT_SERVER_IMAGE_TAG",
            ]
            SECRET_PRESENCE = [
                "BITBUCKET_DATA_CENTER_BOT_TOKEN", "BITBUCKET_DATA_CENTER_CLIENT_SECRET",
                "GITHUB_APP_PRIVATE_KEY", "GITHUB_APP_WEBHOOK_SECRET",
                "GITLAB_APP_CLIENT_SECRET", "AZURE_DEVOPS_CLIENT_SECRET", "AZURE_DEVOPS_WEBHOOK_SECRET",
                "JIRA_DC_CLIENT_SECRET", "JIRA_DC_SERVICE_ACCOUNT_PAT",
                "AUTOMATION_WEBHOOK_SECRET", "AUTOMATIONS_SERVICE_KEY",
                "LITE_LLM_API_KEY", "SANDBOX_API_KEY", "JWT_SECRET",
            ]
            config = {k: os.environ.get(k) for k in NONSECRET}
            presence = {k: ("set" if os.environ.get(k) else "empty_or_unset") for k in SECRET_PRESENCE}
            print(json.dumps({"config": config, "secret_presence": presence}, indent=2, default=str))
        timeout: 30s
    {{- if .Values.automation.enabled }}
    # Automation scheduler/dispatcher logs
    - logs:
        name: app/automation/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app=automation
        limits:
          maxAge: 336h
    # Automation events-service (webhook receiver) logs
    - logs:
        name: app/automation-events/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app=automation-events
        limits:
          maxAge: 336h
    # Read-only automation DB dump via the automation pod's own creds (asyncpg).
    # Webhook/automation/run metadata only — never webhook_secret, prompts,
    # tarball paths, event payloads or error detail.
    - exec:
        name: app/automation-db
        collectorName: automation-db-diagnostics
        namespace: {{ .Release.Namespace }}
        selector:
          - app=automation
        containerName: automation
        command: ["python3", "-c"]
        args:
          - |
            import asyncio, json, os, asyncpg
            # mirror automation db.py: pass ssl only for require/disable, omit for prefer/empty
            mode = (os.environ.get("AUTOMATION_DB_SSL_MODE") or "").strip().lower()
            ssl_kwargs = {"ssl": mode} if mode in ("require", "disable") else {}
            async def main():
                conn = await asyncpg.connect(
                    host=os.environ["AUTOMATION_DB_HOST"],
                    port=int(os.environ.get("AUTOMATION_DB_PORT", "5432")),
                    user=os.environ["AUTOMATION_DB_USER"],
                    password=os.environ.get("AUTOMATION_DB_PASS", ""),
                    database=os.environ["AUTOMATION_DB_NAME"],
                    timeout=10,
                    **ssl_kwargs,
                )
                await conn.execute("SET default_transaction_read_only = on")
                async def run(label, sql):
                    print("== " + label + " ==")
                    try:
                        rows = await conn.fetch(sql)
                        if rows:
                            print(json.dumps(list(rows[0].keys())))
                        for r in rows:
                            print(json.dumps(dict(r), default=str))
                    except Exception as e:
                        print("ERROR: " + repr(e))
                    print()
                queries = [
                    ("custom_webhooks",
                     "SELECT id, org_id, name, source, enabled, event_key_expr, "
                     "signature_header, created_at, updated_at FROM custom_webhooks "
                     "ORDER BY created_at"),
                    ("automations",
                     "SELECT id, org_id, user_id, name, model, enabled, last_triggered_at, "
                     "last_polled_at, created_at, updated_at, deleted_at FROM automations "
                     "ORDER BY created_at"),
                    ("automation_runs status counts",
                     "SELECT status, COUNT(*) AS n FROM automation_runs "
                     "GROUP BY status ORDER BY n DESC"),
                    ("automation_runs recent",
                     "SELECT id, automation_id, status, conversation_id, sandbox_id, "
                     "created_at, started_at, completed_at FROM automation_runs "
                     "ORDER BY created_at DESC LIMIT 50"),
                ]
                for label, sql in queries:
                    await run(label, sql)
                await conn.close()
            asyncio.run(main())
        timeout: 30s
    {{- end }}
    # Ingress NGINX controller logs
    - logs:
        name: ingress-nginx/logs
        selector:
          - app.kubernetes.io/name=ingress-nginx
        namespace: ingress-nginx
        limits:
          maxAge: 336h
    # Replicated embedded clusters use Traefik rather than ingress-nginx.
    - logs:
        name: traefik/logs
        selector:
          - app.kubernetes.io/name=traefik
        namespace: traefik
        limits:
          maxAge: 336h
    {{- if and .Values.postgresql.enabled .Values.replicated.enabled .Values.replicated.postgresPassword }}
    - postgresql:
        collectorName: postgresql
        uri: postgresql://{{ .Values.replicated.postgresUsername | urlquery }}:{{ .Values.replicated.postgresPassword | urlquery }}@{{ .Release.Name }}-postgresql.{{ .Release.Namespace }}.svc.cluster.local:5432/{{ .Values.replicated.postgresDatabase }}?sslmode=disable
        tls:
          disabled: true
    {{- end }}
    {{- if and (include "openhands.cache.backend" .) .Values.replicated.enabled .Values.replicated.redisPassword }}
    {{- /* Collector type is `redis` for both backends: Valkey speaks RESP and
    `default` is its ACL user. */}}
    - redis:
        collectorName: redis
        uri: redis://default:{{ .Values.replicated.redisPassword | urlquery }}@{{ include "openhands.cache.host" . }}.{{ .Release.Namespace }}.svc.cluster.local:6379
    {{- end }}
  analyzers: {{- include "troubleshoot.analyzers.shared" .  | nindent 4 }}
    - deploymentStatus:
        name: openhands
        namespace: {{ .Release.Namespace }}
        outcomes:
          - fail:
              when: "< 1"
              message: "OpenHands main deployment is not ready"
          - pass:
              when: ">= 1"
              message: "OpenHands main deployment is ready"
    - deploymentStatus:
        name: openhands-integrations
        namespace: {{ .Release.Namespace }}
        outcomes:
          - fail:
              when: "< 1"
              message: "OpenHands integrations deployment is not ready"
          - pass:
              when: ">= 1"
              message: "OpenHands integrations deployment is ready"
    - deploymentStatus:
        name: openhands-mcp
        namespace: {{ .Release.Namespace }}
        outcomes:
          - fail:
              when: "< 1"
              message: "OpenHands MCP deployment is not ready"
          - pass:
              when: ">= 1"
              message: "OpenHands MCP deployment is ready"
    {{- if and (index .Values "litellm-helm") (index .Values "litellm-helm" "enabled") }}
    - deploymentStatus:
        name: {{ .Release.Name }}-litellm
        namespace: {{ .Release.Namespace }}
        outcomes:
          - fail:
              when: "< 1"
              message: "OpenHands LiteLLM deployment is not ready"
          - pass:
              when: ">= 1"
              message: "OpenHands LiteLLM deployment is ready"
    {{- end }}
    {{- if .Values.minio.enabled }}
    - deploymentStatus:
        name: {{ .Release.Name }}-minio
        namespace: {{ .Release.Namespace }}
        outcomes:
          - fail:
              when: "< 1"
              message: "OpenHands MinIO deployment is not ready"
          - pass:
              when: ">= 1"
              message: "OpenHands MinIO deployment is ready"
    {{- end }}
    {{- if index .Values "runtime-api" "enabled" }}
    - deploymentStatus:
        name: {{ .Release.Name }}-runtime-api
        namespace: {{ .Release.Namespace }}
        outcomes:
          - fail:
              when: "< 1"
              message: "OpenHands Runtime API deployment is not ready"
          - pass:
              when: ">= 1"
              message: "OpenHands Runtime API deployment is ready"
    - textAnalyze:
        checkName: "Starting Runtime Ingress Reachability"
        collectorName: app/{{ .Release.Name }}-runtime-api-ingress
        fileName: "*/*/runtime-api-ingress-diagnostics-stdout.txt"
        regexGroups: '"overall":\s*"(?P<Overall>[^"]+)"'
        outcomes:
          - fail:
              when: "Overall == fail"
              message: "A stale starting runtime is not reachable through its external ingress; inspect runtime-api-ingress-diagnostics for DNS, TLS, Service, and HTTP results"
          - warn:
              when: "Overall == collector-error"
              message: "Runtime ingress diagnostics could not complete; inspect runtime-api-ingress-diagnostics for the collector error"
          - pass:
              when: "Overall == pass"
              message: "All stale starting runtimes are reachable through their external ingresses"
          - pass:
              message: "No stale starting runtimes required an ingress check"
    {{- end }}
    {{- if .Values.postgresql.enabled }}
    - statefulsetStatus:
        name: {{ .Release.Name }}-postgresql
        namespace: {{ .Release.Namespace }}
        outcomes:
          - fail:
              when: "< 1"
              message: "OpenHands PostgreSQL statefulset is not ready"
          - pass:
              when: ">= 1"
              message: "OpenHands PostgreSQL statefulset is ready"
    {{- end }}
    {{- if eq (include "openhands.cache.backend" .) "redis" }}
    - statefulsetStatus:
        name: {{ .Release.Name }}-redis-master
        namespace: {{ .Release.Namespace }}
        outcomes:
          - fail:
              when: "< 1"
              message: "OpenHands Redis statefulset is not ready"
          - pass:
              when: ">= 1"
              message: "OpenHands Redis statefulset is ready"
    {{- end }}
    {{- if eq (include "openhands.cache.backend" .) "valkey" }}
    - deploymentStatus:
        name: {{ .Release.Name }}-valkey
        namespace: {{ .Release.Namespace }}
        outcomes:
          - fail:
              when: "< 1"
              message: "OpenHands Valkey deployment is not ready"
          - pass:
              when: ">= 1"
              message: "OpenHands Valkey deployment is ready"
    {{- end }}
    {{- if .Values.keycloak.enabled }}
    - statefulsetStatus:
        name: keycloak
        namespace: {{ .Release.Namespace }}
        outcomes:
          - fail:
              when: "< 1"
              message: "OpenHands Keycloak statefulset is not ready"
          - pass:
              when: ">= 1"
              message: "OpenHands Keycloak statefulset is ready"
    {{- end }}
    - deploymentStatus:
        name: ingress-nginx-controller
        namespace: ingress-nginx
        outcomes:
          - fail:
              when: "< 1"
              message: "Ingress NGINX controller deployment is not ready"
          - pass:
              when: ">= 1"
              message: "Ingress NGINX controller deployment is ready"
    # No `name` => all-deployments mode: auto-fails any deployment whose ready
    # count doesn't match desired. Named blocks above guard "must exist at all".
    - deploymentStatus:
        namespaces:
          - {{ .Release.Namespace }}
          - ingress-nginx
    - clusterPodStatuses:
        namespaces:
          - {{ .Release.Namespace }}
          - ingress-nginx
        outcomes:
          - fail:
              when: "!= Healthy"
              message: "Pod {{`{{ .Namespace }}/{{ .Name }}`}} is not Healthy: {{`{{ .Status.Reason }}`}}"
    {{- if and .Values.postgresql.enabled .Values.replicated.enabled .Values.replicated.postgresPassword }}
    - postgresql:
        checkName: "PostgreSQL Database Health"
        collectorName: postgresql
        outcomes:
          - fail:
              when: "connected == false"
              message: "Cannot connect to PostgreSQL database"
          - fail:
              when: "version == \"\""
              message: "PostgreSQL version could not be determined"
          - warn:
              when: "version < 12.0.0"
              message: "PostgreSQL version is older than recommended (12.0.0+)"
          - pass:
              when: "connected == true"
              message: "PostgreSQL database is healthy"
    {{- end }}
    {{- if and (include "openhands.cache.backend" .) .Values.replicated.enabled .Values.replicated.redisPassword }}
    - redis:
        checkName: "Cache Health"
        collectorName: redis
        outcomes:
          - fail:
              when: "connected == false"
              message: "Cannot connect to the cache server"
          - fail:
              when: "version == \"\""
              message: "Cache server version could not be determined"
          - warn:
              when: "version < 6.0.0"
              message: "Cache server version is older than recommended (6.0.0+)"
          - pass:
              when: "connected == true"
              message: "Cache server is healthy"
    {{- end }}
{{- end -}}
