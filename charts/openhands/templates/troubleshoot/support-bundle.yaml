{{- define "troubleshoot.supportBundle" -}}
apiVersion: troubleshoot.sh/v1beta2
kind: SupportBundle
metadata:
  name: {{ .Release.Name }}-support-bundle
spec:
  collectors: {{- include "troubleshoot.collectors.shared" .  | nindent 4 }}
    {{- /* Presence of admin-configured/optional secrets: a key renders only when its KOTS
    value is set, so includeValue:false keyExists ⇔ value-set -- presence only, never the value.
    Always-generated internal secrets are omitted; they'd read "set" unconditionally. */}}
    {{- $secretKeys := dict
      "azure-devops-app"          (list "client-id" "client-secret")
      "bitbucket-data-center-app" (list "host" "client-id" "client-secret" "bot-token")
      "github-app"                (list "app-id" "app-slug" "client-id" "client-secret" "private-key" "webhook-secret")
      "gitlab-app"                (list "client-id" "client-secret")
      "jira-dc-app"               (list "base-url" "client-id" "client-secret" "service-account-email" "service-account-pat")
      "keycloak-realm"            (list "client-id" "client-secret" "smtp-password")
      "litellm-env-secrets"       (list "ANTHROPIC_API_KEY" "OPENAI_API_KEY" "GOOGLE_API_KEY" "GOOGLE_APPLICATION_CREDENTIALS_JSON" "VERTEXAI_PROJECT" "VERTEXAI_LOCATION" "DEEPSEEK_API_KEY" "MISTRAL_API_KEY" "AZURE_API_KEY" "AZURE_TENANT_ID" "AZURE_CLIENT_ID" "AZURE_CLIENT_SECRET" "AZURE_API_BASE" "AZURE_API_VERSION" "GROQ_API_KEY" "OPENROUTER_API_KEY" "AWS_ACCESS_KEY_ID" "AWS_SECRET_ACCESS_KEY" "AWS_REGION_NAME" "CUSTOM_API_KEY" "CUSTOM_API_BASE")
      "openhands-env-secrets"     (list "LLM_API_KEY" "LLM_MODEL" "LLM_BASE_URL" "LLM_API_VERSION" "AWS_ACCESS_KEY_ID" "AWS_SECRET_ACCESS_KEY" "AWS_REGION_NAME")
      "openhands-tls"             (list "tls.crt" "ca.crt")
      "postgres-password"         (list "postgres-password")
      "redis"                     (list "redis-password")
      "s3-credentials"            (list "access-key" "secret-key")
      "sandbox-api-key"           (list "sandbox-api-key")
      "slack-auth"                (list "client-id" "client-secret" "signing-secret")
    }}
    {{- range $name, $keys := $secretKeys }}
    {{- range $key := $keys }}
    - secret:
        name: {{ $name }}
        namespace: {{ $.Release.Namespace }}
        key: {{ $key }}
        includeValue: false
    {{- end }}
    {{- end }}
    # Log volume is bounded by kubelet rotation (~tens of MB/pod), not maxAge,
    # so 336h is free on chatty pods and only adds history on quiet ones.
    # OpenHands main application logs
    - logs:
        name: app/openhands/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app=openhands
        limits:
          maxAge: 336h
    # OpenHands integrations deployment logs
    - logs:
        name: app/openhands-integrations/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app=openhands-integrations
        limits:
          maxAge: 336h
    # OpenHands MCP deployment logs
    - logs:
        name: app/openhands-mcp/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app=openhands-mcp
        limits:
          maxAge: 336h
    {{- if .Values.postgresql.enabled }}
    # PostgreSQL logs (Bitnami chart)
    - logs:
        name: app/{{ .Release.Name }}-postgresql/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app.kubernetes.io/name=postgresql
          - app.kubernetes.io/instance={{ .Release.Name }}
        limits:
          maxAge: 336h
    {{- end }}
    {{- if include "openhands.cache.backend" . }}
    {{- if eq (include "openhands.cache.backend" .) "valkey" }}
    # Valkey logs (official valkey chart)
    {{- else }}
    # Redis logs (Bitnami chart)
    {{- end }}
    - logs:
        name: app/{{ .Release.Name }}-{{ include "openhands.cache.backend" . }}/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app.kubernetes.io/name={{ include "openhands.cache.backend" . }}
          - app.kubernetes.io/instance={{ .Release.Name }}
        limits:
          maxAge: 336h
    {{- end }}
    {{- if .Values.keycloak.enabled }}
    # Keycloak logs (Bitnami chart)
    - logs:
        name: app/{{ .Release.Name }}-keycloak/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app.kubernetes.io/name=keycloak
          - app.kubernetes.io/instance={{ .Release.Name }}
        limits:
          maxAge: 336h
    {{- end }}
    {{- if .Values.minio.enabled }}
    # MinIO logs (MinIO chart)
    - logs:
        name: app/{{ .Release.Name }}-minio/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app=minio
          - release={{ .Release.Name }}
        limits:
          maxAge: 336h
    {{- end }}
    {{- if .Values.laminar.enabled }}
    # Laminar ClickHouse pod logs plus read-only system-table diagnostics. The
    # ClickHouse system tables themselves are TTL-bounded, so this collector
    # captures table sizes, TTL metadata and the most recent trace rows.
    - logs:
        name: app/laminar-clickhouse/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app=laminar-clickhouse
        limits:
          maxAge: 336h
    - exec:
        name: app/laminar-clickhouse-diagnostics
        collectorName: laminar-clickhouse-diagnostics
        namespace: {{ .Release.Namespace }}
        selector:
          - app=laminar-clickhouse
        containerName: clickhouse
        command: ["/bin/bash", "-ec"]
        args:
          - |
            client=(clickhouse-client --host localhost --port 9000 --user "${CLICKHOUSE_USER:-default}" --password="${CLICKHOUSE_PASSWORD:-}")
            run() {
              echo "== $1 =="
              if ! "${client[@]}" --query "$2"; then
                echo "ERROR: query failed"
              fi
              echo
            }
            run "system diagnostic table sizes and ttl" "SELECT database, name, total_rows, formatReadableSize(total_bytes) AS size, metadata_modification_time, if(position(engine_full, 'TTL ') = 0, 'none', substring(engine_full, position(engine_full, 'TTL '), 160)) AS ttl FROM system.tables WHERE database = 'system' AND name IN ('asynchronous_metric_log','metric_log','query_log','query_thread_log','query_views_log','part_log','session_log','text_log','trace_log','crash_log','opentelemetry_span_log','zookeeper_log','blob_storage_log','processors_profile_log') ORDER BY total_bytes DESC FORMAT JSONEachRow"
            run "recent trace_log rows" "SELECT event_time, trace_type, thread_name, query_id FROM system.trace_log ORDER BY event_time DESC LIMIT 50 FORMAT JSONEachRow"
            run "recent text_log rows" "SELECT event_time, level, logger_name, message FROM system.text_log ORDER BY event_time DESC LIMIT 50 FORMAT JSONEachRow"
        timeout: 30s
    {{- end }}
    {{- if index .Values "runtime-api" "enabled" }}
    # Runtime API logs
    - logs:
        name: app/{{ .Release.Name }}-runtime-api/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app.kubernetes.io/name=runtime-api
          - app.kubernetes.io/instance={{ .Release.Name }}
        limits:
          maxAge: 336h
    # Runtime sandbox pod logs. Pod names are dynamic (runtime-*) and the
    # logs collector has no glob-name support, so select by the runtime_id
    # label — a bare key matches "label exists with any value". Pod/event
    # metadata is already captured by the top-level clusterResources collector.
    - logs:
        name: runtime-sandboxes/logs
        selector:
          - runtime_id
        limits:
          maxAge: 336h
        timestamps: true
    # Read-only runtimes dump via the runtime-api pod's own DB creds (pg8000,
    # runtime_api_db). Surfaces custom sandbox images + status; never selects
    # the environment JSON or session_api_key. Also prints pull-secret NAMES.
    - exec:
        name: app/{{ .Release.Name }}-runtime-api-db
        collectorName: runtime-api-db-diagnostics
        namespace: {{ .Release.Namespace }}
        selector:
          - app.kubernetes.io/name=runtime-api
        containerName: runtime-api
        command: ["python3", "-c"]
        args:
          - |
            import json, os, pg8000.dbapi
            kw = dict(
                host=os.environ["DB_HOST"],
                port=int(os.environ.get("DB_PORT", "5432")),
                user=os.environ["DB_USER"],
                password=os.environ.get("DB_PASS", ""),
                database=os.environ["DB_NAME"],
                timeout=10,
            )
            # mirror runtime-api db.py: ssl_context True/False for require/disable, omit otherwise
            mode = (os.environ.get("DB_SSL_MODE") or "").strip().lower()
            if mode == "require":
                kw["ssl_context"] = True
            elif mode == "disable":
                kw["ssl_context"] = False
            print("RUNTIME_IMAGE_PULL_SECRETS=" + os.environ.get("RUNTIME_IMAGE_PULL_SECRETS", ""))
            conn = pg8000.dbapi.connect(**kw)
            conn.autocommit = True
            cur = conn.cursor()
            cur.execute("SET default_transaction_read_only = on")
            def run(label, sql):
                print("== " + label + " ==")
                try:
                    cur.execute(sql)
                    cols = [d[0] for d in cur.description]
                    print(json.dumps(cols))
                    for r in cur.fetchall():
                        print(json.dumps(dict(zip(cols, r)), default=str))
                except Exception as e:
                    print("ERROR: " + repr(e))
                print()
            queries = [
                ("runtimes image/status summary",
                 "SELECT image, status, COUNT(*) AS n FROM runtimes "
                 "GROUP BY image, status ORDER BY n DESC"),
                ("runtimes recent",
                 "SELECT runtime_id, session_id, api_key_name, status, image, working_dir, "
                 "created_at, stopped_at, last_state_change, cpu_millicores, memory_mb, "
                 "storage_gb, running_time, paused_time, run_as_user, run_as_group, fs_group "
                 "FROM runtimes ORDER BY created_at DESC LIMIT 50"),
            ]
            for label, sql in queries:
                run(label, sql)
            conn.close()
        timeout: 30s
    {{- end }}
    {{- if and (index .Values "litellm-helm") (index .Values "litellm-helm" "enabled") }}
    # LiteLLM logs
    - logs:
        name: app/{{ .Release.Name }}-litellm/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app.kubernetes.io/name=litellm
          - app.kubernetes.io/instance={{ .Release.Name }}
        limits:
          maxAge: 336h
    # Live LiteLLM proxy model list (/model/info): config-rendered models
    # plus any models added at runtime via the LiteLLM dashboard
    # (store_model_in_db). Authenticates with the proxy's own
    # PROXY_MASTER_KEY env var (wired from the lite-llm-api-key secret by
    # the litellm-helm chart). LiteLLM redacts api_key values server-side;
    # api_base values may appear, which is acceptable. The image has no
    # curl, so use the bundled python3.
    - exec:
        name: app/{{ .Release.Name }}-litellm
        collectorName: litellm-model-info
        namespace: {{ .Release.Namespace }}
        selector:
          - app.kubernetes.io/name=litellm
          - app.kubernetes.io/instance={{ .Release.Name }}
        containerName: litellm
        command: ["python3", "-c"]
        args:
          - |
            import os, urllib.request
            req = urllib.request.Request(
                "http://localhost:4000/model/info",
                headers={"Authorization": "Bearer " + os.environ["PROXY_MASTER_KEY"]},
            )
            print(urllib.request.urlopen(req, timeout=15).read().decode())
        timeout: 30s
    {{- end }}
    # Read-only integration STATE via the openhands pod's own DB creds. Dumps
    # webhook/connection ids, repos and timestamps to spot duplicate
    # registrations; SELECTs only non-secret columns (never tokens/secrets).
    - exec:
        name: app/openhands-db-diagnostics
        collectorName: openhands-db-diagnostics
        namespace: {{ .Release.Namespace }}
        selector:
          - app=openhands
        containerName: openhands
        command: ["python3", "-c"]
        args:
          - |
            import json, os, psycopg2
            conn = psycopg2.connect(
                host=os.environ["DB_HOST"],
                port=os.environ.get("DB_PORT", "5432"),
                dbname=os.environ["DB_NAME"],
                user=os.environ["DB_USER"],
                password=os.environ.get("DB_PASS", ""),
                sslmode=os.environ.get("DB_SSL_MODE", "prefer"),
                connect_timeout=10,
            )
            conn.set_session(readonly=True, autocommit=True)
            cur = conn.cursor()
            def run(label, sql):
                print("== " + label + " ==")
                try:
                    cur.execute(sql)
                    print(json.dumps([d[0] for d in cur.description]))
                    for r in cur.fetchall():
                        print(json.dumps(r, default=str))
                except Exception as e:
                    print("ERROR: " + repr(e))
                print()
            queries = [
                ("bitbucket_dc_webhook rows",
                 "SELECT id, project_key, repo_slug, user_id, webhook_id, last_synced "
                 "FROM bitbucket_dc_webhook ORDER BY project_key, repo_slug, id"),
                ("bitbucket_dc_webhook duplicate repos",
                 "SELECT project_key, repo_slug, COUNT(*) AS registrations "
                 "FROM bitbucket_dc_webhook GROUP BY project_key, repo_slug HAVING COUNT(*) > 1"),
                ("bitbucket_webhook rows",
                 "SELECT id, workspace, repo_slug, user_id, webhook_uuid, last_synced "
                 "FROM bitbucket_webhook ORDER BY workspace, repo_slug, id"),
                ("bitbucket_webhook duplicate repos",
                 "SELECT workspace, repo_slug, COUNT(*) AS registrations "
                 "FROM bitbucket_webhook GROUP BY workspace, repo_slug HAVING COUNT(*) > 1"),
                ("gitlab_webhook rows",
                 "SELECT id, group_id, project_id, user_id, webhook_exists, webhook_uuid, last_synced "
                 "FROM gitlab_webhook ORDER BY group_id, project_id, id"),
                ("gitlab_webhook duplicate projects",
                 "SELECT group_id, project_id, COUNT(*) AS registrations "
                 "FROM gitlab_webhook GROUP BY group_id, project_id HAVING COUNT(*) > 1"),
                ("github_app_installations rows",
                 "SELECT id, installation_id, created_at, updated_at "
                 "FROM github_app_installations ORDER BY installation_id, id"),
                ("github_app_installations duplicate installation_id",
                 "SELECT installation_id, COUNT(*) AS n "
                 "FROM github_app_installations GROUP BY installation_id HAVING COUNT(*) > 1"),
                ("jira_dc_workspaces rows",
                 "SELECT id, name, org_id, admin_user_id, status, svc_acc_email, created_at, updated_at "
                 "FROM jira_dc_workspaces ORDER BY name, id"),
                ("offline_tokens freshness summary",
                 "SELECT COUNT(*) AS token_count, MIN(updated_at) AS oldest_refresh, "
                 "MAX(updated_at) AS newest_refresh FROM offline_tokens"),
                ("offline_tokens per-user metadata",
                 "SELECT user_id, created_at, updated_at FROM offline_tokens "
                 "ORDER BY updated_at DESC LIMIT 500"),
                # Per-org LLM/sandbox config. Secret-backed columns appear only as
                # IS NOT NULL presence flags — never the encrypted values.
                ("org llm config",
                 "SELECT id, name, org_version, is_default, v1_enabled, byor_export_enabled, "
                 "max_budget_per_task, sandbox_base_container_image, "
                 "sandbox_runtime_container_image, agent_settings->>'agent' AS agent, "
                 "agent_settings->'llm'->>'model' AS llm_model, "
                 "agent_settings->'llm'->>'base_url' AS llm_base_url, "
                 "conversation_settings->>'max_iterations' AS max_iterations, "
                 "(_llm_api_key IS NOT NULL) AS org_llm_api_key_set, "
                 "(llm_profiles IS NOT NULL) AS has_llm_profiles FROM org ORDER BY name"),
            ]
            for label, sql in queries:
                run(label, sql)
        timeout: 30s
    # Sanitized budget reconciliation snapshot. This compares Enterprise's
    # desired policy/baselines with LiteLLM's live applied team/member caps.
    # It includes opaque org/user ids but never reads or emits managed keys.
    - exec:
        name: app/openhands-budget-diagnostics
        collectorName: openhands-budget-diagnostics
        namespace: {{ .Release.Namespace }}
        selector:
          - app=openhands
        containerName: openhands
        command: ["python3", "-c"]
        args:
          - |
            import concurrent.futures, json, os, urllib.error, urllib.parse, urllib.request

            import psycopg2
            from psycopg2.extras import RealDictCursor

            output = {
                "collector_version": 1,
                "schema_version": None,
                "org_budget_settings": [],
                "org_user_budget_overrides": [],
                "recent_budget_maintenance_tasks": [],
                "litellm_applied_state": [],
                "summary": {},
                "collector_errors": [],
            }

            conn = psycopg2.connect(
                host=os.environ["DB_HOST"],
                port=os.environ.get("DB_PORT", "5432"),
                dbname=os.environ["DB_NAME"],
                user=os.environ["DB_USER"],
                password=os.environ.get("DB_PASS", ""),
                sslmode=os.environ.get("DB_SSL_MODE", "prefer"),
                connect_timeout=10,
            )
            conn.set_session(readonly=True, autocommit=True)

            def table_columns(table):
                with conn.cursor() as cur:
                    cur.execute(
                        "SELECT column_name FROM information_schema.columns "
                        "WHERE table_schema = current_schema() AND table_name = %s",
                        (table,),
                    )
                    return {row[0] for row in cur.fetchall()}

            def rows(sql, params=()):
                with conn.cursor(cursor_factory=RealDictCursor) as cur:
                    cur.execute(sql, params)
                    return [dict(row) for row in cur.fetchall()]

            try:
                versions = rows("SELECT version_num FROM alembic_version")
                output["schema_version"] = [row["version_num"] for row in versions]
            except Exception as exc:
                output["collector_errors"].append(
                    {"section": "schema_version", "error": type(exc).__name__}
                )

            budget_columns = table_columns("org_budget_settings")
            wanted_budget_columns = [
                "org_id", "enabled", "monthly_limit", "reset_day",
                "default_user_monthly_limit", "cycle_start_at", "cycle_start_spend",
                "user_cycle_start_spend", "litellm_last_sync_at",
                "litellm_last_sync_status", "litellm_last_sync_error",
                "litellm_last_spend_snapshot_at", "litellm_last_team_spend",
                "litellm_last_member_spend", "litellm_known_member_ids",
                "created_at", "updated_at",
            ]
            selected_budget_columns = [
                column for column in wanted_budget_columns if column in budget_columns
            ]
            if selected_budget_columns:
                budget_rows = rows(
                    "SELECT " + ", ".join(selected_budget_columns)
                    + " FROM org_budget_settings ORDER BY org_id"
                )
                member_rows = rows("SELECT org_id, user_id FROM org_member ORDER BY org_id, user_id")
                member_ids_by_org = {}
                for member in member_rows:
                    member_ids_by_org.setdefault(str(member["org_id"]), []).append(
                        str(member["user_id"])
                    )

                for budget in budget_rows:
                    org_id = str(budget["org_id"])
                    actual_member_ids = member_ids_by_org.get(org_id, [])
                    baselines = budget.get("user_cycle_start_spend") or {}
                    known_ids = budget.get("litellm_known_member_ids") or []
                    snapshot = budget.get("litellm_last_member_spend") or {}
                    budget["member_count"] = len(actual_member_ids)
                    budget["enterprise_member_ids"] = actual_member_ids
                    budget["members_missing_cycle_baseline"] = sorted(
                        user_id for user_id in actual_member_ids if user_id not in baselines
                    )
                    if "litellm_known_member_ids" in budget:
                        budget["known_members_missing_cycle_baseline"] = sorted(
                            user_id
                            for user_id in actual_member_ids
                            if user_id in known_ids and user_id not in baselines
                        )
                    if "litellm_last_member_spend" in budget:
                        budget["members_missing_last_spend_snapshot"] = sorted(
                            user_id for user_id in actual_member_ids if user_id not in snapshot
                        )
                    monthly_limit = budget.get("monthly_limit")
                    budget["desired_team_max_budget"] = (
                        float(budget.get("cycle_start_spend") or 0) + float(monthly_limit)
                        if budget.get("enabled") and monthly_limit
                        else None
                    )
                    output["org_budget_settings"].append(budget)

            override_columns = table_columns("org_user_budget_override")
            wanted_override_columns = [
                "org_id", "user_id", "monthly_limit", "is_disabled",
                "created_at", "updated_at",
            ]
            selected_override_columns = [
                column for column in wanted_override_columns if column in override_columns
            ]
            if selected_override_columns:
                output["org_user_budget_overrides"] = rows(
                    "SELECT " + ", ".join(selected_override_columns)
                    + " FROM org_user_budget_override ORDER BY org_id, user_id"
                )

            overrides_by_member = {
                (str(override["org_id"]), str(override["user_id"])): override
                for override in output["org_user_budget_overrides"]
            }

            maintenance_columns = table_columns("maintenance_tasks")
            if {"processor_type", "status"}.issubset(maintenance_columns):
                selected_task_columns = [
                    column
                    for column in (
                        "id", "status", "processor_type", "started_at", "info",
                        "created_at", "updated_at",
                    )
                    if column in maintenance_columns
                ]
                output["recent_budget_maintenance_tasks"] = rows(
                    "SELECT " + ", ".join(selected_task_columns)
                    + " FROM maintenance_tasks "
                    "WHERE processor_type LIKE %s ORDER BY id DESC LIMIT 50",
                    ("%OrgBudgetMaintenanceProcessor",),
                )

            lite_llm_url = os.environ.get("LITE_LLM_API_URL", "").rstrip("/")
            lite_llm_key = os.environ.get("LITE_LLM_API_KEY")

            def budgets_match(desired, applied):
                if desired is None or applied is None:
                    return desired is None and applied is None
                try:
                    return abs(float(desired) - float(applied)) < 0.000001
                except (TypeError, ValueError):
                    return False

            def desired_member_budget(budget, user_id, live_spend):
                if not budget.get("enabled"):
                    return {
                        "status": "resolved",
                        "max_budget_in_team": None,
                        "requires_private_budget": False,
                    }
                override = overrides_by_member.get((str(budget["org_id"]), user_id))
                if override and override.get("is_disabled"):
                    return {
                        "status": "resolved",
                        "max_budget_in_team": None,
                        "requires_private_budget": False,
                    }
                effective_limit = (
                    override.get("monthly_limit")
                    if override is not None
                    else budget.get("default_user_monthly_limit")
                )
                if effective_limit is None:
                    return {
                        "status": "resolved",
                        "max_budget_in_team": None,
                        "requires_private_budget": False,
                    }
                baselines = budget.get("user_cycle_start_spend") or {}
                if user_id not in baselines:
                    known_member_ids = budget.get("litellm_known_member_ids")
                    if (
                        "litellm_known_member_ids" in budget
                        and user_id not in (known_member_ids or [])
                    ):
                        if live_spend is None:
                            return {
                                "status": "unknown_missing_live_spend",
                                "max_budget_in_team": None,
                                "requires_private_budget": True,
                            }
                        return {
                            "status": "resolved_new_member_from_live_spend",
                            "max_budget_in_team": (
                                float(live_spend) + float(effective_limit)
                            ),
                            "requires_private_budget": True,
                        }
                    return {
                        "status": "unknown_missing_known_member_cycle_baseline",
                        "max_budget_in_team": None,
                        "requires_private_budget": True,
                    }
                return {
                    "status": "resolved",
                    "max_budget_in_team": (
                        float(baselines[user_id]) + float(effective_limit)
                    ),
                    "requires_private_budget": True,
                }

            def member_budget_matches(desired, applied, has_private_budget):
                if not desired["status"].startswith("resolved"):
                    return None
                if not desired["requires_private_budget"]:
                    return not has_private_budget
                return has_private_budget and budgets_match(
                    desired["max_budget_in_team"], applied
                )

            def fetch_applied_state(budget):
                org_id = str(budget["org_id"])
                result = {"org_id": org_id}
                if not lite_llm_url or not lite_llm_key:
                    result["error"] = "litellm_not_configured"
                    return result
                request = urllib.request.Request(
                    lite_llm_url + "/team/info?" + urllib.parse.urlencode({"team_id": org_id}),
                    headers={
                        "Authorization": "Bearer " + lite_llm_key,
                        "x-goog-api-key": lite_llm_key,
                    },
                )
                try:
                    with urllib.request.urlopen(request, timeout=5) as response:
                        payload = json.load(response)
                    team = payload.get("team_info") or {}
                    memberships = [
                        member
                        for member in (payload.get("team_memberships") or [])
                        if isinstance(member, dict)
                        and member.get("user_id")
                        and member.get("user_id") != "default_user_id"
                    ]
                    memberships_by_user_id = {
                        str(member["user_id"]): member for member in memberships
                    }
                    roster_member_ids = {
                        str(member.get("user_id"))
                        for member in (team.get("members_with_roles") or [])
                        if isinstance(member, dict)
                        and member.get("user_id")
                        and member.get("user_id") != "default_user_id"
                    }
                    # LiteLLM can have a roster member without a TeamMembership
                    # row until a private cap is assigned. Include both sources.
                    litellm_member_ids = roster_member_ids | set(
                        memberships_by_user_id
                    )
                    key_spend_by_user_id = {}
                    for key in payload.get("keys") or []:
                        if not isinstance(key, dict) or key.get("team_id") != org_id:
                            continue
                        user_id = key.get("user_id")
                        spend = key.get("spend")
                        if (
                            not user_id
                            or isinstance(spend, bool)
                            or not isinstance(spend, (int, float))
                        ):
                            continue
                        key_spend_by_user_id[str(user_id)] = (
                            key_spend_by_user_id.get(str(user_id), 0.0) + float(spend)
                        )
                    enterprise_member_ids = set(budget["enterprise_member_ids"])
                    default_member_budget_id = (team.get("metadata") or {}).get(
                        "team_member_budget_id"
                    )
                    member_results = []
                    members_without_expected_private_budget = []
                    for user_id in sorted(litellm_member_ids):
                        member = memberships_by_user_id.get(user_id)
                        if member is None:
                            spend = key_spend_by_user_id.get(user_id)
                            applied = team.get("max_budget")
                            applied_budget_source = "team_shared_roster_only"
                            has_private_budget = False
                        else:
                            spend = member.get("spend")
                            budget_id = member.get("budget_id")
                            uses_shared_budget = budget_id is None or (
                                default_member_budget_id is not None
                                and budget_id == default_member_budget_id
                            )
                            if uses_shared_budget:
                                applied = team.get("max_budget")
                                applied_budget_source = "team_shared_membership"
                                has_private_budget = False
                            else:
                                budget_table = member.get("litellm_budget_table")
                                applied = (
                                    budget_table.get("max_budget")
                                    if isinstance(budget_table, dict)
                                    else None
                                )
                                applied_budget_source = "private_membership"
                                has_private_budget = True
                        desired = desired_member_budget(
                            budget, user_id, spend
                        )
                        if (
                            desired["requires_private_budget"]
                            and not has_private_budget
                            and user_id in enterprise_member_ids
                        ):
                            members_without_expected_private_budget.append(user_id)
                        member_results.append(
                            {
                                "user_id": user_id,
                                "team_id": (
                                    member.get("team_id", org_id)
                                    if member is not None
                                    else org_id
                                ),
                                "spend": spend,
                                "applied_max_budget_in_team": applied,
                                "applied_budget_source": applied_budget_source,
                                "desired_max_budget_in_team": desired["max_budget_in_team"],
                                "desired_budget_status": desired["status"],
                                "desired_private_budget_required": desired[
                                    "requires_private_budget"
                                ],
                                "budget_matches": member_budget_matches(
                                    desired, applied, has_private_budget
                                ),
                                "is_enterprise_org_member": user_id in enterprise_member_ids,
                            }
                        )
                    result.update(
                        team_found=True,
                        applied_team_max_budget=team.get("max_budget"),
                        desired_team_max_budget=budget["desired_team_max_budget"],
                        team_budget_matches=budgets_match(
                            budget["desired_team_max_budget"], team.get("max_budget")
                        ),
                        team_spend=team.get("spend"),
                        members_missing_from_litellm_roster=sorted(
                            enterprise_member_ids - litellm_member_ids
                        ),
                        members_without_expected_private_budget=sorted(
                            members_without_expected_private_budget
                        ),
                        unexpected_litellm_roster_member_ids=sorted(
                            litellm_member_ids - enterprise_member_ids
                        ),
                        members=member_results,
                    )
                except urllib.error.HTTPError as exc:
                    result.update(team_found=False, error="http_error", status=exc.code)
                except Exception as exc:
                    result.update(team_found=False, error=type(exc).__name__)
                return result

            budget_orgs = output["org_budget_settings"][:200]
            with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
                output["litellm_applied_state"] = list(
                    pool.map(fetch_applied_state, budget_orgs)
                )

            budget_by_org = {
                str(budget["org_id"]): budget
                for budget in output["org_budget_settings"]
            }
            degraded_org_ids = []
            for applied_state in output["litellm_applied_state"]:
                budget = budget_by_org[applied_state["org_id"]]
                reasons = []
                if applied_state.get("error"):
                    reasons.append("litellm_applied_state_unavailable")
                else:
                    if not applied_state.get("team_budget_matches", False):
                        reasons.append("team_budget_mismatch")
                    if any(
                        member.get("budget_matches") is False
                        for member in applied_state.get("members", [])
                    ):
                        reasons.append("member_budget_mismatch")
                    if applied_state.get("members_missing_from_litellm_roster"):
                        reasons.append("members_missing_from_litellm_roster")
                    if applied_state.get("members_without_expected_private_budget"):
                        reasons.append("members_without_expected_private_budget")
                    if applied_state.get("unexpected_litellm_roster_member_ids"):
                        reasons.append("unexpected_litellm_roster_members")
                if budget.get("known_members_missing_cycle_baseline"):
                    reasons.append("known_member_cycle_baseline_missing")
                if budget.get("litellm_last_sync_status") == "error":
                    reasons.append("last_budget_sync_failed")
                applied_state["degraded_reasons"] = reasons
                applied_state["degraded"] = bool(reasons)
                if reasons:
                    degraded_org_ids.append(applied_state["org_id"])

            maintenance_tasks_with_errors = []
            for task in output["recent_budget_maintenance_tasks"]:
                info = task.get("info") or {}
                if str(task.get("status", "")).endswith("ERROR") or (
                    isinstance(info, dict) and (info.get("error_count") or 0) > 0
                ):
                    maintenance_tasks_with_errors.append(task.get("id"))

            output["summary"] = {
                "budget_org_count": len(output["org_budget_settings"]),
                "litellm_org_limit": 200,
                "litellm_orgs_truncated": len(output["org_budget_settings"]) > 200,
                "degraded_org_count": len(degraded_org_ids),
                "degraded_org_ids": degraded_org_ids,
                "recent_maintenance_task_ids_with_errors": (
                    maintenance_tasks_with_errors
                ),
            }

            conn.close()
            print(json.dumps(output, indent=2, default=str, sort_keys=True))
        timeout: 90s
    # Non-secret config/feature snapshot from the running pod: values for flags,
    # presence-only ("set"/"empty_or_unset") for secret-backed vars (never values).
    - exec:
        name: app/openhands-config-snapshot
        collectorName: openhands-config-snapshot
        namespace: {{ .Release.Namespace }}
        selector:
          - app=openhands
        containerName: openhands
        command: ["python3", "-c"]
        args:
          - |
            import json, os
            NONSECRET = [
                "OH_APP_MODE", "OH_DEPLOYMENT_MODE", "OH_WEB_CLIENT_PROVIDERS_CONFIGURED",
                "RUNTIME", "CONVERSATION_MANAGER_CLASS", "RUN_AS_OPENHANDS", "NO_SETUP",
                "REQUIRE_PAYMENT", "ADD_DEBUGGING_ROUTES",
                "AUTOMATION_EVENT_FORWARDING_ENABLED", "AUTOMATION_SERVICE_URL",
                "ENABLE_JIRA", "ENABLE_JIRA_DC", "ENABLE_LINEAR",
                "JIRA_DC_WEBHOOKS_ENABLED", "JIRA_DC_ENABLE_OAUTH", "JIRA_DC_BASE_URL",
                "SLACK_WEBHOOKS_ENABLED", "BITBUCKET_DATA_CENTER_HOST", "GITLAB_HOST",
                "AZURE_DEVOPS_ORGANIZATION", "AZURE_DEVOPS_TENANT_ID",
                "GITHUB_APP_ID", "GITHUB_APP_SLUG",
                "SANDBOX_CLOSE_DELAY", "SANDBOX_KEEP_RUNTIME_ALIVE",
                "FILE_STORE", "SHARED_EVENT_STORAGE_PROVIDER",
                "LITE_LLM_API_URL", "LITE_LLM_TEAM_ID",
                "DB_HOST", "DB_PORT", "DB_NAME", "DB_USER", "DB_SSL_MODE",
                "REDIS_HOST", "REDIS_PORT",
                "KEYCLOAK_SERVER_URL", "KEYCLOAK_REALM_NAME", "KEYCLOAK_CLIENT_ID",
                "WEB_HOST", "AUTH_WEB_HOST", "MCP_HOST",
                "AGENT_SERVER_IMAGE_REPOSITORY", "AGENT_SERVER_IMAGE_TAG",
            ]
            SECRET_PRESENCE = [
                "BITBUCKET_DATA_CENTER_BOT_TOKEN", "BITBUCKET_DATA_CENTER_CLIENT_SECRET",
                "GITHUB_APP_PRIVATE_KEY", "GITHUB_APP_WEBHOOK_SECRET",
                "GITLAB_APP_CLIENT_SECRET", "AZURE_DEVOPS_CLIENT_SECRET", "AZURE_DEVOPS_WEBHOOK_SECRET",
                "JIRA_DC_CLIENT_SECRET", "JIRA_DC_SERVICE_ACCOUNT_PAT",
                "AUTOMATION_WEBHOOK_SECRET", "AUTOMATIONS_SERVICE_KEY",
                "LITE_LLM_API_KEY", "SANDBOX_API_KEY", "JWT_SECRET",
            ]
            config = {k: os.environ.get(k) for k in NONSECRET}
            presence = {k: ("set" if os.environ.get(k) else "empty_or_unset") for k in SECRET_PRESENCE}
            print(json.dumps({"config": config, "secret_presence": presence}, indent=2, default=str))
        timeout: 30s
    {{- if .Values.automation.enabled }}
    # Automation scheduler/dispatcher logs
    - logs:
        name: app/automation/logs
        namespace: {{ .Release.Namespace }}
        selector:
          - app=automation
        limits:
          maxAge: 336h
