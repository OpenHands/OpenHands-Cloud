{{- if and .Values.enabled (include "openhands.license.managed" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: openhands-license
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with trim (toString (.Values.license.key | default "")) }}
  license-key: {{ . | b64enc | quote }}
  {{- end }}
  {{- with trim (toString (.Values.license.offlineLicense | default "")) }}
  offline-license: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
