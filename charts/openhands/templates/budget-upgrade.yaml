{{- if and .Values.enabled .Values.budgetUpgrade.enabled }}
{{- $name := printf "%s-budget-upgrade" .Release.Name }}
{{- $image := printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) }}
{{- $native := index .Values "litellm-helm" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [patch]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [list, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  budget_upgrade.py: |
    {{- .Files.Get "files/budget_upgrade.py" | nindent 4 }}
{{- range $phase := list "pre" "post" }}
{{- if or (eq $phase "post") $.Release.IsUpgrade }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-{{ $phase }}
  labels:
    app.kubernetes.io/component: budget-upgrade
  annotations:
    helm.sh/hook: {{ if eq $phase "pre" }}pre-upgrade{{ else }}post-install,post-upgrade{{ end }}
    helm.sh/hook-weight: {{ if eq $phase "pre" }}"-10"{{ else }}"10"{{ end }}
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 360
  template:
    metadata:
      labels:
        app.kubernetes.io/component: budget-upgrade
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: script
          configMap:
            name: {{ $name }}
        {{- if $.Values.caBundle.enabled }}
        {{- include "openhands.caBundle.volume" $ | nindent 8 }}
        {{- end }}
      containers:
        - name: upgrade
          image: {{ $image | quote }}
          workingDir: /app
          command: [/bin/sh, -ec]
          args:
            - |
              {{- if eq $phase "post" }}
              python -m run_budget_preflight
              {{- end }}
              python /upgrade/budget_upgrade.py
          volumeMounts:
            - name: script
              mountPath: /upgrade
              readOnly: true
            {{- if $.Values.caBundle.enabled }}
            {{- include "openhands.caBundle.volumeMount" $ | nindent 12 }}
            {{- end }}
          env:
            {{- include "openhands.env" $ | nindent 12 }}
            {{- include "openhands.caBundle.env" $ | nindent 12 }}
            - name: UPGRADE_PHASE
              value: {{ $phase }}
            - name: BUDGET_PREFLIGHT_PHASE
              value: post
            - name: BUDGET_PREFLIGHT_MODE
              value: strict
            - name: RELEASE_NAME
              value: {{ $.Release.Name }}
            - name: ENTERPRISE_IMAGE
              value: {{ $image | quote }}
            {{- if $native.enabled }}
            - name: LITELLM_IMAGE
              value: {{ printf "%s:%s" $native.image.repository $native.image.tag | quote }}
            {{- end }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            {{- toYaml $.Values.budgetMaintenance.resources | nindent 12 }}
{{- end }}
{{- end }}
{{- end }}
