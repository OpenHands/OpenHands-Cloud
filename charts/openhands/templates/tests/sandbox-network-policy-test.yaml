{{- /*
`helm test` check for sandboxNetworkPolicy. The API server accepts a
NetworkPolicy whether or not the network plugin enforces it, so running this
pod is the only way to confirm that sandboxes are isolated. It runs in the
sandbox namespace with a runtime_id label, so the policy applies to it as it
does to a sandbox.

Blocked targets are checked by IP, after a separate DNS lookup, so a DNS
failure cannot make a blocked check pass. A connection that is refused or that
times out counts as blocked. The kubelet port is open on every node, so it
reliably shows whether the policy is enforced.

Some network plugins apply policy to a new pod a few seconds after it starts.
EKS's VPC CNI allows all traffic until then, or denies all traffic in strict
mode. The checks retry for up to a minute and report the last attempt.
*/}}
{{- $np := .Values.sandboxNetworkPolicy }}
{{- if and $np.enabled $np.test.enabled }}
{{- $ns := .Release.Namespace }}
{{- $name := printf "%s-sandbox-egress-test" (include "openhands.fullname" .) | trunc 63 | trimSuffix "-" }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ $name }}
  namespace: {{ include "openhands.sandboxNamespace" . }}
  labels:
    helm.sh/chart: {{ include "openhands.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: sandbox-egress-test
    runtime_id: {{ $name }}
  annotations:
    helm.sh/hook: test
    {{- /* Keep the pod after it finishes so `helm test --logs` and kubectl logs can read it. */}}
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: {{ $np.test.image | default .Values.keycloak.waitForDb.image | quote }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      env:
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
      command:
        - bash
        - -c
        - |
          pass() { echo "PASS: $1"; }
          fail() { echo "FAIL: $1"; failures=$((failures + 1)); }
          resolve() {
            local entry
            entry=$(timeout 10 getent hosts "$1") || return 1
            echo "${entry%% *}"
          }
          connects() { timeout 5 bash -c ">/dev/tcp/$1/$2" 2>/dev/null; }
          address() {
            if [[ $1 =~ ^[0-9.]+$ || $1 == *:* ]]; then echo "$1"; else resolve "$1"; fi
          }
          expect_blocked() {
            local addr
            if ! addr=$(address "$2"); then fail "$1: cannot resolve $2, so the check cannot run"; return; fi
            if connects "$addr" "$3"; then fail "$1 ($2:$3) is reachable"; else pass "$1 ($2:$3) is blocked"; fi
          }
          expect_allowed() {
            local addr
            if ! addr=$(address "$2"); then fail "$1: cannot resolve $2"; return; fi
            if connects "$addr" "$3"; then pass "$1 ($2:$3) is reachable"; else fail "$1 ($2:$3) is not reachable"; fi
          }

          run_checks() {
            failures=0
            if resolve kubernetes.default.svc >/dev/null; then pass "cluster DNS resolves"; else fail "cluster DNS does not resolve kubernetes.default.svc"; fi
            expect_blocked "metadata server" 169.254.169.254 80
            {{- if $np.test.checkKubelet }}
            expect_blocked "kubelet" "$HOST_IP" 10250
            {{- end }}
            {{- if .Values.postgresql.enabled }}
            expect_blocked "postgres" {{ printf "%s-postgresql.%s.svc" .Release.Name $ns }} {{ .Values.postgresql.primary.service.ports.postgresql | default 5432 }}
            {{- end }}
            {{- if .Values.enabled }}
            expect_blocked "app server" {{ printf "openhands-service.%s.svc" $ns }} 3000
            {{- end }}
            {{- if (index .Values "litellm-helm" | default dict).enabled }}
            expect_allowed "LiteLLM" {{ printf "%s-litellm.%s.svc" .Release.Name $ns }} {{ dig "service" "port" 4000 (index .Values "litellm-helm") }}
            {{- end }}
            {{- if and .Values.laminar.enabled (dig "appServer" "enabled" true .Values.laminar) }}
            expect_allowed "Laminar" {{ printf "laminar-app-server-service.%s.svc" $ns }} 8000
            {{- end }}
            [ "$failures" -eq 0 ]
          }

          deadline=$((SECONDS + 60))
          until result=$(run_checks); do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "$result"
              echo "Checks still failing after 60 seconds. Confirm that the network plugin enforces NetworkPolicy and review sandboxNetworkPolicy."
              exit 1
            fi
            sleep 5
          done
          echo "$result"
          echo "All checks passed."
{{- end }}
