{{/*
Render-time configuration guards. Emits no resources; each block fails the
render with a clear message when values are invalid or conflicting, so the
mistake is caught at install/upgrade instead of producing a broken object.

The ingress and database guards are scoped to .Values.enabled, since the env
they check is only rendered for the enterprise-server. The stale-MinIO guard is
deliberately not: the bundled store is shared with runtime-api and automation,
so it fires even in a server-less release.
*/}}
{{- if and .Values.enabled .Values.ingress.enabled (not .Values.ingress.host) -}}
{{- fail "ingress.enabled is true but ingress.host is empty. Set ingress.host to the hostname operators reach OpenHands on (e.g. app.example.com), or set ingress.enabled=false." -}}
{{- end -}}
{{- if and .Values.enabled (not .Values.postgresql.enabled) (or (not .Values.externalDatabase.host) (not .Values.externalDatabase.username)) -}}
{{- fail "postgresql.enabled is false but the external database is not configured. Set externalDatabase.host and externalDatabase.username, or set postgresql.enabled=true to use the bundled database." -}}
{{- end -}}
{{/*
Stale-MinIO guard. MinIO was removed from this chart, so a values file still
carrying a `minio:` block gets it silently ignored: the key is unknown, nothing
warns, and an install that relied on it for its bundled store ends up with no
store at all and an empty FILE_STORE. Catch that at render instead of letting it
produce a broken object path.
*/}}
{{- if and (hasKey .Values "minio") (not .Values.rustfs.enabled) -}}
{{- fail "values still set `minio`, which this chart no longer reads: the bundled MinIO was removed after its data was migrated to RustFS. That leaves this release with no bundled object store. Set rustfs.enabled=true to use the bundled store, or configure filestore for an external S3/GCS store, then delete the stale minio block." -}}
{{- end -}}
