{{- /*
Pre-upgrade Keycloak database backup. Keycloak migrates its schema one way on
first start of a newer version, so before an upgrade that changes the Keycloak
version this copies the database into a sibling database named after the schema
version it holds (e.g. bitnami_keycloak_backup_26_3_0). Rollback is then a pair
of renames instead of a restore from a dump the operator may not have taken.
Runs while the old Keycloak is still serving; pg_dump reads a consistent
snapshot. A failure fails the upgrade before any manifest is applied.
Gated on .Release.IsUpgrade like the budget preflight: `helm template` (ArgoCD)
never sets it, and a fresh install has nothing to back up.
*/ -}}
{{- if and .Values.keycloak.enabled .Values.keycloak.preUpgradeBackup.enabled .Release.IsUpgrade }}
{{- $db := .Values.keycloak.externalDatabase }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-keycloak-backup
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-backup
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.keycloak.preUpgradeBackup.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "openhands.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak-backup
    spec:
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "openhands.affinity" .) }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      volumes:
        - name: dump
          emptyDir: {}
      containers:
        - name: keycloak-backup
          image: {{ .Values.keycloak.waitForDb.image | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              trap '[ $? -eq 0 ] || echo "Keycloak backup failed, so the upgrade stopped before Keycloak changed. Fix the error above, or back up \"$DB_NAME\" yourself and upgrade with keycloak.preUpgradeBackup.enabled=false."' EXIT
              export PGPASSWORD="$DB_PASS"
              q() { psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -v ON_ERROR_STOP=1 -tAX "$@"; }

              if [ -z "$(q -d postgres -c "SELECT 1 FROM pg_database WHERE datname = '$DB_NAME'")" ]; then
                echo "Keycloak database \"$DB_NAME\" does not exist yet; nothing to back up."
                exit 0
              fi
              if [ "$(q -d "$DB_NAME" -c "SELECT to_regclass('public.migration_model') IS NOT NULL")" != t ]; then
                echo "Keycloak has not initialized \"$DB_NAME\" yet; nothing to back up."
                exit 0
              fi
              CURRENT=$(q -d "$DB_NAME" -c "SELECT version FROM migration_model ORDER BY update_time DESC LIMIT 1")
              if [ "$CURRENT" = "$TARGET_VERSION" ]; then
                echo "Keycloak schema is already at $TARGET_VERSION; no migration, no backup needed."
                exit 0
              fi

              BACKUP="${DB_NAME}_backup_$(printf '%s' "$CURRENT" | tr -c 'A-Za-z0-9' '_')"
              if [ -n "$(q -d postgres -c "SELECT 1 FROM pg_database WHERE datname = '$BACKUP'")" ]; then
                echo "Backup database \"$BACKUP\" already exists; keeping it."
                exit 0
              fi

              echo "Keycloak schema $CURRENT will migrate to $TARGET_VERSION; copying \"$DB_NAME\" to \"$BACKUP\"..."
              pg_dump -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Fc -f /dump/keycloak.dump
              q -d postgres -c "CREATE DATABASE \"$BACKUP\""
              if ! pg_restore -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$BACKUP" --no-owner --exit-on-error /dump/keycloak.dump; then
                q -d postgres -c "DROP DATABASE \"$BACKUP\""
                exit 1
              fi
              rm -f /dump/keycloak.dump
              echo "Backed up \"$DB_NAME\" (schema $CURRENT) to \"$BACKUP\"."
          volumeMounts:
            - name: dump
              mountPath: /dump
          env:
            - name: DB_HOST
              value: {{ $db.host | quote }}
            - name: DB_PORT
              value: {{ $db.port | default 5432 | quote }}
            - name: DB_NAME
              value: {{ $db.database | quote }}
            - name: PGSSLMODE
              value: {{ $db.sslMode | default "prefer" | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $db.existingSecret }}
                  key: {{ $db.existingSecretUserKey }}
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ $db.existingSecret }}
                  key: {{ $db.existingSecretPasswordKey }}
            - name: TARGET_VERSION
              value: {{ include "openhands.keycloakVersion" . | quote }}
          resources:
            {{- toYaml .Values.keycloak.preUpgradeBackup.resources | nindent 12 }}
{{- end }}
