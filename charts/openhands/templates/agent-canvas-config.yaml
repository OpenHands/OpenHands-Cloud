{{- $agentCanvas := index .Values "agent-canvas" -}}
{{- if $agentCanvas.enabled }}
{{- $host := include "openhands.appHost" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-canvas-config
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
data:
  AGENT_CANVAS_LOCK_TO_CLOUD: {{ if $host }}{{ printf "%s://%s" (ternary "https" "http" .Values.tls.enabled) $host | quote }}{{ else }}""{{ end }}
{{- end }}
