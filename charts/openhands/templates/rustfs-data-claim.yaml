{{- if .Values.rustfs.enabled }}
{{/*
RustFS's data claim. On installs that migrated from MinIO the claim already exists
— a prior migrate release's pre-upgrade hook created it with the managed-by label
below — and Helm adopts it here; on a fresh install Helm creates it. resource-policy
keep makes it outlive `helm uninstall` so neither path takes the conversation data
with it.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.rustfs.mode.standalone.existingClaim.dataClaim }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- /* Carries app.kubernetes.io/managed-by, without which Helm would error on
           the claim a prior migrate release's hook created instead of adopting it. */}}
    {{- include "openhands.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.rustfs.storageclass.name }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.rustfs.storageclass.dataStorageSize }}
{{- end }}
