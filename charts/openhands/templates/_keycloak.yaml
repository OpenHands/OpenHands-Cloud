{{/*
Whether the Keycloak realm-config resources (the keycloak-config init container
and its keycloak-config-script / keycloak-realm-template ConfigMaps) should
render.

True when this chart deploys the bundled Keycloak subchart
(`.Values.keycloak.enabled`), OR when `.Values.keycloak.provisionRealm` is set
to provision the realm against an external Keycloak (`.Values.keycloak.url`)
that this chart does not deploy. This decouples realm provisioning from the
bundled subchart so split deployments (Keycloak as a separate release) can still
create and update the realm without standing up a second Keycloak.

Emits "true" when enabled and an empty string otherwise, so it can be used
directly in `if` / `and` expressions.
*/}}
{{- define "openhands.keycloakProvisionRealm" -}}
{{- if or .Values.keycloak.enabled .Values.keycloak.provisionRealm -}}
true
{{- end -}}
{{- end -}}

{{/*
Keycloak version the configured image runs, as Keycloak records it in
migration_model (e.g. "26.8.0" from tag "26.8.0-debian-12-oh1").
*/}}
{{- define "openhands.keycloakVersion" -}}
{{- $version := regexFind "^[0-9]+\\.[0-9]+\\.[0-9]+" (toString .Values.keycloak.image.tag) -}}
{{- if not $version -}}
{{- fail (printf "keycloak.image.tag %q does not start with a Keycloak version (e.g. 26.8.0-...), which keycloak.preUpgradeBackup needs to tell whether the upgrade migrates the database. Use a versioned tag, or set keycloak.preUpgradeBackup.enabled=false after backing up the Keycloak database yourself." (toString .Values.keycloak.image.tag)) -}}
{{- end -}}
{{- $version -}}
{{- end -}}

{{/*
Keycloak version in keycloak.image.tag, or "" for an unversioned tag. Unlike
openhands.keycloakVersion, it does not fail the render.
*/}}
{{- define "openhands.keycloakTargetVersion" -}}
{{- regexFind "^[0-9]+\\.[0-9]+\\.[0-9]+" (toString .Values.keycloak.image.tag) -}}
{{- end -}}

{{/*
"true" when the bundled Keycloak is 26.8.2 or later, which rejects Admin REST API tokens without
the kc-admin-api scope. An unversioned tag counts as not needing it.
*/}}
{{- define "openhands.keycloakNeedsAdminApiScope" -}}
{{- $version := include "openhands.keycloakTargetVersion" . -}}
{{- if and .Values.keycloak.enabled $version (semverCompare ">=26.8.2" $version) -}}
true
{{- else -}}
false
{{- end -}}
{{- end -}}

{{/*
Adds the kc-admin-api client scope to the app's Keycloak admin client. Run by keycloak-config.
*/}}
{{- define "openhands.keycloakAdminApiScopeScript" -}}
set -eu
# Same default as keycloak-config, which also creates this client when only a console password is set.
CLIENT_ID=$(printf '%s' "${KEYCLOAK_ADMIN_CLIENT_ID:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
CLIENT_ID=${CLIENT_ID:-openhands-provisioner}
SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET:-$KEYCLOAK_ADMIN_PASSWORD}
KC=$KEYCLOAK_SERVER_URL
# Bounded, so a Keycloak that accepts a connection but never answers cannot stall the hook.
CURL="curl --connect-timeout 5 --max-time 20"

no_admin() {
  if [ -n "${KEYCLOAK_ADMIN_UI_PASSWORD:-}" ]; then TRIED="the bootstrap admin password and the console password"; else TRIED="the bootstrap admin password (no console password is set)"; fi
  echo "ERROR: the \"$CLIENT_ID\" client needs the kc-admin-api scope for Keycloak $TARGET_VERSION. Adding it needs a login as the Keycloak admin user, and Keycloak rejects $TRIED." >&2
  echo "Set the Keycloak Admin Password (keycloak-admin secret, key admin-ui-password) to the current password of the Keycloak admin user, then deploy again." >&2
  exit 1
}

# Sets STATUS: works, old (Keycloak before 26.8.2), rejected (needs the scope), no-client,
# bad-client (wrong secret or disabled service account), forbidden, or down.
provisioner_status() {
  CODE=""
  if ! R=$($CURL -sS "$KC/realms/master/protocol/openid-connect/token" \
    --data-urlencode "client_id=$CLIENT_ID" --data-urlencode grant_type=client_credentials \
    --data-urlencode "client_secret=$SECRET"); then STATUS=down; return; fi
  PT=$(printf '%s' "$R" | jq -r '.access_token // empty' 2>/dev/null) || PT=""
  if [ -z "$PT" ]; then
    case $(printf '%s' "$R" | jq -r '.error // empty' 2>/dev/null) in
      invalid_client) STATUS=no-client ;;
      unauthorized_client) STATUS=bad-client ;;
      *) STATUS=down ;;
    esac
    return
  fi
  if ! CODE=$($CURL -sS -o /tmp/scopes.json -w '%{http_code}' "$KC/admin/realms/master/client-scopes" \
    -H "Authorization: Bearer $PT"); then STATUS=down; return; fi
  case $CODE in
    200) if jq -e 'any(.[]; .name == "kc-admin-api")' /tmp/scopes.json >/dev/null; then STATUS=works; else STATUS=old; fi ;;
    401) STATUS=rejected ;;
    403) STATUS=forbidden ;;
    *) STATUS=down ;;
  esac
}

# keycloak-config may have moved the admin login to the console password. Returns 1 when Keycloak
# rejects both passwords, and 2 when it did not answer, so callers retry instead of blaming a password.
admin_token() {
  TOKEN_RC=1
  for PW in "${KEYCLOAK_ADMIN_UI_PASSWORD:-}" "$KEYCLOAK_ADMIN_PASSWORD"; do
    [ -n "$PW" ] || continue
    if ! R=$($CURL -sS "$KC/realms/master/protocol/openid-connect/token" \
      --data-urlencode client_id=admin-cli --data-urlencode grant_type=password \
      --data-urlencode username=admin --data-urlencode "password=$PW"); then TOKEN_RC=2; continue; fi
    T=$(printf '%s' "$R" | jq -r '.access_token // empty' 2>/dev/null) || { TOKEN_RC=2; continue; }
    if [ -n "$T" ]; then echo "$T"; return 0; fi
    [ "$(printf '%s' "$R" | jq -r '.error // empty' 2>/dev/null)" = invalid_grant ] || TOKEN_RC=2
  done
  return $TOKEN_RC
}

if [ "$NEEDS_ADMIN_API_SCOPE" != true ]; then
  echo "Keycloak $TARGET_VERSION does not need the kc-admin-api scope; nothing to do."
  exit 0
fi

FIX_WAIT_SECONDS=${FIX_WAIT_SECONDS:-540}
START=$(date +%s)
# $1 is old (Keycloak answers but is older than the target) or down.
wait_or_give_up() {
  [ $(($(date +%s) - START)) -ge "$FIX_WAIT_SECONDS" ] || { echo "$2"; sleep 5; return; }
  if [ "$1" = old ]; then
    echo "ERROR: Keycloak is still older than $TARGET_VERSION after $FIX_WAIT_SECONDS seconds: it has no kc-admin-api scope, but keycloak.image.tag says $TARGET_VERSION. If keycloak.image.digest is set, it may pin an older image; point it at the $TARGET_VERSION image or remove it. Otherwise check why the keycloak StatefulSet has not rolled out $TARGET_VERSION." >&2
  else
    echo "ERROR: Keycloak did not answer for $FIX_WAIT_SECONDS seconds (HTTP ${CODE:-none}), so the \"$CLIENT_ID\" client cannot get the kc-admin-api scope. Check the keycloak pod log." >&2
  fi
  exit 1
}

# This can run before the new Keycloak starts, so wait until it rejects the provisioner.
while :; do
  provisioner_status
  case $STATUS in
    works) echo "Client \"$CLIENT_ID\" has Admin REST API access; nothing to do."; exit 0 ;;
    no-client) echo "Client \"$CLIENT_ID\" does not exist; nothing to do."; exit 0 ;;
    bad-client) echo "WARNING: Keycloak rejects the \"$CLIENT_ID\" client secret; not changing its scopes." >&2; exit 0 ;;
    rejected|forbidden) break ;;
  esac
  wait_or_give_up "$STATUS" "Waiting for Keycloak $TARGET_VERSION to serve the admin API (provisioner: $STATUS, HTTP ${CODE:-none})..."
done
# A forbidden provisioner can come from the old Keycloak too, so wait for the new one to create the scope.
while :; do
  RC=0; TOKEN=$(admin_token) || RC=$?
  [ "$RC" -ne 1 ] || no_admin
  KC_STATE=down
  if [ "$RC" -eq 0 ] && SCOPES=$($CURL -fsS "$KC/admin/realms/master/client-scopes" -H "Authorization: Bearer $TOKEN"); then
    SCOPE_ID=$(printf '%s' "$SCOPES" | jq -r '.[] | select(.name == "kc-admin-api") | .id')
    [ -z "$SCOPE_ID" ] || break
    KC_STATE=old
  fi
  CODE=""
  wait_or_give_up "$KC_STATE" "Waiting for Keycloak $TARGET_VERSION to create the kc-admin-api scope..."
done
QUERY=$(printf '%s' "$CLIENT_ID" | jq -sRr @uri)
CLIENTS=$($CURL -fsS "$KC/admin/realms/master/clients?clientId=$QUERY" -H "Authorization: Bearer $TOKEN")
CLIENT=$(printf '%s' "$CLIENTS" | jq -r '.[0].id')
$CURL -fsS -X PUT "$KC/admin/realms/master/clients/$CLIENT/default-client-scopes/$SCOPE_ID" -H "Authorization: Bearer $TOKEN"
provisioner_status
[ "$STATUS" = works ] || { echo "ERROR: client \"$CLIENT_ID\" still has no Admin REST API access (provisioner: $STATUS, HTTP ${CODE:-none})." >&2; exit 1; }
echo "Client \"$CLIENT_ID\" has the kc-admin-api scope."
{{- end }}
