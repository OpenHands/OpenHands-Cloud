suite: openhands render-time validation guards
templates:
  - validations.yaml
tests:
  - it: fails when ingress is enabled without a host
    set:
      ingress.enabled: true
      ingress.host: ""
    asserts:
      - failedTemplate:
          errorMessage: "ingress.enabled is true but ingress.host is empty. Set ingress.host to the hostname operators reach OpenHands on (e.g. app.example.com), or set ingress.enabled=false."
  - it: fails when postgresql is disabled without an external database
    set:
      postgresql.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.enabled is false but the external database is not configured. Set externalDatabase.host and externalDatabase.username, or set postgresql.enabled=true to use the bundled database."
  - it: renders no resources when ingress has a host
    set:
      ingress.enabled: true
      ingress.host: app.example.com
    asserts:
      - hasDocuments:
          count: 0
  - it: renders no resources when postgresql is disabled with an external database
    set:
      postgresql.enabled: false
      externalDatabase.host: db.example.com
      externalDatabase.username: openhands
    asserts:
      - hasDocuments:
          count: 0
  - it: skips the ingress guard when the release is disabled
    set:
      enabled: false
      ingress.enabled: true
      ingress.host: ""
    asserts:
      - hasDocuments:
          count: 0
  - it: skips the postgres guard when the release is disabled
    set:
      enabled: false
      postgresql.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  # MinIO is gone from the chart, so a values file still carrying a `minio:`
  # block has it silently ignored. These cases pin the guard that catches an
  # install left with no bundled store at all.
  - it: fails when stale minio values are the only bundled store configured
    set:
      rustfs.enabled: false
      minio.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "values still set `minio`, which this chart no longer reads: the bundled MinIO was removed after its data was migrated to RustFS. That leaves this release with no bundled object store. Set rustfs.enabled=true to use the bundled store, or configure filestore for an external S3/GCS store, then delete the stale minio block."
  - it: fires even when the enterprise-server is disabled
    # runtime-api and automation share the bundled store, so a release with no
    # store is broken regardless of whether it runs the server.
    set:
      enabled: false
      rustfs.enabled: false
      minio.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "values still set `minio`, which this chart no longer reads: the bundled MinIO was removed after its data was migrated to RustFS. That leaves this release with no bundled object store. Set rustfs.enabled=true to use the bundled store, or configure filestore for an external S3/GCS store, then delete the stale minio block."
  - it: tolerates stale minio values once RustFS is deployed
    set:
      rustfs.enabled: true
      minio.enabled: true
    asserts:
      - hasDocuments:
          count: 0
  - it: leaves an external-store release alone when no minio block is set
    set:
      rustfs.enabled: false
    asserts:
      - hasDocuments:
          count: 0
