suite: openhands render-time validation guards
templates:
  - validations.yaml
tests:
  - it: fails when ingress is enabled without a host
    set:
      ingress.enabled: true
      ingress.host: ""
    asserts:
      - failedTemplate:
          errorMessage: "ingress.enabled is true but ingress.host is empty. Set ingress.host to the hostname operators reach OpenHands on (e.g. app.example.com), or set ingress.enabled=false."
  - it: fails when postgresql is disabled without an external database
    set:
      postgresql.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.enabled is false but the external database is not configured. Set externalDatabase.host and externalDatabase.username, or set postgresql.enabled=true to use the bundled database."
  - it: renders no resources when ingress has a host
    set:
      ingress.enabled: true
      ingress.host: app.example.com
    asserts:
      - hasDocuments:
          count: 0
  - it: renders no resources when postgresql is disabled with an external database
    set:
      postgresql.enabled: false
      externalDatabase.host: db.example.com
      externalDatabase.username: openhands
    asserts:
      - hasDocuments:
          count: 0
  - it: skips the ingress guard when the release is disabled
    set:
      enabled: false
      ingress.enabled: true
      ingress.host: ""
    asserts:
      - hasDocuments:
          count: 0
  - it: skips the postgres guard when the release is disabled
    set:
      enabled: false
      postgresql.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: fails when values still set the removed redis key
    set:
      redis.master.resources.requests.cpu: 500m
    asserts:
      - failedTemplate:
          errorMessage: "values set `redis:`, which this chart no longer reads. The cache is the valkey subchart, configured under `valkey:`, and an unused `redis:` block is silently ignored, so any sizing set under it is NOT applied. Translate the keys you set, then delete the `redis:` block: redis.enabled -> valkey.enabled; redis.master.resources -> valkey.resources; redis.master.persistence.enabled -> valkey.dataStorage.enabled; redis.replica.replicaCount: 0 -> valkey.replica.enabled: false; redis.auth.existingSecret -> valkey.auth.usersExistingSecret. The `redis` Secret itself is unchanged; keep it as it is."
  - it: fails on a stale redis block even when the server is not deployed
    set:
      enabled: false
      redis.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "values set `redis:`, which this chart no longer reads. The cache is the valkey subchart, configured under `valkey:`, and an unused `redis:` block is silently ignored, so any sizing set under it is NOT applied. Translate the keys you set, then delete the `redis:` block: redis.enabled -> valkey.enabled; redis.master.resources -> valkey.resources; redis.master.persistence.enabled -> valkey.dataStorage.enabled; redis.replica.replicaCount: 0 -> valkey.replica.enabled: false; redis.auth.existingSecret -> valkey.auth.usersExistingSecret. The `redis` Secret itself is unchanged; keep it as it is."
  - it: renders when values use the valkey key instead
    set:
      valkey.enabled: true
      valkey.resources.requests.cpu: 500m
    asserts:
      - hasDocuments:
          count: 0

