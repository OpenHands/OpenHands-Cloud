suite: github repository search scope env wiring
templates:
  - deployment.yaml
  # deployment.yaml unconditionally checksums this ConfigMap into its pod
  # annotations, so it must be compiled alongside it for the render to succeed.
  - litellm-config-script.yaml
tests:
  - it: does not set the flag by default
    set:
      enabled: true
      github.enabled: true
    asserts:
      - template: deployment.yaml
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITHUB_SCOPE_REPO_SEARCH_TO_INSTALLATIONS
          any: true

  - it: sets the flag when scoping is enabled
    set:
      enabled: true
      github.enabled: true
      github.scopeRepoSearchToInstallations: true
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITHUB_SCOPE_REPO_SEARCH_TO_INSTALLATIONS
            value: "true"

  - it: does not set the flag when GitHub is disabled
    set:
      enabled: true
      github.enabled: false
      github.scopeRepoSearchToInstallations: true
    asserts:
      - template: deployment.yaml
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITHUB_SCOPE_REPO_SEARCH_TO_INSTALLATIONS
          any: true
