suite: Keycloak kc-admin-api scope hooks
templates:
  - templates/keycloak-admin-api-scope-job.yaml
set:
  automation.enabled: false
tests:
  - it: checks the admin login before the backup and adds the scope after the upgrade
    release:
      upgrade: true
    set:
      keycloak.enabled: true
      keycloak.image.tag: 26.8.2-debian-12-oh1
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-upgrade
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "9"
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MODE
            value: check
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-upgrade
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "0"
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MODE
            value: fix
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TARGET_VERSION
            value: 26.8.2
        documentIndex: 1
  - it: needs the kc-admin-api scope from Keycloak 26.8.2 on
    release:
      upgrade: true
    set:
      keycloak.enabled: true
      keycloak.image.tag: 26.8.2-debian-12-oh1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEEDS_ADMIN_API_SCOPE
            value: "true"
        documentIndex: 1
  - it: does not need the scope before Keycloak 26.8.2
    release:
      upgrade: true
    set:
      keycloak.enabled: true
      keycloak.image.tag: 26.8.1-debian-12-r0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEEDS_ADMIN_API_SCOPE
            value: "false"
        documentIndex: 1
  - it: is not rendered on a fresh install
    set:
      keycloak.enabled: true
    asserts:
      - hasDocuments:
          count: 0
  - it: is not rendered without the bundled Keycloak
    release:
      upgrade: true
    set:
      keycloak.enabled: false
      keycloak.provisionRealm: true
    asserts:
      - hasDocuments:
          count: 0
