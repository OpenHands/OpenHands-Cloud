suite: org defaults condenser env wiring
templates:
  - deployment.yaml
  - litellm-config-script.yaml
tests:
  - it: leaves token threshold unset by default
    set:
      enabled: true
    asserts:
      - template: deployment.yaml
        notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="OPENHANDS_ORG_DEFAULTS_CONDENSER_MAX_TOKENS")]
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENHANDS_ORG_DEFAULTS_CONDENSER_APPLY_TO_EXISTING
            value: "false"
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENHANDS_ORG_DEFAULTS_CONDENSER_OVERWRITE_EXISTING
            value: "false"

  - it: wires configured org condenser rollout settings
    set:
      enabled: true
      orgDefaults.condenser.maxTokens: 200000
      orgDefaults.condenser.applyToExisting: true
      orgDefaults.condenser.overwriteExisting: true
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENHANDS_ORG_DEFAULTS_CONDENSER_MAX_TOKENS
            value: "200000"
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENHANDS_ORG_DEFAULTS_CONDENSER_APPLY_TO_EXISTING
            value: "true"
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENHANDS_ORG_DEFAULTS_CONDENSER_OVERWRITE_EXISTING
            value: "true"
