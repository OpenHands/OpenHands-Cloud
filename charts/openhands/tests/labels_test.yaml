suite: recommended labels
# Some templates pull in others via a cross-template include, so those have to be
# listed here to make the include resolvable: deployment.yaml checksums
# litellm-config-script.yaml into a pod annotation, and troubleshoot/secrets.yaml
# embeds the preflight and support-bundle specs. Each test sets `template:` to
# scope its assertions to one template.
templates:
  - budget-maintenance-cronjob.yaml
  - deployment.yaml
  - litellm-config-script.yaml
  - service.yaml
  - postgres-cnpg.yaml
  - postgres-cnpg-migration.yaml
  - troubleshoot/preflights.yaml
  - troubleshoot/secrets.yaml
  - troubleshoot/support-bundle.yaml
tests:
  - it: the openhands Deployment carries the recommended labels and keeps its app selector
    template: deployment.yaml
    set:
      enabled: true
      keycloak.enabled: false
      keycloak.provisionRealm: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: openhands
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: openhands
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: server
      - matchRegex:
          path: metadata.labels["helm.sh/chart"]
          pattern: ^openhands-
      - isNotEmpty:
          path: metadata.labels["app.kubernetes.io/version"]
      # Pod template carries the recommended labels alongside the retained app label.
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: openhands
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: server
      - equal:
          path: spec.template.metadata.labels.app
          value: openhands
      # The selector is intentionally left on the legacy app label: spec.selector is
      # immutable, so changing it would break in-place upgrades.
      - equal:
          path: spec.selector.matchLabels.app
          value: openhands
      - notExists:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]

  - it: the openhands Service carries the recommended labels and keeps its app selector
    template: service.yaml
    set:
      enabled: true
      postgresql.enabled: false
      runtime-api.enabled: false
      litellm-helm.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: openhands
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: server
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: openhands
      - equal:
          path: metadata.labels.app
          value: openhands
      - equal:
          path: spec.selector.app
          value: openhands
      - notExists:
          path: spec.selector["app.kubernetes.io/name"]

  - it: the budget maintenance CronJob carries the recommended labels and keeps its app label
    template: budget-maintenance-cronjob.yaml
    set:
      enabled: true
      budgetMaintenance.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: openhands
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: openhands
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: budget-maintenance
      - matchRegex:
          path: metadata.labels["helm.sh/chart"]
          pattern: ^openhands-
      - isNotEmpty:
          path: metadata.labels["app.kubernetes.io/version"]
      - equal:
          path: metadata.labels.app
          value: RELEASE-NAME-budget-maintenance
      - equal:
          path: spec.jobTemplate.spec.template.metadata.labels["app.kubernetes.io/name"]
          value: openhands
      - equal:
          path: spec.jobTemplate.spec.template.metadata.labels["app.kubernetes.io/component"]
          value: budget-maintenance
      - equal:
          path: spec.jobTemplate.spec.template.metadata.labels.app
          value: RELEASE-NAME-budget-maintenance

  - it: the troubleshoot Secrets carry the recommended labels and keep their troubleshoot.sh/kind
    template: troubleshoot/secrets.yaml
    set:
      enabled: true
      replicated.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: openhands
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: openhands
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: troubleshoot
      - matchRegex:
          path: metadata.labels["helm.sh/chart"]
          pattern: ^openhands-
      # KOTS discovers these specs by troubleshoot.sh/kind, so that label is load-bearing.
      - matchRegex:
          path: metadata.labels["troubleshoot.sh/kind"]
          pattern: ^(preflight|support-bundle)$

  - it: the CloudNativePG Cluster carries the recommended labels and stays adoptable
    template: postgres-cnpg.yaml
    set:
      cnpg.enabled: true
      postgresql.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: openhands
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: openhands
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: database
      - matchRegex:
          path: metadata.labels["helm.sh/chart"]
          pattern: ^openhands-
      # Helm adopts the object the migration hook creates only when all three of
      # these are on it, so the shared labels must keep supplying managed-by.
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: metadata.annotations["meta.helm.sh/release-name"]
          value: RELEASE-NAME
      - equal:
          path: metadata.annotations["meta.helm.sh/release-namespace"]
          value: NAMESPACE

  - it: the postgres alias Service carries the recommended labels
    template: service.yaml
    set:
      cnpg.enabled: true
      postgresql.enabled: false
    documentSelector:
      path: metadata.name
      value: oh-main-postgresql
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: database
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - matchRegex:
          path: metadata.labels["helm.sh/chart"]
          pattern: ^openhands-

  - it: the migration hook resources carry the recommended labels
    template: postgres-cnpg-migration.yaml
    set:
      cnpg.enabled: true
      cnpg.migration.enabled: true
      postgresql.enabled: false
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: postgres-migration
          documentIndex: 0
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: openhands
          documentIndex: 0
      - matchRegex:
          path: metadata.labels["helm.sh/chart"]
          pattern: ^openhands-
          documentIndex: 0

  - it: both migration Jobs and their pod templates carry the recommended labels
    template: postgres-cnpg-migration.yaml
    set:
      cnpg.enabled: true
      cnpg.migration.enabled: true
      postgresql.enabled: false
    documentSelector:
      path: kind
      value: Job
      matchMany: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: postgres-migration
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: postgres-migration
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
