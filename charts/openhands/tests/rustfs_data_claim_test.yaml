suite: rustfs pre-created data claim
templates:
  - templates/rustfs-data-claim.yaml
tests:
  - it: renders nothing when RustFS is off
    set:
      rustfs.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the claim on a fresh install
    set:
      rustfs.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: PersistentVolumeClaim

  # On installs that migrated from MinIO the claim already exists — a prior migrate
  # release's pre-upgrade hook created it with the managed-by label — so rendering
  # it on the upgrade is what lets Helm adopt it instead of erroring.
  - it: renders the claim on an upgrade, for Helm to adopt
    release:
      upgrade: true
    set:
      rustfs.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: PersistentVolumeClaim

  # An ordinary resource, not a hook, so Helm manages it across upgrades and the
  # resource-policy below is what protects the data.
  - it: is not a hook
    set:
      rustfs.enabled: true
    asserts:
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
      - notExists:
          path: metadata.annotations["helm.sh/hook-delete-policy"]

  # Guards the conversation data against helm uninstall.
  - it: survives uninstall
    set:
      rustfs.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  # A prior migrate release's hook may have created this object; Helm refuses to
  # adopt one that lacks this label.
  - it: carries the managed-by label the apply needs to adopt it
    set:
      rustfs.enabled: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  # One source of truth: the subchart mounts this same value by name, so a claim
  # rendered under a different name would leave RustFS on an empty volume.
  - it: takes its name from the value the subchart mounts
    set:
      rustfs.enabled: true
      rustfs.mode.standalone.existingClaim.dataClaim: renamed-claim
    asserts:
      - equal:
          path: metadata.name
          value: renamed-claim

  - it: sizes and classes the claim from the same values the subchart would have used
    set:
      rustfs.enabled: true
      rustfs.storageclass.name: fast-disks
      rustfs.storageclass.dataStorageSize: 250Gi
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 250Gi
      - equal:
          path: spec.storageClassName
          value: fast-disks

  # An empty class means "use the cluster default", which must render as an absent
  # field rather than storageClassName: "" — the latter means "no class at all"
  # and leaves the claim unbound forever.
  - it: omits the storage class when none is set
    set:
      rustfs.enabled: true
      rustfs.storageclass.name: ""
    asserts:
      - notExists:
          path: spec.storageClassName
