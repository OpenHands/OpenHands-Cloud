suite: bundled object-store backend selection
templates:
  - templates/deployment.yaml
  - templates/rustfs-bucket.yaml
  - templates/validations.yaml
  - templates/_objectstore.tpl
  - templates/_env.yaml
  - templates/_helpers.tpl
  # deployment.yaml includes this by path; helm-unittest only resolves templates
  # the suite lists.
  - templates/litellm-config-script.yaml
tests:
  # --- endpoint selection -------------------------------------------------
  - it: points the app at RustFS, the only bundled store
    template: templates/deployment.yaml
    set:
      enabled: true
      filestore.type: s3
      rustfs.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_S3_ENDPOINT
            value: http://RELEASE-NAME-rustfs-svc:9000

  - it: leaves the endpoint unset for an external S3/GCS install
    template: templates/deployment.yaml
    set:
      enabled: true
      filestore.type: s3
      rustfs.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_S3_ENDPOINT
            value: http://RELEASE-NAME-rustfs-svc:9000

  - it: sources the app's credentials from the RustFS pair
    template: templates/deployment.yaml
    set:
      enabled: true
      filestore.type: s3
      rustfs.enabled: true
      rustfs.secret.rustfs.access_key: someaccesskey
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            value: someaccesskey

  # --- bucket provisioning ------------------------------------------------
  - it: provisions the RustFS bucket, since the upstream chart does not
    template: templates/rustfs-bucket.yaml
    set:
      rustfs.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade

  - it: never gives the bucket job a delete path
    template: templates/rustfs-bucket.yaml
    set:
      rustfs.enabled: true
    asserts:
      - notMatchRegexRaw:
          pattern: (DELETE|rm -r|--force)

  - it: renders no bucket job when RustFS is off
    template: templates/rustfs-bucket.yaml
    set:
      rustfs.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # --- guards -------------------------------------------------------------
  # MinIO is gone from the chart, so a values file still carrying a `minio:`
  # block would have it silently ignored and end up with no bundled store.
  - it: fails when stale minio values are the only bundled store configured
    template: templates/validations.yaml
    set:
      enabled: true
      rustfs.enabled: false
      minio.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "values still set `minio`, which this chart no longer reads: the bundled MinIO was removed after its data was migrated to RustFS. That leaves this release with no bundled object store. Set rustfs.enabled=true to use the bundled store, or configure filestore for an external S3/GCS store, then delete the stale minio block."

  - it: tolerates stale minio values once RustFS is deployed
    template: templates/validations.yaml
    set:
      enabled: true
      rustfs.enabled: true
      minio.enabled: true
    asserts:
      - notFailedTemplate: {}

  - it: does not fire for an external store with no stale minio block
    template: templates/validations.yaml
    set:
      enabled: true
      rustfs.enabled: false
    asserts:
      - notFailedTemplate: {}
