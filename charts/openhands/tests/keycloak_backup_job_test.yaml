suite: keycloak pre-upgrade backup hook job
templates:
  - keycloak-backup-job.yaml
tests:
  - it: renders nothing on install
    set:
      keycloak.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when Keycloak is disabled
    release:
      upgrade: true
    set:
      keycloak.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when the backup is disabled
    release:
      upgrade: true
    set:
      keycloak.enabled: true
      keycloak.preUpgradeBackup.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a pre-upgrade hook Job on upgrade
    release:
      upgrade: true
    set:
      keycloak.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: RELEASE-NAME-keycloak-backup
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "10"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation
      - equal:
          path: spec.backoffLimit
          value: 0
      - equal:
          path: spec.activeDeadlineSeconds
          value: 300
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/cloudnative-pg/postgresql:17.11-202610050823-minimal-trixie
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: pg_dump
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_NAME
            value: bitnami_keycloak
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TARGET_VERSION
            value: 26.8.0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: postgres-password
                key: password

  - it: derives the target version from the image tag
    release:
      upgrade: true
    set:
      keycloak.enabled: true
      keycloak.image.tag: 26.9.1-debian-12-r3
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TARGET_VERSION
            value: 26.9.1

  - it: fails on an image tag without a Keycloak version
    release:
      upgrade: true
    set:
      keycloak.enabled: true
      keycloak.image.tag: latest
    asserts:
      - failedTemplate:
          errorPattern: does not start with a Keycloak version
