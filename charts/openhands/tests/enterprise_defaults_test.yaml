suite: Enterprise product defaults
templates:
  - deployment.yaml
  - litellm-config-script.yaml
tests:
  - it: hides personal key editing and billing and disables email changes
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: OH_ALLOW_USER_LLM_CONFIGURATION, value: "false"}
          count: 1
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: HIDE_BILLING_PAGE, value: "true"}
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: EMAIL_CHANGE_ENABLED, value: "false"}
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: OH_WEB_CLIENT_EMAIL_CHANGE_ENABLED, value: "false"}
  - it: enables the Super Admin dashboard
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: ENABLE_SUPER_ADMIN, value: "true"}
          count: 1
  - it: turns the Super Admin dashboard off with an explicit value
    set:
      env.ENABLE_SUPER_ADMIN: "false"
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: ENABLE_SUPER_ADMIN, value: "false"}
          count: 1
  - it: leaves the structured web client flags unset by default
    asserts:
      - template: deployment.yaml
        notContains:
          path: spec.template.spec.containers[0].env
          content: {name: OH_WEB_CLIENT_FEATURE_FLAGS_ENABLE_SUPER_ADMIN}
          any: true
  - it: shows automation UI with the local service fallback URL
    set:
      automation.enabled: true
      postgresql.primary.persistence.enabled: true
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: ENABLE_AUTOMATIONS, value: "true"}
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: AUTOMATION_SERVICE_URL, value: "http://automation/api/automation"}
  - it: shows automation UI when the local service is enabled with its service URL
    set:
      automation.enabled: true
      automationService.url: http://automation/api/automation
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: ENABLE_AUTOMATIONS, value: "true"}
  - it: hides automation UI when the service URL is only whitespace
    set:
      env.AUTOMATION_SERVICE_URL: " "
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: ENABLE_AUTOMATIONS, value: "false"}
  - it: disables automation UI and wiring together when the dependency is disabled
    set:
      automation.enabled: false
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: ENABLE_AUTOMATIONS, value: "false"}
      - template: deployment.yaml
        notContains:
          path: spec.template.spec.containers[0].env
          content: {name: AUTOMATION_SERVICE_URL}
          any: true
      - template: deployment.yaml
        notContains:
          path: spec.template.spec.containers[0].env
          content: {name: AUTOMATIONS_SERVICE_KEY}
          any: true
      - template: deployment.yaml
        notContains:
          path: spec.template.spec.containers[0].env
          content: {name: AUTOMATION_EVENT_FORWARDING_ENABLED}
          any: true
  - it: preserves explicit Cloud policy overrides without duplicate env names
    set:
      env.OH_ALLOW_USER_LLM_CONFIGURATION: "true"
      env.HIDE_BILLING_PAGE: "false"
      env.EMAIL_CHANGE_ENABLED: "true"
      env.OH_WEB_CLIENT_EMAIL_CHANGE_ENABLED: "true"
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: OH_ALLOW_USER_LLM_CONFIGURATION, value: "true"}
          count: 1
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: HIDE_BILLING_PAGE, value: "false"}
          count: 1
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: EMAIL_CHANGE_ENABLED, value: "true"}
          count: 1
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: OH_WEB_CLIENT_EMAIL_CHANGE_ENABLED, value: "true"}
          count: 1
  - it: permits a separately managed automation service
    set:
      automation.enabled: false
      automationServiceKey.enabled: true
      automationWebhookSecret.enabled: true
      automationService.url: https://automation.example.invalid/api/automation
      automationService.eventForwardingEnabled: true
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: ENABLE_AUTOMATIONS, value: "true"}
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: AUTOMATION_SERVICE_URL, value: "https://automation.example.invalid/api/automation"}
  - it: honors an explicit UI override even without a service configured
    set:
      env.ENABLE_AUTOMATIONS: "true"
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: ENABLE_AUTOMATIONS, value: "true"}
          count: 1
  - it: preserves a legacy external service configured through env
    set:
      env.AUTOMATION_SERVICE_URL: https://automation.example.invalid/api/automation
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: ENABLE_AUTOMATIONS, value: "true"}
  - it: respects an env override that clears the typed external service URL
    set:
      automationService.url: https://automation.example.invalid/api/automation
      env.AUTOMATION_SERVICE_URL: ""
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: ENABLE_AUTOMATIONS, value: "false"}
  - it: treats a null env override of the service URL as unset
    set:
      automationService.url: https://automation.example.invalid/api/automation
      env.AUTOMATION_SERVICE_URL: null
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: ENABLE_AUTOMATIONS, value: "false"}
  - it: preserves an explicit boolean OFF override with a configured service URL
    set:
      automationService.url: https://automation.example.invalid/api/automation
      env.ENABLE_AUTOMATIONS: false
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: ENABLE_AUTOMATIONS, value: "false"}
          count: 1
      - template: deployment.yaml
        notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ENABLE_AUTOMATIONS, value: "true"}
  - it: wires the configured authentication secret for an external automation service
    set:
      automation.enabled: false
      automationService.url: https://automation.example.invalid/api/automation
      automationServiceKey.enabled: true
      automationServiceKey.existingSecret: external-automation-auth
      automationServiceKey.secretKey: token
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTOMATIONS_SERVICE_KEY
            valueFrom:
              secretKeyRef:
                name: external-automation-auth
                key: token
  - it: respects an empty env URL even with the local service enabled
    set:
      automation.enabled: true
      postgresql.primary.persistence.enabled: true
      env.AUTOMATION_SERVICE_URL: ""
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: ENABLE_AUTOMATIONS, value: "false"}
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: AUTOMATION_SERVICE_URL, value: ""}
          count: 1
  - it: respects a whitespace env URL even with the local service enabled
    set:
      automation.enabled: true
      postgresql.primary.persistence.enabled: true
      env.AUTOMATION_SERVICE_URL: " "
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: ENABLE_AUTOMATIONS, value: "false"}
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: AUTOMATION_SERVICE_URL, value: " "}
          count: 1
  - it: treats a null env URL as unset even with the local service enabled
    set:
      automation.enabled: true
      postgresql.primary.persistence.enabled: true
      env.AUTOMATION_SERVICE_URL: null
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: ENABLE_AUTOMATIONS, value: "false"}
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: AUTOMATION_SERVICE_URL, value: ""}
          count: 1
