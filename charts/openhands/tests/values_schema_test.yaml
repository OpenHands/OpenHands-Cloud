suite: openhands values schema validation
templates:
  - service.yaml
tests:
  - it: rejects a non-integer uvicorn.workers
    set:
      uvicorn.workers: "four"
    asserts:
      - failedTemplate:
          errorPattern: "uvicorn/workers.*want integer"
  - it: rejects autoscaling.minReplicas below the minimum
    set:
      autoscaling.minReplicas: 0
    asserts:
      - failedTemplate:
          errorPattern: "autoscaling/minReplicas"
  - it: rejects a non-boolean ingress.enabled
    set:
      ingress.enabled: "yes"
    asserts:
      - failedTemplate:
          errorPattern: "ingress/enabled.*want boolean"
  - it: rejects a non-integer daily conversation limit
    set:
      dailyConversationLimit: "twenty"
    asserts:
      - failedTemplate:
          errorPattern: "dailyConversationLimit"
  - it: rejects a storage backend the app does not support
    set:
      filestore.type: local
    asserts:
      - failedTemplate:
          errorPattern: "filestore/type"
  - it: rejects a non-boolean minio.enabled
    set:
      minio.enabled: "yes"
    asserts:
      - failedTemplate:
          errorPattern: "minio/enabled.*want boolean"
  - it: rejects ClickHouse diagnostic retention above the supported bound
    set:
      laminar.clickhouse.diagnostics.retentionDays: 4
    asserts:
      - failedTemplate:
          errorPattern: "laminar/clickhouse/diagnostics/retentionDays.*maximum: got 4, want 3"
  - it: rejects ClickHouse diagnostic retention below the supported bound
    set:
      laminar.clickhouse.diagnostics.retentionDays: 0
    asserts:
      - failedTemplate:
          errorPattern: "laminar/clickhouse/diagnostics/retentionDays.*minimum: got 0, want 1"
  - it: rejects a non-string filestore.region
    set:
      filestore.region: true
    asserts:
      - failedTemplate:
          errorPattern: "filestore/region.*want string"
  - it: accepts valid values
    set:
      uvicorn.workers: 4
      autoscaling.minReplicas: 2
      ingress.enabled: true
      filestore.type: s3
      filestore.bucket: prod-sessions
      filestore.region: us-west-2
      filestore.endpoint: https://minio.example.com
      filestore.existingSecret: s3-creds
      filestore.accessKeyIdKey: access-key
      filestore.secretAccessKeyKey: secret-key
      laminar.clickhouse.diagnostics.retentionDays: 2
    asserts:
      - notFailedTemplate: {}
