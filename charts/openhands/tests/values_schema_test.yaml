suite: openhands values schema validation
templates:
  - service.yaml
tests:
  - it: rejects a non-integer uvicorn.workers
    set:
      uvicorn.workers: "four"
    asserts:
      - failedTemplate:
          errorPattern: "uvicorn/workers.*want integer"
  - it: rejects autoscaling.minReplicas below the minimum
    set:
      autoscaling.minReplicas: 0
    asserts:
      - failedTemplate:
          errorPattern: "autoscaling/minReplicas"
  - it: rejects a non-boolean ingress.enabled
    set:
      ingress.enabled: "yes"
    asserts:
      - failedTemplate:
          errorPattern: "ingress/enabled.*want boolean"
  - it: rejects orgDefaults.condenser.maxTokens below the minimum
    set:
      orgDefaults.condenser.maxTokens: 0
    asserts:
      - failedTemplate:
          errorPattern: "orgDefaults/condenser/maxTokens"
  - it: rejects negative orgDefaults.condenser.maxTokens
    set:
      orgDefaults.condenser.maxTokens: -1
    asserts:
      - failedTemplate:
          errorPattern: "orgDefaults/condenser/maxTokens"
  - it: rejects a non-integer orgDefaults.condenser.maxTokens
    set:
      orgDefaults.condenser.maxTokens: "200000"
    asserts:
      - failedTemplate:
          errorPattern: "orgDefaults/condenser/maxTokens"
  - it: rejects a non-boolean orgDefaults.condenser.applyToExisting
    set:
      orgDefaults.condenser.applyToExisting: "true"
    asserts:
      - failedTemplate:
          errorPattern: "orgDefaults/condenser/applyToExisting.*want boolean"
  - it: rejects a non-boolean orgDefaults.condenser.overwriteExisting
    set:
      orgDefaults.condenser.overwriteExisting: "false"
    asserts:
      - failedTemplate:
          errorPattern: "orgDefaults/condenser/overwriteExisting.*want boolean"
  - it: rejects a non-integer daily conversation limit
    set:
      dailyConversationLimit: "twenty"
    asserts:
      - failedTemplate:
          errorPattern: "dailyConversationLimit"
  - it: rejects a non-boolean duplicate email check
    set:
      duplicateEmailCheck: "yes"
    asserts:
      - failedTemplate:
          errorPattern: "duplicateEmailCheck.*want boolean"
  - it: rejects a storage backend the app does not support
    set:
      filestore.type: local
    asserts:
      - failedTemplate:
          errorPattern: "filestore/type"
  - it: rejects a non-boolean minio.enabled
    set:
      minio.enabled: "yes"
    asserts:
      - failedTemplate:
          errorPattern: "minio/enabled.*want boolean"
  - it: rejects ClickHouse diagnostic retention above the supported bound
    set:
      laminar.clickhouse.diagnostics.retentionDays: 4
    asserts:
      - failedTemplate:
          errorPattern: "laminar/clickhouse/diagnostics/retentionDays.*maximum: got 4, want 3"
  - it: rejects ClickHouse diagnostic retention below the supported bound
    set:
      laminar.clickhouse.diagnostics.retentionDays: 0
    asserts:
      - failedTemplate:
          errorPattern: "laminar/clickhouse/diagnostics/retentionDays.*minimum: got 0, want 1"
  - it: rejects a non-string filestore.region
    set:
      filestore.region: true
    asserts:
      - failedTemplate:
          errorPattern: "filestore/region.*want string"
  - it: rejects an insecure Enterprise SSO metadata URL
    set:
      enterpriseSSO.idpMetadataUrl: http://idp.example.com/metadata
    asserts:
      - failedTemplate:
          errorPattern: "enterpriseSSO/idpMetadataUrl"
  - it: rejects a bare HTTPS Enterprise SSO metadata URL
    set:
      enterpriseSSO.idpMetadataUrl: https://
    asserts:
      - failedTemplate:
          errorPattern: "enterpriseSSO/idpMetadataUrl"
  - it: rejects whitespace in an Enterprise SSO metadata URL
    set:
      enterpriseSSO.idpMetadataUrl: "https://idp.example.com/saml metadata"
    asserts:
      - failedTemplate:
          errorPattern: "enterpriseSSO/idpMetadataUrl"

  - it: accepts valid values
    set:
      uvicorn.workers: 4
      autoscaling.minReplicas: 2
      ingress.enabled: true
      filestore.type: s3
      filestore.bucket: prod-sessions
      filestore.region: us-west-2
      filestore.endpoint: https://minio.example.com
      filestore.existingSecret: s3-creds
      filestore.accessKeyIdKey: access-key
      enterpriseSSO.idpMetadataUrl: https://idp.example.com/metadata
      filestore.secretAccessKeyKey: secret-key
      laminar.clickhouse.diagnostics.retentionDays: 2
      orgDefaults.condenser.maxTokens: 200000
      orgDefaults.condenser.applyToExisting: true
      orgDefaults.condenser.overwriteExisting: false
    asserts:
      - notFailedTemplate: {}
