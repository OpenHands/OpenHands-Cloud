suite: customer-managed TLS secret
templates:
  - ingress-root.yaml
  - troubleshoot/secrets.yaml
  - troubleshoot/preflights.yaml
  - troubleshoot/support-bundle.yaml
release:
  namespace: kotsadm
set:
  ingress.enabled: true
  ingress.host: app.example.com
  tls.enabled: true
  tls.env: kotsadm
  replicated.enabled: true
tests:
  - it: serves the installer-rendered secret by default
    template: ingress-root.yaml
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: app-all-hands-kotsadm-tls

  - it: keeps the empty-env secret name when tls.env is unset
    template: ingress-root.yaml
    set:
      tls.env: null
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: app-all-hands--tls

  - it: serves the existing secret when one is named
    template: ingress-root.yaml
    set:
      tls.existingSecret: customer-tls
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: customer-tls

  - it: refuses openhands-tls, which the installer owns
    template: ingress-root.yaml
    set:
      tls.existingSecret: openhands-tls
    asserts:
      - failedTemplate:
          errorPattern: 'tls.existingSecret "openhands-tls" is managed by the installer'

  - it: refuses the chart's own rendered secret name
    template: ingress-root.yaml
    set:
      tls.existingSecret: app-all-hands-kotsadm-tls
    asserts:
      - failedTemplate:
          errorPattern: 'tls.existingSecret "app-all-hands-kotsadm-tls" is managed by the installer'

  - it: refuses the Keycloak ingress secret the installer renders
    template: ingress-root.yaml
    set:
      keycloak.ingress.hostname: auth.example.com
      tls.existingSecret: auth.example.com-tls
    asserts:
      - failedTemplate:
          errorPattern: 'tls.existingSecret "auth.example.com-tls" is managed by the installer'

  - it: probes the uploaded certificate from the default namespace when no secret is named
    template: troubleshoot/secrets.yaml
    set:
      keycloak.ingress.secrets:
        - name: auth.example.com-tls
          certificate: "-----BEGIN CERTIFICATE-----"
          key: "-----BEGIN PRIVATE KEY-----"
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-preflight
    asserts:
      - matchRegex:
          path: stringData["preflight.yaml"]
          pattern: 'name: tls-hostname-check\n(\s+#.*\n)*\s+namespace: default\n'
      - matchRegex:
          path: stringData["preflight.yaml"]
          pattern: "name: CERT_B64"
      - notMatchRegex:
          path: stringData["preflight.yaml"]
          pattern: "TLS certificate secret exists"

  - it: probes the existing secret from the release namespace and requires it to exist
    template: troubleshoot/secrets.yaml
    set:
      tls.existingSecret: customer-tls
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-preflight
    asserts:
      - matchRegex:
          path: stringData["preflight.yaml"]
          pattern: 'name: tls-hostname-check\n(\s+#.*\n)*\s+namespace: kotsadm\n'
      - matchRegex:
          path: stringData["preflight.yaml"]
          pattern: 'secretName: "customer-tls"\n\s+optional: true'
      - matchRegex:
          path: stringData["preflight.yaml"]
          pattern: 'CERT_PEM=\$\(cat /etc/openhands-tls/tls\.crt'
      - notMatchRegex:
          path: stringData["preflight.yaml"]
          pattern: "name: CERT_B64"
      - matchRegex:
          path: stringData["preflight.yaml"]
          pattern: 'checkName: "TLS certificate secret exists"\n\s+secretName: "customer-tls"\n\s+namespace: "kotsadm"'
      - matchRegex:
          path: stringData["preflight.yaml"]
          pattern: '- fail:\n\s+message: ''Secret customer-tls with a tls.crt entry was not found'

  - it: collects presence of the existing secret in support bundles
    template: troubleshoot/secrets.yaml
    set:
      tls.existingSecret: customer-tls
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-support-bundle
    asserts:
      - matchRegex:
          path: stringData["support-bundle-spec"]
          pattern: 'name: customer-tls\n\s+namespace: kotsadm\n\s+key: tls.crt'
      - notMatchRegex:
          path: stringData["support-bundle-spec"]
          pattern: 'name: openhands-tls'
