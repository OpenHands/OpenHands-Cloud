suite: jira link method support bundle diagnostics
templates:
  - troubleshoot/secrets.yaml
  - troubleshoot/preflights.yaml
  - troubleshoot/support-bundle.yaml
  - troubleshoot/_shared.tpl
  - troubleshoot/_sysbox.tpl
  - troubleshoot/_tls-hostname.tpl
  - troubleshoot/_sandbox-nodes.tpl
  - troubleshoot/_sandbox-capacity.tpl
release:
  name: openhands
tests:
  - it: reports the Jira Cloud and Jira DC link method and linked-user counts
    set:
      replicated.enabled: true
    asserts:
      - template: troubleshoot/secrets.yaml
        documentIndex: 1
        matchRegex:
          path: stringData.support-bundle-spec
          pattern: '"JIRA_ENABLE_OAUTH", "JIRA_WEBHOOKS_ENABLED"'
      - template: troubleshoot/secrets.yaml
        documentIndex: 1
        matchRegex:
          path: stringData.support-bundle-spec
          pattern: 'replace\("ENABLE_OAUTH", "LINK_METHOD"\)'
      - template: troubleshoot/secrets.yaml
        documentIndex: 1
        matchRegex:
          path: stringData.support-bundle-spec
          pattern: "FROM jira_dc_users GROUP BY"
      - template: troubleshoot/secrets.yaml
        documentIndex: 1
        matchRegex:
          path: stringData.support-bundle-spec
          pattern: "FROM jira_users GROUP BY"
      # Presence only: the client secret value must never be collected.
      - template: troubleshoot/secrets.yaml
        documentIndex: 1
        matchRegex:
          path: stringData.support-bundle-spec
          pattern: "name: jira-app\\n\\s+namespace: \\S+\\n\\s+key: client-secret\\n\\s+includeValue: false"
