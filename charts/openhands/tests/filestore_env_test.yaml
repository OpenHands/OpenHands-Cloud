suite: filestore env wiring
templates:
  - deployment.yaml
  # deployment.yaml unconditionally checksums this ConfigMap into its pod
  # annotations, so it must be compiled alongside it for the render to succeed.
  - litellm-config-script.yaml
tests:
  - it: wires external S3 credentials from an existing secret (real AWS)
    set:
      enabled: true
      filestore.type: s3
      filestore.bucket: prod-sessions
      filestore.region: us-west-2
      filestore.existingSecret: s3-creds
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FILE_STORE
            value: s3
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_S3_BUCKET
            value: prod-sessions
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_REGION
            value: us-west-2
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_S3_SECURE
            value: "true"
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: s3-creds
                key: AWS_ACCESS_KEY_ID
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: s3-creds
                key: AWS_SECRET_ACCESS_KEY
      # No endpoint for real AWS so boto3 targets the regional endpoint.
      - template: deployment.yaml
        notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AWS_S3_ENDPOINT")]

  - it: reads credentials from overridden secret keys
    set:
      enabled: true
      filestore.type: s3
      filestore.bucket: prod-sessions
      filestore.region: us-east-1
      filestore.existingSecret: s3-creds
      filestore.accessKeyIdKey: access-key
      filestore.secretAccessKeyKey: secret-key
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: s3-creds
                key: access-key
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: s3-creds
                key: secret-key

  - it: derives TLS from the endpoint scheme and uses ambient identity when no creds are set
    set:
      enabled: true
      filestore.type: s3
      filestore.bucket: bk
      filestore.endpoint: http://minio.internal:9000
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FILE_STORE
            value: s3
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_S3_ENDPOINT
            value: http://minio.internal:9000
      # http endpoint means plaintext — AWS_S3_SECURE is derived, not configured.
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_S3_SECURE
            value: "false"
      # Keyless: the app relies on IRSA / Pod Identity / instance profile, so no
      # AWS credential env is emitted.
      - template: deployment.yaml
        notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AWS_ACCESS_KEY_ID")]
      - template: deployment.yaml
        notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AWS_SECRET_ACCESS_KEY")]

  # Rejection of unsupported filestore.type values is covered by the schema
  # enum (see values_schema_test.yaml); the template guard in _env.yaml is
  # unreachable behind it and kept only for schema-bypassed renders.

  - it: targets the bundled MinIO when it is deployed and no endpoint or creds are set
    set:
      enabled: true
      minio.enabled: true
      filestore.type: s3
      filestore.bucket: openhands-sessions
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FILE_STORE
            value: s3
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_S3_ENDPOINT
            value: http://RELEASE-NAME-minio:9000
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_S3_SECURE
            value: "false"
      # Falls back to the bundled MinIO's svcaccts credentials.
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            value: default

  - it: prefers explicit configuration over the bundled MinIO fallback
    set:
      enabled: true
      minio.enabled: true
      filestore.type: s3
      filestore.endpoint: https://s3.example.com
      filestore.accessKey: explicit-key
      filestore.secretKey: explicit-secret
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_S3_ENDPOINT
            value: https://s3.example.com
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            value: explicit-key
      - template: deployment.yaml
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            value: default

  - it: normalizes the canonical gcs spelling to the app's native google_cloud
    set:
      enabled: true
      filestore.type: gcs
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FILE_STORE
            value: google_cloud

  - it: wires GCS through FILE_STORE with no S3 env
    set:
      enabled: true
      filestore.type: google_cloud
      filestore.bucket: bk
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FILE_STORE
            value: google_cloud
      # The S3 branch stays dormant, so none of its AWS_S3_* env leaks.
      - template: deployment.yaml
        notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AWS_S3_BUCKET")]

  # Deploying the bundled RustFS must not move anything onto it. Nothing in this
  # chart reads from RustFS yet, so the app stays on MinIO until a later change
  # wires the two together.
  - it: keeps the app on the bundled MinIO when rustfs is enabled
    set:
      enabled: true
      minio.enabled: true
      filestore.type: s3
      rustfs.enabled: true
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_S3_ENDPOINT
            value: http://RELEASE-NAME-minio:9000
