suite: openhands budget preflight hook job
templates:
  - budget-preflight-job.yaml
tests:
  - it: renders nothing on install
    set:
      enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a pre-upgrade hook Job on upgrade with the acknowledge default
    release:
      upgrade: true
    set:
      enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: RELEASE-NAME-budget-preflight
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: budget-preflight
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "5"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation
      - equal:
          path: spec.backoffLimit
          value: 0
      - equal:
          path: spec.activeDeadlineSeconds
          value: 300
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
      - equal:
          path: spec.template.spec.serviceAccountName
          value: openhands-sa
      - equal:
          path: spec.template.metadata.labels.app
          value: RELEASE-NAME-budget-preflight
      - equal:
          path: spec.template.spec.containers[0].name
          value: budget-preflight
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "python -m run_budget_preflight"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BUDGET_PREFLIGHT_PHASE
            value: pre
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BUDGET_PREFLIGHT_MODE
            value: acknowledge

  - it: passes strict mode and the deadline through from values
    release:
      upgrade: true
    set:
      enabled: true
      budgetPreflight.mode: strict
      budgetPreflight.activeDeadlineSeconds: 120
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BUDGET_PREFLIGHT_MODE
            value: strict
      - equal:
          path: spec.activeDeadlineSeconds
          value: 120

  - it: sizes the job container from budgetPreflight.resources
    release:
      upgrade: true
    set:
      enabled: true
      budgetPreflight.resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "100m"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "100m"

  - it: renders no resources when budgetPreflight is disabled
    release:
      upgrade: true
    set:
      enabled: true
      budgetPreflight.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no resources when the release is disabled
    release:
      upgrade: true
    set:
      enabled: false
    asserts:
      - hasDocuments:
          count: 0
