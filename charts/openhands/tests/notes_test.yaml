suite: openhands post-install notes
templates:
  - NOTES.txt
tests:
  - it: shows the access URL when ingress has a host
    set:
      enabled: true
      ingress.enabled: true
      ingress.host: app.example.com
    asserts:
      - matchRegexRaw:
          pattern: "http://app.example.com"
  - it: shows port-forward instructions when ingress is disabled
    set:
      enabled: true
      ingress.enabled: false
    asserts:
      - matchRegexRaw:
          pattern: "kubectl port-forward"
      - matchRegexRaw:
          pattern: "svc/openhands-service 3000:3000"
  - it: reports the app was not deployed when disabled
    set:
      enabled: false
    asserts:
      - matchRegexRaw:
          pattern: "was not deployed by this release"
  - it: warns when values still set the removed redis key
    set:
      enabled: true
      redis.master.resources.requests.cpu: 500m
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: your values still set .redis:."
      - matchRegexRaw:
          pattern: "redis.master.resources            -> valkey.resources"
  - it: stays quiet when values do not set redis
    set:
      enabled: true
    asserts:
      - notMatchRegexRaw:
          pattern: "WARNING: your values still set"

