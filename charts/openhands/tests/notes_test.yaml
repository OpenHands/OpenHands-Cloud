suite: openhands post-install notes
templates:
  - NOTES.txt
tests:
  - it: shows the access URL when ingress has a host
    set:
      enabled: true
      ingress.enabled: true
      ingress.host: app.example.com
    asserts:
      - matchRegexRaw:
          pattern: "http://app.example.com"
  - it: shows port-forward instructions when ingress is disabled
    set:
      enabled: true
      ingress.enabled: false
    asserts:
      - matchRegexRaw:
          pattern: "kubectl port-forward"
      - matchRegexRaw:
          pattern: "svc/openhands-service 3000:3000"
  - it: reports the app was not deployed when disabled
    set:
      enabled: false
    asserts:
      - matchRegexRaw:
          pattern: "was not deployed by this release"
  - it: warns when both cache backends are enabled
    set:
      redis.enabled: true
    asserts:
      - matchRegexRaw:
          pattern: "both cache backends are enabled"
      - matchRegexRaw:
          pattern: "redis.enabled=false"
  # Not scoped to .Values.enabled: the cache subcharts install independently of
  # the enterprise-server, so a server-less release can be misconfigured too.
  - it: warns about both backends even when the app is not deployed
    set:
      enabled: false
      redis.enabled: true
    asserts:
      - matchRegexRaw:
          pattern: "both cache backends are enabled"
  - it: stays quiet at the chart defaults
    asserts:
      - notMatchRegexRaw:
          pattern: "both cache backends are enabled"
  - it: names the pre-upgrade backup database in the 26.3 upgrade warning
    release:
      upgrade: true
    set:
      keycloak.enabled: true
    kubernetesProvider: &live-keycloak-26-3
      scheme:
        "apps/v1/StatefulSet":
          gvr: {group: apps, version: v1, resource: statefulsets}
          namespaced: true
      objects:
        - apiVersion: apps/v1
          kind: StatefulSet
          metadata: {name: keycloak, namespace: NAMESPACE}
          spec:
            template:
              spec:
                containers:
                  - name: keycloak
                    image: docker.io/bitnamilegacy/keycloak:26.3.0-debian-12-r0
    asserts:
      - matchRegexRaw:
          pattern: "backup\\s+is in bitnami_keycloak_backup_26_3_0 "
  - it: does not claim a backup exists when the pre-upgrade backup is disabled
    release:
      upgrade: true
    set:
      keycloak.enabled: true
      keycloak.preUpgradeBackup.enabled: false
    kubernetesProvider: *live-keycloak-26-3
    asserts:
      - matchRegexRaw:
          pattern: "moves Keycloak from docker.io/bitnamilegacy/keycloak:26.3.0"
      - notMatchRegexRaw:
          pattern: "_backup_"
