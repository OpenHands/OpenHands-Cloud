suite: openhands post-install notes
templates:
  - NOTES.txt
tests:
  - it: shows the access URL when ingress has a host
    set:
      enabled: true
      ingress.enabled: true
      ingress.host: app.example.com
    asserts:
      - matchRegexRaw:
          pattern: "http://app.example.com"
  - it: shows port-forward instructions when ingress is disabled
    set:
      enabled: true
      ingress.enabled: false
    asserts:
      - matchRegexRaw:
          pattern: "kubectl port-forward"
      - matchRegexRaw:
          pattern: "svc/openhands-service 3000:3000"
  - it: reports the app was not deployed when disabled
    set:
      enabled: false
    asserts:
      - matchRegexRaw:
          pattern: "was not deployed by this release"
  - it: warns when both cache backends are enabled
    set:
      valkey.enabled: true
    asserts:
      - matchRegexRaw:
          pattern: "both cache backends are enabled"
      - matchRegexRaw:
          pattern: "redis.enabled=false"
  # Not scoped to .Values.enabled: the cache subcharts install independently of
  # the enterprise-server, so a server-less release can be misconfigured too.
  - it: warns about both backends even when the app is not deployed
    set:
      enabled: false
      valkey.enabled: true
    asserts:
      - matchRegexRaw:
          pattern: "both cache backends are enabled"
  - it: stays quiet at the chart defaults
    asserts:
      - notMatchRegexRaw:
          pattern: "both cache backends are enabled"
  - it: names the pre-upgrade backup database in the 26.3 upgrade warning
    release:
      upgrade: true
    set:
      keycloak.enabled: true
    kubernetesProvider: &live-keycloak-26-3
      scheme:
        "apps/v1/StatefulSet":
          gvr: {group: apps, version: v1, resource: statefulsets}
          namespaced: true
      objects:
        - apiVersion: apps/v1
          kind: StatefulSet
          metadata: {name: keycloak, namespace: NAMESPACE}
          spec:
            template:
              spec:
                containers:
                  - name: keycloak
                    image: docker.io/bitnamilegacy/keycloak:26.3.0-debian-12-r0
    asserts:
      - matchRegexRaw:
          pattern: "backup\\s+is in bitnami_keycloak_backup_26_3_0 "
  - it: does not claim a backup exists when the pre-upgrade backup is disabled
    release:
      upgrade: true
    set:
      keycloak.enabled: true
      keycloak.preUpgradeBackup.enabled: false
    kubernetesProvider: *live-keycloak-26-3
    asserts:
      - matchRegexRaw:
          pattern: "moves Keycloak from docker.io/bitnamilegacy/keycloak:26.3.0"
      - notMatchRegexRaw:
          pattern: "_backup_"
  - it: warns when no license is set
    set:
      enabled: true
    asserts:
      - matchRegexRaw:
          pattern: "no OpenHands Enterprise license is set"
      - matchRegexRaw:
          pattern: "OpenHands support will provide your license key"
      - matchRegexRaw:
          pattern: "--set license.key=<license-key>"
  - it: stays quiet about the license when a key is set
    set:
      license.key: my-license-key
    asserts:
      - notMatchRegexRaw:
          pattern: "OpenHands Enterprise license"
  - it: stays quiet about the license when an existing Secret holds it
    set:
      license.existingSecret: my-license
    asserts:
      - notMatchRegexRaw:
          pattern: "OpenHands Enterprise license"
  - it: skips the license warning when the app is not deployed
    set:
      enabled: false
    asserts:
      - notMatchRegexRaw:
          pattern: "OpenHands Enterprise license"
  - it: warns to restart Agent Canvas when the upgrade changes its lock URL
    release:
      upgrade: true
    set:
      ingress.enabled: true
      ingress.host: app.example.com
      tls.enabled: true
    kubernetesProvider: &live-canvas-http
      scheme:
        "v1/ConfigMap":
          gvr: {group: "", version: v1, resource: configmaps}
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ConfigMap
          metadata: {name: agent-canvas-config, namespace: NAMESPACE}
          data:
            AGENT_CANVAS_LOCK_TO_CLOUD: http://app.example.com
    asserts:
      - matchRegexRaw:
          pattern: "changes the Agent Canvas lock URL from\\s+http://app.example.com to https://app.example.com"
      - matchRegexRaw:
          pattern: "kubectl rollout restart deployment/agent-canvas -n NAMESPACE"
  - it: stays quiet about Agent Canvas when its lock URL does not change
    release:
      upgrade: true
    set:
      ingress.enabled: true
      ingress.host: app.example.com
    kubernetesProvider: *live-canvas-http
    asserts:
      - notMatchRegexRaw:
          pattern: "Agent Canvas lock URL"
  - it: stays quiet about Agent Canvas when lockToCloud is set explicitly
    release:
      upgrade: true
    set:
      ingress.enabled: true
      ingress.host: app.example.com
      tls.enabled: true
      agent-canvas.staticServer.lockToCloud: https://app.example.com
    kubernetesProvider: *live-canvas-http
    asserts:
      - notMatchRegexRaw:
          pattern: "Agent Canvas lock URL"
  - it: stays quiet about Agent Canvas on the first upgrade that adds its ConfigMap
    release:
      upgrade: true
    set:
      ingress.enabled: true
      ingress.host: app.example.com
      tls.enabled: true
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr: {group: "", version: v1, resource: configmaps}
          namespaced: true
      objects: []
    asserts:
      - notMatchRegexRaw:
          pattern: "Agent Canvas lock URL"
  - it: stays quiet about Agent Canvas on a fresh install
    set:
      ingress.enabled: true
      ingress.host: app.example.com
      tls.enabled: true
    kubernetesProvider: *live-canvas-http
    asserts:
      - notMatchRegexRaw:
          pattern: "Agent Canvas lock URL"
