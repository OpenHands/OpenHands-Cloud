suite: automation ingress
templates:
  - ingress-automation.yaml
tests:
  - it: does not render when automation is disabled
    set:
      automation.enabled: false
      ingress.enabled: true
      ingress.host: app.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: claims only the API path, leaving /automations to the root ingress
    set:
      automation.enabled: true
      ingress.enabled: true
      ingress.host: app.example.com
    asserts:
      - hasDocuments:
          count: 1
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 1
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /api/automation
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: automation

  - it: puts the events path before the general API path when events are enabled
    set:
      automation.enabled: true
      automation.events.enabled: true
      ingress.enabled: true
      ingress.host: app.example.com
    asserts:
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 2
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /api/automation/v1/events
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: automation-events
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /api/automation
