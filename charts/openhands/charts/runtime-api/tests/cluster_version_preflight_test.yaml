suite: cluster version preflight
# secrets.yaml includes the runtime.troubleshoot.preflights and
# runtime.troubleshoot.supportBundle defines from these two templates, so all
# three are listed; each test scopes its asserts to secrets.yaml.
templates:
  - templates/troubleshoot/secrets.yaml
  - templates/troubleshoot/preflights.yaml
  - templates/troubleshoot/support-bundle.yaml
tests:
  # Contiguous match with literal indentation binds severity, threshold and
  # message to the fail outcome and pins the pass outcome: a revert to 1.26, a
  # fail->warn downgrade, a dedent out of the fail block or a new pass
  # condition each break it.
  - it: fails the preflight below Kubernetes 1.27.0
    template: templates/troubleshoot/secrets.yaml
    set:
      replicated.enabled: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-preflight
    asserts:
      - matchRegex:
          path: stringData["preflight.yaml"]
          pattern: '\n    - clusterVersion:\n        outcomes:\n          - fail:\n              when: "< 1\.27\.0"\n              message: "Kubernetes version 1\.27\.0 or later is required"\n          - pass:\n              message: "Kubernetes version is supported"\n'

  - it: carries the same cluster version check in the support bundle spec
    template: templates/troubleshoot/secrets.yaml
    set:
      replicated.enabled: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-support-bundle
    asserts:
      - matchRegex:
          path: stringData["support-bundle-spec"]
          pattern: '\n    - clusterVersion:\n        outcomes:\n          - fail:\n              when: "< 1\.27\.0"\n              message: "Kubernetes version 1\.27\.0 or later is required"\n          - pass:\n              message: "Kubernetes version is supported"\n'
