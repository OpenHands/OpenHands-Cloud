{{- if .Values.cpuWatcher.enabled }}
# CPU "danger zone" watcher (crypto-mining abuse detection - OHE-3493).
#
# Unlike the other cron jobs in this chart, each run samples repeatedly for
# most of the window between scheduled firings (see runDurationSeconds)
# instead of doing one pass and exiting immediately - a single sample per
# cron tick isn't enough to tell "briefly busy" apart from "sustained high
# CPU". concurrencyPolicy: Forbid is what makes this safe: if a run is still
# sampling when the next schedule tick arrives, the tick is simply skipped
# rather than starting a second concurrent sampler.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "runtime-api.cronjobName" (dict "root" . "suffix" "cpu-watcher") }}
  labels:
    {{- include "runtime-api.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cpuWatcher.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.jobSettings.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.jobSettings.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.cpuWatcher.activeDeadlineSeconds }}
      template:
        spec:
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ .Values.serviceAccount.name }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (include "runtime-api.affinity" .) }}
          affinity:
            {{- . | nindent 12 }}
          {{- end }}
          {{- if .Values.ingressBase.enabled }}
          volumes:
            - name: ingress-base-config
              configMap:
                name: {{ include "runtime-api.fullname" . }}-ingress-base
          {{- end }}
          containers:
          - name: cpu-watcher
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            command: ["python", "cpu_watcher.py"]
            env:
              {{- include "runtime-api.env" . | nindent 14 }}
              - name: DB_POOL_SIZE
                value: {{ .Values.database.poolSize.cronjobs | default 2 | quote }}
              - name: DB_MAX_OVERFLOW
                value: {{ .Values.database.maxOverflow.cronjobs | default 5 | quote }}
              - name: CPU_WATCHER_POLL_INTERVAL_SECONDS
                value: {{ .Values.cpuWatcher.pollIntervalSeconds | quote }}
              - name: CPU_WATCHER_RUN_DURATION_SECONDS
                value: {{ .Values.cpuWatcher.runDurationSeconds | quote }}
              - name: CPU_WATCHER_DANGER_THRESHOLD_PERCENT
                value: {{ .Values.cpuWatcher.dangerThresholdPercent | quote }}
              - name: CPU_WATCHER_GRACE_PERIOD_SECONDS
                value: {{ .Values.cpuWatcher.gracePeriodSeconds | quote }}
            {{- if .Values.ingressBase.enabled }}
            volumeMounts:
              - name: ingress-base-config
                mountPath: /ingress-base
            {{- end }}
            resources:
              {{- toYaml .Values.jobSettings.resources | nindent 14 }}
          restartPolicy: OnFailure
{{- end }}
