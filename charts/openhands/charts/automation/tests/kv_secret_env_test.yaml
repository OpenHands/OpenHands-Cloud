suite: KV store secret env wiring
templates:
  - templates/deployment.yaml
tests:
  - it: reads AUTOMATION_KV_SECRET from the secret, optionally so pods start without it
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTOMATION_KV_SECRET
            valueFrom:
              secretKeyRef:
                name: automation-kv-secret
                key: kv-secret
                optional: true

  - it: leaves the KV store off when no secret reference is configured
    set:
      kvSecretFromSecret: null
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTOMATION_KV_SECRET
          any: true
