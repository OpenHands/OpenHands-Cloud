suite: automation-kv-secret
templates:
  - automation-kv-secret.yaml
tests:
  - it: renders no Secret when automation is disabled
    set:
      automation.enabled: false
      config.automation_kv_secret: "kvsecret"
    asserts:
      - hasDocuments:
          count: 0

  - it: stores the KV secret under the key the automation chart reads
    set:
      automation.enabled: true
      config.automation_kv_secret: "kvsecret"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: automation-kv-secret
      - equal:
          path: data.kv-secret
          value: a3ZzZWNyZXQ=
