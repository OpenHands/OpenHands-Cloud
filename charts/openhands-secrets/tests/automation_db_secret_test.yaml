suite: automation-db-secret
templates:
  - automation-db-secret.yaml
tests:
  - it: renders no Secret when automation is disabled
    set:
      automation.enabled: false
      config.postgres_password: "adminpw"
    asserts:
      - hasDocuments:
          count: 0

  - it: falls back to postgres_password when no automations password is set
    set:
      automation.enabled: true
      config.postgres_password: "adminpw"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: automation-db-secret
      - equal:
          path: data.db-password
          value: YWRtaW5wdw==

  - it: falls back to postgres_password when the automations password is empty
    set:
      automation.enabled: true
      config.postgres_password: "adminpw"
      config.automations_db_password: ""
    asserts:
      - equal:
          path: data.db-password
          value: YWRtaW5wdw==

  - it: uses the automations password when the operator sets one
    set:
      automation.enabled: true
      config.postgres_password: "adminpw"
      config.automations_db_password: "ownpw"
    asserts:
      - equal:
          path: data.db-password
          value: b3ducHc=
