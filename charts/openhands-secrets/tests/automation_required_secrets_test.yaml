suite: Automations companion secrets must be supplied
templates:
- automation-service-key.yaml
- automation-webhook-secret.yaml
- automation-git-sync-secret.yaml
- automation-kv-secret.yaml
- automation-db-secret.yaml
tests:
- it: rejects an empty automation_service_key
  set:
    automation.enabled: true
    config.postgres_password: TEST-ONLY
    config.automation_service_key: ''
    config.automation_webhook_secret: TEST-ONLY
    config.automation_git_sync_secret: TEST-ONLY
    config.automation_kv_secret: TEST-ONLY
    config.automations_db_password: TEST-ONLY
  asserts:
  - template: automation-service-key.yaml
    failedTemplate:
      errorPattern: config.automation_service_key must be supplied
- it: rejects an empty automation_webhook_secret
  set:
    automation.enabled: true
    config.postgres_password: TEST-ONLY
    config.automation_service_key: TEST-ONLY
    config.automation_webhook_secret: ''
    config.automation_git_sync_secret: TEST-ONLY
    config.automation_kv_secret: TEST-ONLY
    config.automations_db_password: TEST-ONLY
  asserts:
  - template: automation-webhook-secret.yaml
    failedTemplate:
      errorPattern: config.automation_webhook_secret must be supplied
- it: rejects an empty automation_git_sync_secret
  set:
    automation.enabled: true
    config.postgres_password: TEST-ONLY
    config.automation_service_key: TEST-ONLY
    config.automation_webhook_secret: TEST-ONLY
    config.automation_git_sync_secret: ''
    config.automation_kv_secret: TEST-ONLY
    config.automations_db_password: TEST-ONLY
  asserts:
  - template: automation-git-sync-secret.yaml
    failedTemplate:
      errorPattern: config.automation_git_sync_secret must be supplied
- it: rejects an empty automation_kv_secret
  set:
    automation.enabled: true
    config.postgres_password: TEST-ONLY
    config.automation_service_key: TEST-ONLY
    config.automation_webhook_secret: TEST-ONLY
    config.automation_git_sync_secret: TEST-ONLY
    config.automation_kv_secret: ''
    config.automations_db_password: TEST-ONLY
  asserts:
  - template: automation-kv-secret.yaml
    failedTemplate:
      errorPattern: config.automation_kv_secret must be supplied
- it: rejects a missing database password
  set:
    automation.enabled: true
    config.postgres_password: ''
    config.automation_service_key: TEST-ONLY
    config.automation_webhook_secret: TEST-ONLY
    config.automation_git_sync_secret: TEST-ONLY
    config.automation_kv_secret: TEST-ONLY
    config.automations_db_password: ''
  asserts:
  - template: automation-db-secret.yaml
    failedTemplate:
      errorPattern: config.automations_db_password
