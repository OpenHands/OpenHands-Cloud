{{- if .Values.automation.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: automation-kv-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  kv-secret: {{ .Values.config.automation_kv_secret | required "config.automation_kv_secret must be supplied when automation.enabled=true; retain the existing value on upgrade" | b64enc | quote }}
{{- end }}
