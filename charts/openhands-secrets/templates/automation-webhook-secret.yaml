{{- if .Values.automation.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: automation-webhook-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  webhook-secret: {{ .Values.config.automation_webhook_secret | required "config.automation_webhook_secret must be supplied when automation.enabled=true; retain the existing value on upgrade" | b64enc | quote }}
{{- end }}
