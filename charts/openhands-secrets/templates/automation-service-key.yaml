{{- if .Values.automation.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: automation-service-key
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  automation-service-key: {{ .Values.config.automation_service_key | required "config.automation_service_key must be supplied when automation.enabled=true; retain the existing value on upgrade" | b64enc | quote }}
{{- end }}
