{{- if .Values.automation.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: automation-db-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  # The operator only sets automations_db_password when they provisioned the
  # role themselves; otherwise the bootstrap creates the role with the admin
  # password, which is what every install rendered before this fallback.
  db-password: {{ .Values.config.automations_db_password | default .Values.config.postgres_password | b64enc | quote }}
{{- end }}
