{{- if .Values.automation.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: automation-git-sync-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  git-sync-secret: {{ .Values.config.automation_git_sync_secret | required "config.automation_git_sync_secret must be supplied when automation.enabled=true; retain the existing value on upgrade" | b64enc | quote }}
{{- end }}
